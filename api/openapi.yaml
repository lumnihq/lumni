  /v1/analytics/anomalies:
    get:
      summary: Detect fleet-wide loops, runaways and drift
      operationId: console_get_v1_analytics_anomalies
      tags:
      - Console API
      description: >-
        Requires query scope. Loop detection uses a sliding ten-minute window
        with lookback before from for loops continuing inside the range.
        Runaways require at least ten actions per hour and more than three times
        the mean of active hours in the preceding six hours, excluding the
        candidate hour. Drift requires at least twenty actions and more than
        five percent rechecks. Runaway and drift totals use exact inclusive from
        and exclusive to boundaries.
      parameters:
      - $ref: '#/components/parameters/ConsoleFrom'
      - $ref: '#/components/parameters/ConsoleTo'
      - $ref: '#/components/parameters/ConsoleTZ'
      - name: kinds
        in: query
        schema:
          type: string
          default: loop,runaway,drift
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Anomaly'
        default:
          $ref: '#/components/responses/Error'
