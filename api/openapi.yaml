openapi: 3.1.0
info:
  title: Lumni Coordination API
  version: 0.2.0
  description: Deterministic coordination, shadow analysis, and action admission for
    autonomous work.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/onboarding/codes:
    post:
      operationId: createOnboardingCode
      summary: Create a single-use onboarding credential
      description: Admin scope. Session writes require X-CSRF-Token. Only a hash is stored; expiry is at most fifteen minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  default: [ingest, query, runtime, admission]
                  items:
                    type: string
                    enum: [ingest, query, runtime, admission, verification, payload, admin]
                expires_in_minutes:
                  type: integer
                  minimum: 1
                  maximum: 15
                  default: 15
                actor_hint:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: One-time code, returned only at creation
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /v1/onboarding/exchange:
    post:
      operationId: exchangeOnboardingCode
      summary: Atomically exchange a code for a scoped API key
      security: []
      description: >-
        The code is the credential. A code works once across all API instances.
        Unknown, used, expired, and revoked-issuer codes return the same 404.
        Limited to ten attempts per minute per transport peer. Credential
        responses use Cache-Control no-store. Set LUMNI_PUBLIC_BASE_URL behind a proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 128
                host:
                  type: string
                  maxLength: 200
                project:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Scoped key issued exactly once
          content:
            application/json:
              schema:
                type: object
                required: [api_key, key_id, tenant_name, api_url, actor_hint]
                properties:
                  api_key:
                    type: string
                  key_id:
                    type: string
                  tenant_name:
                    type: string
                  api_url:
                    type: string
                    format: uri
                  actor_hint:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/onboarding/codes/{code}/status:
    get:
      operationId: onboardingCodeStatus
      summary: Read onboarding progress for the administrator's tenant
      description: Admin scope. Code values are redacted from access logs. Response is never cached.
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whether the code was exchanged, its actor, and the machine, project and issued key recorded at exchange. Machine and project are null for codes exchanged before migration 24.
          content:
            application/json:
              schema:
                type: object
                required: [used, used_at, actor_id, host, project, key_id]
                properties:
                  used:
                    type: boolean
                  used_at:
                    type: [string, 'null']
                    format: date-time
                  actor_id:
                    type: [string, 'null']
                  host:
                    type: [string, 'null']
                  project:
                    type: [string, 'null']
                  key_id:
                    type: [string, 'null']
                    format: uuid
        default:
          $ref: '#/components/responses/Error'
  /v1/health/live:
    get:
      security: []
      operationId: live
      responses:
        '200':
          description: Process is live
  /v1/health/ready:
    get:
      security: []
      operationId: ready
      responses:
        '200':
          description: Database is ready
  /v1/auth/session:
    post:
      operationId: createBrowserSession
      description: Exchange a bearer API key for an HttpOnly browser session and one-time
        CSRF token.
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
    get:
      security:
      - cookieAuth: []
      - bearerAuth: []
      operationId: getBrowserSession
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
    delete:
      security:
      - cookieAuth: []
      operationId: deleteBrowserSession
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/composio/connections:
    get:
      operationId: listComposioConnections
      description: Query scope. Lists tenant-owned GitHub pilot connections; enabled
        is false when Composio is disabled.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: connectComposioGitHub
      description: Admin scope. Starts hosted OAuth for an administrator-selected
        repository, with explicit cloud consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - repository
              - cloud_processing_consent
              properties:
                repository:
                  type: string
                  pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                cloud_processing_consent:
                  type: boolean
                  const: true
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/composio/connections/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: refreshComposioConnection
      description: Admin scope. Verifies account ownership and prepares the allowlisted
        session when active.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectComposioConnection
      description: Admin scope. Disables locally before deleting the connected account
        in Composio.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/composio/connections/{id}/pull-requests/{number}:
    parameters:
    - $ref: '#/components/parameters/ID'
    - in: path
      name: number
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: readComposioPullRequest
      description: Query scope. Fresh GitHub read restricted to the connection repository;
        returns observed_version for admission.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/composio/connections/{id}/execute:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: executeComposioPullRequestState
      description: Admission scope. Checks and starts once before a named GitHub tool
        call; outcome remains pending until fresh verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action_id
              - work_id
              - actor_id
              - number
              - state
              - observed_version
              properties:
                action_id:
                  type: string
                  minLength: 1
                work_id:
                  type: string
                  minLength: 1
                actor_id:
                  type: string
                  minLength: 1
                number:
                  type: integer
                  minimum: 1
                state:
                  type: string
                  enum:
                  - open
                  - closed
                observed_version:
                  type: string
                  minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/composio/connections/{id}/metrics:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: composioConnectionMetrics
      description: Query scope. Tenant-scoped request counts and mean/p95 latency
        grouped by READ, EXECUTE, VERIFY and status.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/webhooks/composio:
    post:
      operationId: composioWebhook
      security: []
      description: Signed V3 GitHub trigger ingestion. Requires webhook-id, webhook-timestamp,
        webhook-signature and x-composio-webhook-version V3 headers. Tenant comes
        from the registered account/user pair.
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actors:
    post:
      operationId: putActor
      requestBody:
        $ref: '#/components/requestBodies/Actor'
      responses:
        '201':
          $ref: '#/components/responses/Actor'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listActors
      description: Query scope. Newest-first tenant actors with time, type, and cursor filters. since aliases inclusive from; preserve filters while paging.
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/ConsoleCursor'
      - $ref: '#/components/parameters/ConsoleFrom'
      - $ref: '#/components/parameters/ConsoleTo'
      - $ref: '#/components/parameters/ConsoleLimit'
      - in: query
        name: since
        description: Inclusive alias for from. If both are supplied, they must agree.
        schema:
          type: string
          format: date-time
      - in: query
        name: type
        schema:
          type: string
          enum: [AGENT, HUMAN, SERVICE, CRON, WEBHOOK, CI, WORKFLOW, SYSTEM]
  /v1/actors/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getActor
      responses:
        '200':
          $ref: '#/components/responses/Actor'
        default:
          $ref: '#/components/responses/Error'
  /v1/agents:
    post:
      operationId: putAgent
      requestBody:
        $ref: '#/components/requestBodies/Agent'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listAgents
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions:
    post:
      operationId: startSession
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/complete:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: completeSession
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/work:
    post:
      operationId: startWork
      requestBody:
        $ref: '#/components/requestBodies/Work'
      responses:
        '201':
          $ref: '#/components/responses/Work'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listWork
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getWork
      responses:
        '200':
          $ref: '#/components/responses/Work'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}/complete:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: completeWork
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}/fail:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: failWork
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: cancelWork
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}/supersede:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: supersedeWork
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/work/{id}/graph:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getWorkGraph
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/observations:
    post:
      operationId: recordObservation
      requestBody:
        $ref: '#/components/requestBodies/Observation'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/observations/batch:
    post:
      operationId: recordObservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Observation'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/check:
    post:
      operationId: checkAction
      requestBody:
        $ref: '#/components/requestBodies/ActionCheck'
      responses:
        '200':
          $ref: '#/components/responses/Decision'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/observe:
    post:
      operationId: observeAction
      requestBody:
        $ref: '#/components/requestBodies/ActionCheck'
      responses:
        '200':
          $ref: '#/components/responses/Decision'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getAction
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/start:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: startAction
      requestBody:
        $ref: '#/components/requestBodies/LeaseToken'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/heartbeat:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: heartbeatAction
      requestBody:
        $ref: '#/components/requestBodies/LeaseToken'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/result:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: reportActionResult
      requestBody:
        $ref: '#/components/requestBodies/ActionResult'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/cancel-reservation:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: cancelUnstartedReservation
      description: Release a reservation only if the action has not started.
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/resources:
    get:
      operationId: listResources
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
  /v1/resources/resolve:
    post:
      operationId: putResource
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/resources/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getResource
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/resources/{id}/version:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: updateResourceVersion
      requestBody:
        $ref: '#/components/requestBodies/ResourceVersion'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals:
    get:
      summary: List approvals, including pending approvals older than the recent page
      operationId: console_get_v1_approvals
      tags:
      - Console API
      description: Requires query scope. Session-cookie writes require X-CSRF-Token.
      parameters:
      - $ref: '#/components/parameters/ConsoleFrom'
      - $ref: '#/components/parameters/ConsoleTo'
      - $ref: '#/components/parameters/ConsoleLimit'
      - $ref: '#/components/parameters/ConsoleCursor'
      - $ref: '#/components/parameters/ConsoleStatus'
      - $ref: '#/components/parameters/ConsoleActionID'
      - name: include
        in: query
        schema:
          type: string
        description: Comma-separated action,rule embeddings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsoleApproval'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      operationId: getApproval
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/{id}/approve:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: approve
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/approvals/{id}/deny:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      operationId: deny
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/events:
    post:
      operationId: ingestEvent
      requestBody:
        $ref: '#/components/requestBodies/Event'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/events/batch:
    post:
      operationId: ingestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Event'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/costs:
    post:
      operationId: recordCost
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/finops/summary:
    get:
      operationId: finopsSummary
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/finops/graph:
    get:
      operationId: finopsGraph
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: FinOps allocation graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinOpsGraph'
        default:
          $ref: '#/components/responses/Error'
  /v1/api-keys:
    get:
      operationId: listAPIKeys
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAPIKey
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/api-keys/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    delete:
      operationId: revokeAPIKey
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/config:
    get:
      operationId: getConfiguration
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/config/mode:
    put:
      operationId: setEnforcementMode
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/config/semantic:
    put:
      summary: Opt this tenant into or out of advisory semantic evaluation
      operationId: setSemanticEvaluation
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '200':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/semantic-evaluations:
    get:
      summary: List advisory semantic evaluation audit records
      operationId: listSemanticEvaluations
      responses:
        '200':
          $ref: '#/components/responses/List'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
          description: Tenant-scoped page of metadata with an opaque next_cursor;
            no encrypted payloads
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/ConsoleFrom'
      - $ref: '#/components/parameters/ConsoleTo'
      - $ref: '#/components/parameters/ConsoleLimit'
      - $ref: '#/components/parameters/ConsoleCursor'
  /v1/semantic-evaluations/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      summary: Read one advisory semantic evaluation audit record
      operationId: getSemanticEvaluation
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
  /v1/config/resource-rules:
    get:
      operationId: listResourceRules
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createResourceRule
      requestBody:
        $ref: '#/components/requestBodies/JSON'
      responses:
        '201':
          $ref: '#/components/responses/JSON'
        default:
          $ref: '#/components/responses/Error'
  /v1/config/conflict-rules:
    get:
      operationId: listConflictRules
      responses:
        '200':
          $ref: '#/components/responses/List'
        default:
          $ref: '#/components/responses/Error'
