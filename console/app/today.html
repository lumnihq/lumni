<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lumni, Today</title>
<link rel="stylesheet" href="/lib/base.css" />
<style>
  :root { --k-stop: var(--accent); --k-recheck: #f08a24; --k-wait: #3b9eff; --k-ask: var(--ink); --k-bad: var(--red); }
  .wrap { padding: 36px 40px 48px; }
  .hello .eyebrow { font-size: 14px; }
  .hello h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 4px; }
  .hello h1 .line { display: block; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.32; margin-top: 10px; max-width: 1180px; }
  .hello h1 .soft { color: var(--ink3); }
  .hello h1 mark { background: var(--accent-soft); border-radius: 12px; padding: 0 12px; color: var(--accent); white-space: nowrap; }
  .hello h1 .num { display: inline-block; }

  /* The number row: four numbers, each with its day. */
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 30px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .nums > div { padding: 20px 28px 20px 0; min-width: 0; }
  .nums > div + div { padding-left: 28px; border-left: 1px solid var(--line); }
  .nums .lab { font-size: 13.5px; color: var(--ink2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nums .mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 4px; }
  .nums b { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap; }
  .nums svg { width: 112px; height: 36px; flex: none; overflow: visible; margin-bottom: 6px; }
  .nums .sub { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--ink2); font-weight: 550; white-space: nowrap; }
  .delta { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--pop); color: var(--ink); }
  .delta.flat { background: var(--wash); color: var(--ink2); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; margin-top: 26px; }

  /* The catch of the day. */
  .hero { padding: 26px 28px 24px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .hero-top { display: flex; align-items: center; gap: 8px; }
  .hero h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 14px; line-height: 1.2; }
  .hero h2 + p { color: var(--ink2); margin-top: 6px; max-width: 600px; }
  .hero .open { margin-left: auto; }

  .scene { position: relative; height: 262px; margin-top: 14px; }
  .slip {
    position: absolute;
    width: 300px; height: 182px;
    border-radius: 18px;
    background: linear-gradient(160deg, #ffffff 0%, #f6f7f4 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 26px 44px -22px rgba(10,15,28,.38), 0 0 0 1px var(--line);
    padding: 18px 20px;
    font-size: 13px;
  }
  .slip .k { color: var(--ink2); font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .slip .amt { font-size: 42px; font-weight: 700; letter-spacing: -0.04em; margin-top: 6px; line-height: 1; }
  .slip .to { font-size: 14.5px; font-weight: 600; margin-top: 6px; white-space: nowrap; }
  .slip .meta { position: absolute; left: 20px; right: 20px; bottom: 14px; display: flex; justify-content: space-between; color: var(--ink2); font-weight: 550; white-space: nowrap; }
  .slip .perf { position: absolute; left: 0; right: 0; bottom: 44px; border-top: 2px dashed var(--line2); }
  .mark { width: 22px; height: 22px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 11px; display: grid; place-items: center; flex: none; }
  .ok-mark { color: var(--allow); font-weight: 700; margin-left: auto; }

  /* One story: two slips. */
  .pair .slip.back { left: 260px; top: 10px; transform: rotate(-5deg); opacity: .92; animation: inBack .9s var(--ease) .1s both; }
  .pair .slip.front { left: 330px; top: 46px; transform: rotate(3deg); animation: inFront 1s var(--spring) .35s both; }
  @keyframes inBack { from { opacity: 0; transform: translateX(-60px) rotate(-12deg); } }
  @keyframes inFront { from { opacity: 0; transform: translate(120px, 30px) rotate(14deg); } }

  /* Many: a fanned stack. */
  .fan { position: absolute; left: 50%; top: 22px; width: 300px; height: 182px; margin-left: -110px; }
  .fan .slip { left: 0; top: 0; transform-origin: 50% 160%; animation: deal .7s var(--spring) both; }
  .fan .slip:not(:last-child) { background: linear-gradient(160deg, #fbfbfc 0%, #f1f2ef 100%); }
  @keyframes deal { from { opacity: 0; transform: translate(40px, 120px) rotate(10deg); } }
  .count {
    position: absolute; right: -34px; top: -18px; z-index: 20;
    background: var(--ink); color: #fff; border-radius: 16px; padding: 6px 14px 7px;
    font-size: 30px; font-weight: 750; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap;
    box-shadow: 0 16px 30px -12px rgba(13,14,20,.55);
    animation: pop .55s var(--spring) 1.95s both;
  }
  .count small { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 0; color: rgba(255,255,255,.66); margin-top: 1px; }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } }

  .stamp {
    position: absolute;
    padding: 8px 18px;
    border-radius: 12px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(2px);
    border: 3px solid var(--accent);
    color: var(--accent);
    font-size: 28px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15;
    transform: rotate(-9deg);
    box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4.5px var(--accent-line), 0 14px 30px -10px rgba(91,75,245,.45);
    animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1.45s both;
    z-index: 10; white-space: nowrap;
  }
  .pair .stamp { left: 470px; top: 148px; }
  .fan .stamp { left: 118px; top: 104px; }
  .stamp small { display: block; font-size: 12px; font-weight: 700; margin-top: -2px; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-9deg) scale(2.6); } 60% { opacity: 1; } }
  .shake { animation-name: inFront, shake; animation-duration: 1s, .35s; animation-delay: .35s, 1.75s; animation-timing-function: var(--spring), ease; animation-fill-mode: both, both; }
  .fan .shake { animation-name: deal, shake; animation-duration: .7s, .35s; animation-fill-mode: both, both; animation-timing-function: var(--spring), ease; }
  @keyframes shake { 25% { translate: -4px 2px; } 50% { translate: 3px -2px; } 75% { translate: -2px 1px; } }

  .facts { position: absolute; top: 18px; display: flex; flex-direction: column; gap: 20px; width: 190px; z-index: 5; }
  .facts.l { left: 0; }
  .facts.r { right: 0; text-align: right; }
  .facts small { display: block; font-size: 12.5px; color: var(--ink2); font-weight: 600; white-space: nowrap; }
  .facts b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; display: block; line-height: 1.25; }
  .facts b.kept { color: var(--accent); }
  .facts em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink2); font-weight: 550; white-space: nowrap; }
  .facts .f { animation: rise .6s var(--ease) both; }

  /* When they happened: 24 hours. */
  .strip { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
  .strip-h { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; font-weight: 650; }
  .strip-h span { color: var(--ink2); font-weight: 550; }
  .bars { position: relative; display: grid; grid-template-columns: repeat(24, 1fr); gap: 5px; height: 58px; align-items: end; margin-top: 12px; }
  .bars i { display: block; border-radius: 3px 3px 1px 1px; background: var(--accent-line); transform-origin: bottom; animation: growY .8s var(--ease) both; min-height: 3px; }
  .bars i.peak { background: var(--accent); }
  .bars i.later { background: var(--wash); }
  @keyframes growY { from { transform: scaleY(0); } }
  .bars .note { position: absolute; top: -4px; transform: translateX(-50%); font-size: 12px; font-weight: 650; color: var(--accent); white-space: nowrap; background: #fff; padding: 0 6px; }
  .axis { position: relative; height: 16px; margin-top: 6px; font-size: 11.5px; color: var(--ink3); font-weight: 600; }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .axis .now { color: var(--ink); }

  /* The little route, the same shape as the Journey. */
  .route { position: relative; height: 70px; margin-top: auto; }
  .route svg { position: absolute; inset: 0; width: 100%; height: 70px; overflow: visible; }
  .route .lbl { position: absolute; top: 40px; transform: translateX(-50%); font-size: 12.5px; font-weight: 650; white-space: nowrap; text-align: center; }
  .route .lbl small { display: block; font-weight: 500; color: var(--ink2); }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s var(--ease) .5s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Lumni's brief. */
  .brief { padding: 24px 24px 20px; background: linear-gradient(180deg, #f2f0ff 0%, #f8f7ff 100%); border-color: var(--accent-line); min-width: 0; }
  .brief h3 { text-wrap: balance; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; margin-top: 12px; }
  .brief h4 { font-size: 13px; font-weight: 650; color: var(--ink2); margin: 22px 0 10px; display: flex; }
  .brief h4 a { margin-left: auto; color: var(--accent); }
  .why { display: flex; flex-direction: column; gap: 11px; }
  .why-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) 52px 58px; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 550; }
  .why-row .dot { width: 8px; height: 8px; border-radius: 50%; }
  .why-row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .why-row b { font-variant-numeric: tabular-nums; text-align: right; }
  .why-row .track { height: 5px; border-radius: 3px; background: rgba(91,75,245,.08); overflow: hidden; }
  .why-row .track i { display: block; height: 100%; border-radius: 3px; transform-origin: left; animation: grow 1s var(--ease) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .todo { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 8px; background: #fff; transition: transform .2s var(--ease), box-shadow .2s; }
  .todo:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1px var(--ink3), var(--shadow); }
  .todo .tx { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .todo .tx > span, .todo .tx small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todo .tx small { font-weight: 500; color: var(--ink2); font-size: 12.5px; margin-top: 1px; }
  .todo .tx small i { font-style: normal; color: var(--ink); font-weight: 650; }
  .todo .btn { height: 32px; font-size: 13px; padding: 0 12px; flex: none; }
  .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 800; }
  .ic.ask { background: var(--ink); color: #fff; }
  .ic.bad { background: var(--bad-bg); color: var(--red); }
  .ic.plain { background: var(--wash); }
  .calm { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.6); color: var(--ink2); font-size: 13.5px; margin-bottom: 8px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .mini { padding: 22px 24px; min-width: 0; }
  .mini h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .mini h3 a { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 600; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(91,75,245,.18); animation: pulse 1.6s infinite; }
  .pulse.off { background: var(--ink3); box-shadow: none; animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(91,75,245,0); } }
  .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 10px; white-space: nowrap; }
  .big small { font-size: 14px; color: var(--ink2); font-weight: 550; letter-spacing: 0; }

  /* Right now: one square per AI. */
  .matrix { display: flex; flex-wrap: wrap; margin-top: 16px; }
  .matrix i { display: block; border-radius: 3px; background: var(--line2); transition: background .9s var(--ease); }
  .matrix i.w { background: var(--accent); }
  .matrix i.r { background: var(--k-recheck); }
  .matrix i.q { background: var(--k-wait); }
  .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 12.5px; color: var(--ink2); font-weight: 550; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; }
  .teams { margin-top: 16px; border-top: 1px solid var(--line); }
  .team { display: grid; grid-template-columns: 28px minmax(0, 1fr) 90px 150px; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .team:last-child { border: 0; padding-bottom: 0; }
  .team b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 650; }
  .team small { color: var(--ink2); font-weight: 500; font-size: 12.5px; }
  .team .bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  .team .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transform-origin: left; animation: grow 1s var(--ease) both; }

  .spend svg { width: 100%; height: 190px; margin-top: 14px; overflow: visible; display: block; }
  .spend .split { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .spend .split div + div { padding-left: 18px; border-left: 1px solid var(--line); }
  .spend .split small { display: block; font-size: 12.5px; color: var(--ink2); font-weight: 600; white-space: nowrap; }
  .spend .split b { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .empty { padding: 30px 0; color: var(--ink2); text-align: center; font-size: 14px; }
  .dis { margin-left: auto; font-size: 13px; color: var(--ink3); font-weight: 600; cursor: not-allowed; }
  .spend .split b.one { display: inline-block; max-width: 120px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .team .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.btn { font: inherit; }
  .todo .btn[data-check] { height: 32px; font-size: 13px; padding: 0 12px; }

  /* Your workspace: one tile per AI. */
  .fleet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .fl { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
  .fl .sq { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 10.5px; font-weight: 750; background: var(--line2); color: var(--ink2); transition: background .9s var(--ease); }
  .fl.on .sq { background: var(--accent); color: #fff; }
  .fl.loop .sq { background: var(--k-recheck); color: #fff; }
  .fl .nm { min-width: 0; flex: 1; }
  .fl .nm b { display: block; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl .nm small { display: block; font-size: 11.5px; color: var(--ink2); }
  .fl em { font-style: normal; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .paused { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; padding: 14px 16px 14px 18px; border-radius: 16px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); font-size: 14.5px; color: var(--ink2); transition: opacity .4s var(--ease), transform .4s var(--ease); }
  .paused.gone { opacity: 0; transform: translateY(-6px); }
  .paused .tx { flex: 1; }
  .paused .btn { font-size: 13.5px; font-weight: 650; }
  .paused .tx b { color: var(--ink); font-weight: 650; }
  .paused .pz { display: flex; gap: 4px; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); align-items: center; justify-content: center; flex: none; }
  .paused .pz i { width: 4px; height: 12px; border-radius: 2px; background: #fff; }
  .btn.confirm { background: var(--ink); color: #fff; box-shadow: none; }
  .calm-scene { display: grid; place-items: center; }
  .ghost .slip { position: relative; transform: rotate(-3deg); opacity: .8; }
  .ghost .slip .amt { color: var(--ink3); }

  /* ─── Live: the header and the console ─────────────── */
  .lhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .lhead .eyebrow { display: flex; align-items: center; gap: 12px; }
  .live-sw { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px; font: 650 13px var(--sans); color: var(--ink2); background: #fff; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background .3s var(--ease), color .3s, box-shadow .3s; }
  .live-sw i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); }
  .live-sw.on { color: #fff; background: var(--ink); box-shadow: 0 8px 20px -10px rgba(13,14,20,.6); }
  .live-sw.on i { background: #ff4d5e; box-shadow: 0 0 0 0 rgba(255,77,94,.6); animation: livedot 1.6s infinite; }
  .live-sw small { font-size: 12px; font-weight: 550; opacity: .7; }
  @keyframes livedot { 70% { box-shadow: 0 0 0 7px rgba(255,77,94,0); } }
  .hello .bump { display: inline-block; animation: bump .45s var(--spring); }
  @keyframes bump { 40% { transform: translateY(-3px) scale(1.06); color: var(--accent); } }

  .console {
    position: relative; margin-top: 26px; border-radius: 26px; overflow: hidden; color: #fff;
    background: radial-gradient(900px 260px at 78% -10%, rgba(123,109,255,.32), transparent 70%), radial-gradient(600px 220px at 0% 120%, rgba(59,158,255,.14), transparent 70%), linear-gradient(180deg, #12131d 0%, #0b0c13 100%);
    box-shadow: 0 30px 60px -30px rgba(13,14,20,.65), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .c-top { display: flex; align-items: center; gap: 18px; padding: 20px 26px 0; }
  .c-title b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .c-title span { display: block; font-size: 12.5px; color: rgba(255,255,255,.55); font-weight: 550; margin-top: 2px; }
  .c-legend { margin-left: auto; display: flex; gap: 16px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.6); }
  .c-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .c-legend i { width: 8px; height: 8px; border-radius: 50%; }
  .c-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .c-stage { position: relative; height: 270px; margin: 6px 0 0 8px; }
  .c-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .c-quiet { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; color: rgba(255,255,255,.6); font-size: 14px; font-weight: 550; pointer-events: none; transition: opacity .6s; }
  .c-quiet b { display: block; color: #fff; font-size: 17px; font-weight: 650; margin-bottom: 4px; }
  .c-quiet.gone { opacity: 0; }
  .bubble {
    position: absolute; transform: translate(-50%, calc(-100% - 14px)); padding: 7px 11px 8px; border-radius: 12px; white-space: nowrap; pointer-events: auto;
    background: rgba(20,21,33,.92); box-shadow: 0 10px 24px -10px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.1);
    font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.75); line-height: 1.3; animation: bub .5s var(--spring) both; transition: opacity .8s; text-decoration: none;
  }
  .bubble b { display: block; color: #fff; font-size: 13px; font-weight: 700; }
  .bubble b em { font-style: normal; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); background: inherit; box-shadow: inset -1px -1px 0 rgba(255,255,255,.1); }
  .bubble.fade { opacity: 0; }
  @keyframes bub { from { opacity: 0; transform: translate(-50%, calc(-100% - 2px)) scale(.8); } }
  .c-axis { position: absolute; left: 0; right: 0; bottom: 6px; height: 14px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.35); pointer-events: none; }
  .c-axis span { position: absolute; transform: translateX(-50%); }
  .c-axis .now { color: rgba(255,255,255,.85); transform: translateX(-100%); }

  .c-side { padding: 14px 26px 0 22px; border-left: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; }
  .c-rate { display: flex; align-items: baseline; gap: 10px; }
  .c-rate b { font-size: 44px; font-weight: 750; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .c-rate small { font-size: 13px; color: rgba(255,255,255,.55); font-weight: 600; line-height: 1.25; }
  .c-kinds { margin-top: 16px; display: flex; flex-direction: column; gap: 4px; }
  .ck { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; margin: 0 -10px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.8); transition: background .6s var(--ease); }
  .ck i { width: 9px; height: 9px; border-radius: 50%; }
  .ck b { font-size: 18px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; text-align: right; }
  .ck b small { font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.45); margin-left: 6px; }
  .ck.hit { background: rgba(255,255,255,.08); }
  .ck.hit b { animation: bump .45s var(--spring); }
  .c-since { margin-top: auto; padding: 12px 0 4px; font-size: 11.5px; color: rgba(255,255,255,.4); font-weight: 550; }

  .c-feed { border-top: 1px solid rgba(255,255,255,.07); padding: 6px 14px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 8px; min-height: 66px; }
  .fe { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; color: #fff; text-decoration: none; animation: feedIn .55s var(--spring) both; transition: background .2s; min-width: 0; }
  .fe:hover { background: rgba(255,255,255,.06); }
  .fe .av { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 11px; font-weight: 750; color: #fff; }
  .fe .tx { min-width: 0; }
  .fe .tx b { display: block; font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fe .tx small { display: block; font-size: 12px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .fe .tx small em { font-style: normal; font-weight: 700; }
  .fe-none { grid-column: 1 / -1; padding: 14px 12px; font-size: 13px; color: rgba(255,255,255,.45); font-weight: 550; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  /* Nothing arriving: fold down to one calm line, and open up when the AIs act. */
  .c-body, .c-feed { max-height: 420px; transition: max-height .7s var(--ease), opacity .5s var(--ease), padding .5s var(--ease); }
  .c-calm { display: none; margin-left: auto; font-size: 13px; color: rgba(255,255,255,.6); font-weight: 550; }
  .c-calm b { color: #fff; font-weight: 650; }
  .console.slim .c-top { padding-bottom: 20px; }
  .console.slim .c-body, .console.slim .c-feed { max-height: 0; min-height: 0; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0; border-top-width: 0; margin: 0; }
  .console.slim .c-legend { display: none; }
  .console.slim .c-calm { display: block; }
  .console.slim .c-title span { display: none; }
  .console.is-paused .c-stage canvas { filter: saturate(.4) brightness(.8); }
  .console .demo-note { position: absolute; right: 26px; bottom: 10px; font-size: 11px; color: rgba(255,255,255,.3); font-weight: 600; }
  @media (max-width: 1180px) { .c-body { grid-template-columns: 1fr; } .c-side { border-left: 0; border-top: 1px solid rgba(255,255,255,.07); padding-bottom: 12px; } .c-feed { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="stage">
  <header id="top"></header>
  <main class="wrap" id="main"></main>
</div>

<script src="/lib/world-mock.js"></script>
<script src="/lib/shell.js"></script>
<script>
// Everything below is read from the World. The demo's own patterns have a few
// extra words (what a slip is called); real patterns are told as they come.
const E = (s) => Shell.esc(s);
const KIND = {
  stop: { c: 'var(--k-stop)', verb: 'Stopped' },
  recheck: { c: 'var(--k-recheck)', verb: 'Looked again' },
  wait: { c: 'var(--k-wait)', verb: 'Waited its turn' },
  ask: { c: 'var(--k-ask)', verb: 'Asked you' },
  bad: { c: 'var(--k-bad)', verb: 'Didn’t happen' },
};
// How to tell the demo's stop patterns as a pile of paper.
const SLIPS = {
  'p-refund2': { noun: 'second refunds', slip: 'Refund', why: 'Each customer had been refunded once already' },
  'p-invoice2': { noun: 'repeat invoices', slip: 'Invoice', why: 'Each invoice had already gone out once' },
  'p-ticket2': { noun: 'double replies', slip: 'Reply', why: 'Another AI had already answered each ticket' },
  'p-cancelled': { noun: 'renewals for cancelled customers', slip: 'Renewal', why: 'Each customer had cancelled first' },
  'p-quote2': { noun: 'rewritten quotes', slip: 'Quote', why: 'Each quote had already been sent' },
};
const GROUP_NOUN = {
  'g-bigrefund': ['refund over $500', 'refunds over $500'],
  'g-downgrade': ['enterprise plan downgrade', 'enterprise plan downgrades'],
  'g-email': ['billing email change after a person edited it', 'billing email changes after a person edited it'],
};
const NEEDS = 'Needs a newer Lumni API';
/** A time of day from ms, in the workspace's own day. */
const clockAt = (w, ms) => {
  let m = Math.round((ms - w.dayStart) / 60000) % (24 * 60);
  m = Math.max(0, m);
  const hh = Math.floor(m / 60), mm = m % 60;
  return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`;
};

const sum = (a) => a.reduce((s, v) => s + v, 0);
const plural = (n, one, many) => (Math.round(n) === 1 ? one : many);
const hourName = (h) => { h = Math.floor(h) % 24; return h === 0 ? '12 AM' : h === 12 ? '12 PM' : h < 12 ? `${h} AM` : `${h - 12} PM`; };
const lower1 = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const upper1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const trunc = (s, n = 110) => (String(s).length > n ? String(s).slice(0, n - 1).trimEnd() + '…' : String(s));
const storyHref = (s) => (Shell.isReal ? `/journey?id=${encodeURIComponent(s)}` : `/journey?story=${encodeURIComponent(s)}`);
const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : 0; };
// A stable small number from the demo world, for "same time last week".
const wobble = (w, i) => { const s = (w.scale.seed ?? 1) * 97 + i * 31; return ((s * 9301 + 49297) % 233280) / 233280; };

// Counts a number up, formatted the same way it'll end.
function tick(el, to, fmt, ms = 1300) {
  const t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / ms);
    // Live totals can move the target while it counts.
    el.textContent = fmt(Number(el.dataset.n ?? to) * (1 - Math.pow(1 - p, 4)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const FMT = { n: fmtN, m: fmtMoney, p: (v) => pct(v / 1000), plain: (v) => Math.round(v).toLocaleString('en-US') };
const num = (v, f = 'n', extra = '') => `<span class="num" data-n="${v}" data-f="${f}"${extra}>${FMT[f](v)}</span>`;

/** A 24-hour sparkline: solid up to now, a dotted floor after. */
function spark(w, vals, color, { cumulative = false, forecast = 0 } = {}) {
  const W = 112, H = 36;
  let v = vals.slice();
  if (cumulative) { let s = 0; v = v.map((x) => (s += x)); }
  const nowI = Math.min(23, Math.floor(w.nowH));
  const max = Math.max(1, ...v, forecast);
  const x = (i) => (i / 23) * W;
  const y = (n) => H - 2 - (n / max) * (H - 4);
  const pts = v.slice(0, nowI + 1).map((n, i) => `${x(i).toFixed(1)},${y(n).toFixed(1)}`);
  const last = pts[pts.length - 1].split(',');
  const tail = forecast
    ? `<path d="M${last[0]},${last[1]} L${W},${y(forecast)}" stroke="${color}" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="1.5 3.5" stroke-linecap="round" fill="none"/>`
    : `<path d="M${last[0]},${H - 1} L${W},${H - 1}" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>`;
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="M0,${H} L${pts.join(' L')} L${last[0]},${H}Z" fill="url(#${id})"/>
    <path class="draw" d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${tail}<circle cx="${last[0]}" cy="${last[1]}" r="2.8" fill="${color}"/></svg>`;
}

function headline(w) {
  if (!w.total) return `Nothing has gone through Lumni yet today. <span class="soft">Your AIs’ actions show up here as they arrive.</span>`;
  const ais = w.scale.ais;
  const steps = `${num(w.steps, 'n', ' id="h-steps"')} ${plural(w.steps, 'time', 'times')}`;
  const tail = !w.steps ? '' : w.kept ? ` <span class="soft">and kept ${num(w.kept, 'm', ' id="h-kept"')} from going out twice.</span>` : ' <span class="soft">and nothing went out twice.</span>';
  return `Your ${num(ais, 'plain')} ${plural(ais, 'AI', 'AIs')} did ${num(w.total, 'n', ' id="h-total"')} ${plural(w.total, 'thing', 'things')} today. ${w.steps ? `Lumni stepped in <mark>${steps}</mark>${tail}` : '<span class="soft">Lumni hasn’t needed to step in yet.</span>'}`;
}

/**
 * Your workspace: a real delta against the same hour last week, or null when
 * there's nothing honest to compare (no history, or a zero to divide by).
 */
function vsWeek(w, key) {
  const vs = w.vsLastWeek;
  if (!Shell.isReal || !vs || vs[key] == null) return null;
  if (key === 'proven') {
    // A zero rate usually means the history didn't carry proofs.
    if (!vs.proven || !vs.total || !w.total) return null;
    const d = (w.proven - vs.proven) * 100;
    return { up: d > 0.05, flat: Math.abs(d) <= 0.05, text: `${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d).toFixed(1)} pts` };
  }
  const now = key === 'total' ? w.total : key === 'steps' ? w.steps : w.spend;
  if (!(vs[key] > 0)) return null;
  const r = Math.round(((now - vs[key]) / vs[key]) * 100);
  return { up: r > 0, flat: r === 0, text: `${r > 0 ? '+' : r < 0 ? '−' : ''}${Math.abs(r)}%` };
}
/** The pill: lime only when going up is good news. */
const vsPill = (d, good = true) => `<span class="delta ${d.up && good ? '' : 'flat'}">${d.text}</span> vs same time last week`;

function numbers(w) {
  const d = (i, lo, hi) => Math.round(lo + wobble(w, i) * (hi - lo));
  const pill = (v, unit = '%') => `<span class="delta">+${v}${unit}</span>`;
  const dt = vsWeek(w, 'total'), ds = vsWeek(w, 'steps'), dp = vsWeek(w, 'proven'), dm = vsWeek(w, 'spend');
  const proven = w.hourly.map((v) => v * w.proven);
  const spendH = w.hourly.map((v) => (w.total ? (v * w.spend) / w.total : 0));
  const verified = Math.round(w.proven * w.total);
  const cells = [
    { lab: 'things done', v: num(w.total, 'n', ' id="n-total"'), sp: spark(w, w.hourly, 'var(--ink)'), sub: !Shell.isReal ? `${pill(d(1, 4, 14))} so far vs same time last week` : dt ? vsPill(dt) : w.total ? `about ${fmtN(w.scale.actions)} by midnight at this pace` : 'nothing yet since midnight' },
    { lab: 'times Lumni stepped in', v: num(w.steps, 'n', ' id="n-steps"'), sp: spark(w, w.stepHourly, 'var(--accent)'), sub: !Shell.isReal ? `${pill(d(2, 2, 9))} ${w.total ? pct(w.steps / w.total) : '0%'} of everything` : ds ? vsPill(ds, false) : `${w.total ? pct(w.steps / w.total) : '0%'} of everything` },
    { lab: 'proven in the app itself', v: num(Math.round(w.proven * 1000), 'p'), sp: spark(w, proven, 'var(--accent)'), sub: !Shell.isReal ? `${pill((wobble(w, 3) * 0.8 + 0.2).toFixed(1), ' pts')} vs same time last week` : dp ? vsPill(dp) : `${fmtN(verified)} read back from the app` },
    { lab: 'spent on AI today', v: num(w.spend, 'm', ' id="n-spend"'), sp: spark(w, spendH, 'var(--ink)', { cumulative: true, forecast: w.pace }), sub: dm ? vsPill(dm, false) : w.pace ? `on pace for <b style="font-size:12.5px;color:var(--ink);letter-spacing:0">${fmtMoney(w.pace)}</b> by midnight` : 'nothing spent yet today' },
  ];
  return cells.map((c, i) => `<div class="rise" style="animation-delay:${0.1 + i * 0.07}s">
    <div class="lab">${c.lab}</div>
    <div class="mid"><b>${c.v}</b>${c.sp}</div>
    <div class="sub">${c.sub}</div></div>`).join('');
}

/** The catch of the day: the stop pattern that kept the most, else the biggest. */
function pickCatch(w) {
  const byKept = [...w.patterns.stop].sort((a, b) => b.kept - a.kept || b.n - a.n);
  // The demo's day is the Stripe spike, the same one Flow replays.
  return (Shell.isReal ? null : w.patterns.stop.find((p) => p.spike)) ?? byKept[0] ?? null;
}

/** Who, what and why, from a real sentence ("Refund agent’s stripe refund: it was already done") or the demo's words. */
function tell(w, p) {
  const app = w.app(p.app);
  const team = w.teams.find((t) => t.id === p.team) ?? w.team(p.team);
  const m = /^(.+?)’s (.+?): (.+)$/.exec(p.t);
  const s = SLIPS[p.id];
  const what = m ? m[2].replace(new RegExp(`^${p.app}\\s+`, 'i'), '') : (s?.slip ?? 'action').toLowerCase();
  const who = m ? m[1] : `${team.name} AI`;
  const ai = w.fleet.find((f) => f.name === who);
  const quoted = /“([^”]+)”/.exec(p.sample ?? '')?.[1] ?? null;
  return {
    app, team, who, what, quoted, s,
    initials: ai?.initials ?? team.ai ?? '?',
    // Out of how many of its own actions.
    base: ai?.n ?? team.n ?? w.total,
    noun: s?.noun ?? plural(p.n, 'repeat', 'repeats'),
    why: m ? m[3] : s ? lower1(s.why) : 'it had already been done',
  };
}
/** The stamp's small line: the reason, if it's short enough. */
const stampWhy = (why) => (why.length <= 26 ? why : /under way/.test(why) ? 'already under way' : 'already done');
/** The newest one, as the data says it: its amount, and the rest of its words. */
function newest(t, fallbackAmt) {
  const q = t.quoted;
  const money = q && /\$[\d,.]+k?/.exec(q)?.[0];
  return { amt: money ?? fallbackAmt, to: q ? (money ? q.replace(money, '').replace(/\s{2,}/g, ' ').trim() : q) : `In ${t.app.name}` };
}

function catchTop(w, p, t) {
  const most = [...w.patterns.stop].sort((a, b) => b.kept - a.kept || b.n - a.n)[0];
  const tag = p === most && p.kept ? 'Kept the most today' : p.spike != null ? 'Biggest spike today' : 'Most repeats today';
  return `<div class="hero-top"><span class="tag solid">Catch of the day</span><span class="tag">${tag}</span>
      ${p.story ? `<a class="btn open" href="${storyHref(p.story)}">${p.n === 1 ? 'Replay how it happened' : 'Replay one of them'}</a>` : ''}</div>
    <h2>${fmtN(p.n)} ${E(t.noun)}, stopped before ${E(t.app.name)}</h2>
    <p>${E(trunc(p.t))}. ${t.s ? E(t.s.why) + '. ' : ''}Lumni held ${p.n === 1 ? 'it' : `all ${fmtN(p.n)}`}, so ${E(t.app.name)} never saw ${p.n === 1 ? 'it' : 'them'}.</p>`;
}

function catchFacts(w, p, t) {
  const left = [
    ['Stopped today', fmtN(p.n), '', `${pct(p.n / Math.max(1, w.kinds.stop), 0)} of all repeats`],
    p.kept ? ['Kept', fmtMoney(p.kept), 'kept', p.n > 1 ? `about ${fmtMoney(p.money)} each` : 'never went out twice'] : ['Ran twice', '0', '', 'every one was held'],
    p.spike != null ? ['Spike', hourName(p.spike), '', 'its busiest hour'] : null,
  ].filter(Boolean);
  const right = [
    [`Reached ${t.app.name}`, '0', '', `of ${fmtN(p.n)}`],
    ['From', t.who, '', `${fmtN(Math.round((p.n / Math.max(1, t.base)) * 1000) / 10)} per 100 of its actions`],
  ];
  const fact = ([k, v, c, e], i, d) => `<div class="f" style="animation-delay:${d + i * 0.12}s"><small>${E(k)}</small><b class="${c}" title="${E(v)}">${E(v)}</b>${e ? `<em>${E(e)}</em>` : ''}</div>`;
  return [left.map((f, i) => fact(f, i, 0.9)).join(''), right.map((f, i) => fact(f, i, 1.2)).join('')];
}

/** One repeat, told with two slips: the one that went out, and the one Lumni held. */
function heroOne(w, p) {
  const t = tell(w, p);
  const [l, r] = catchFacts(w, p, t);
  const { amt, to } = newest(t, p.money ? fmtMoney(p.money) : upper1(t.what));
  return `${catchTop(w, p, t)}
    <div class="scene pair">
      <div class="facts l">${l}</div>
      <div class="slip back">
        <div class="k"><span class="mark" style="background:${t.app.color}">${E(t.app.mark)}</span>${E(upper1(t.what))} <span class="ok-mark">Done</span></div>
        <div class="amt">${E(amt)}</div><div class="to">${E(trunc(to, 30))}</div>
        <div class="perf"></div><div class="meta"><span>${E(trunc(t.who, 18))}</span><span>The first one</span></div>
      </div>
      <div class="slip front shake">
        <div class="k"><span class="ai" style="width:22px;height:22px;font-size:9.5px;border-radius:6px">${E(t.initials)}</span>${E(upper1(t.what))}, again</div>
        <div class="amt">${E(amt)}</div><div class="to">${E(trunc(to, 30))}</div>
        <div class="perf"></div><div class="meta"><span>${E(trunc(t.who, 18))}</span><span>Asked again</span></div>
      </div>
      <div class="stamp">Stopped<small>${E(stampWhy(t.why))}</small></div>
      <div class="facts r">${r}</div>
    </div>
    <div class="route">
      <svg viewBox="0 0 820 70" preserveAspectRatio="none">
        <line x1="20" y1="18" x2="560" y2="18" stroke="#e3e5ea" stroke-width="3.5" stroke-linecap="round"/>
        <line class="draw" x1="20" y1="18" x2="560" y2="18" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="560" y1="18" x2="800" y2="18" stroke="var(--accent-2)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="20" y2="32" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="290" cy="18" r="9" fill="#fff" stroke="var(--accent)" stroke-width="2.5"/><circle cx="290" cy="18" r="4" fill="var(--accent)"/>
        <circle cx="560" cy="18" r="20" fill="var(--accent)" opacity=".15"/><circle cx="560" cy="18" r="13" fill="var(--accent)" stroke="#fff" stroke-width="3.5"/>
        <circle cx="800" cy="18" r="9" fill="#fff" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="3 3"/>
      </svg>
      ${[[t.who, 'asks'], ['Up to date?', 'yes'], ['Done already?', 'yes'], [t.app.name, 'never called']].map(([a, s], i) => `<div class="lbl" style="left:${[20, 290, 560, 800][i] / 8.2}%;${i === 0 ? 'transform:none' : ''}">${E(trunc(a, 22))}<small>${s}</small></div>`).join('')}
    </div>`;
}

/** When Lumni stepped in, by the hour, with this pattern's spike marked. */
function strip(w, p, { label = 'When Lumni stepped in', right = 'Today, by the hour, every kind', vals = w.stepHourly } = {}) {
  const nowI = Math.min(23, Math.floor(w.nowH));
  const maxH = Math.max(1, ...vals);
  const peakH = p?.spike != null ? Math.floor(p.spike) : vals.indexOf(Math.max(...vals));
  const any = vals.some((v) => v > 0);
  const note = !any ? '' : p?.spike != null ? `${hourName(peakH)}, its spike` : `Busiest at ${hourName(peakH)}`;
  return `<div class="strip">
      <div class="strip-h">${label} <span>${right}</span></div>
      <div class="bars">
        ${vals.map((v, h) => `<i class="${h > nowI ? 'later' : any && h === peakH ? 'peak' : ''}" style="height:${h > nowI ? 3 : Math.max(3, Math.pow(v / maxH, 0.7) * 100)}%;animation-delay:${0.6 + h * 0.025}s"></i>`).join('')}
        ${note ? `<span class="note" style="left:${((peakH + 0.5) / 24) * 100}%;top:-20px">${note}</span>` : ''}
      </div>
      <div class="axis">${[0, 6, 12, 18].map((h) => `<span style="left:${(h / 24) * 100}%">${hourName(h)}</span>`).join('')}<span class="now" style="left:${(w.nowH / 24) * 100}%">Now</span></div>
    </div>`;
}

/** Many repeats: a fanned stack, the newest on top. */
function heroMany(w, p) {
  const t = tell(w, p);
  const [l, r] = catchFacts(w, p, t);
  const amt = p.money ? fmtMoney(p.money) : upper1(t.what);
  const top1 = newest(t, amt);
  const K = Math.min(6, p.n);
  const slips = Array.from({ length: K }, (_, i) => {
    const top = i === K - 1;
    const rot = -17 + i * 4;
    return `<div class="slip ${top ? 'shake' : ''}" style="transform:translate(${(i - K + 1) * 17}px, ${(K - 1 - i) * 3}px) rotate(${top ? 3 : rot}deg);animation-delay:${0.25 + i * 0.09}s${top ? `, 1.75s` : ''};z-index:${i}">
      <div class="k">${top ? `<span class="ai" style="width:22px;height:22px;font-size:9.5px;border-radius:6px">${E(t.initials)}</span>${E(upper1(t.what))}, again`
        : `<span class="mark" style="background:${t.app.color}">${E(t.app.mark)}</span>${E(upper1(t.what))}`}</div>
      <div class="amt">${E(trunc(top ? top1.amt : amt, 12))}</div><div class="to">${E(trunc(top ? top1.to : `In ${t.app.name}`, 30))}</div>
      <div class="perf"></div><div class="meta"><span>${E(trunc(t.who, 18))}</span><span>${top ? 'Asked again' : 'Stopped'}</span></div></div>`;
  }).join('');
  return `${catchTop(w, p, t)}
    <div class="scene">
      <div class="facts l">${l}</div>
      <div class="fan">${slips}
        <div class="stamp">Stopped<small>${E(stampWhy(t.why))}</small></div>
        <div class="count">×${fmtN(p.n)}<small>just like it</small></div>
      </div>
      <div class="facts r">${r}</div>
    </div>
    ${strip(w, p)}`;
}

/** Switch an app's checker on: a real write in your workspace, a toast in the demo. */
async function checkApp(a) {
  if (!Shell.isReal) return Shell.toast(`In your workspace, this switches the checker for ${a.name} on.`);
  await Shell.write('POST', `/v1/console/apps/${encodeURIComponent(a.id)}/checker`, { on: true }, { ok: `Lumni now checks ${a.name}.` });
}

function brief(w) {
  // The top reason for each kind, so every colour gets a line.
  const tops = ['stop', 'recheck', 'wait', 'bad'].map((k) => w.patterns[k]?.[0]).filter(Boolean).sort((a, b) => b.n - a.n).slice(0, 4);
  const maxN = Math.max(1, ...tops.map((p) => p.n));
  const asks = sum(w.groups.map((g) => g.n));
  const title = asks === 0 ? 'Nothing needs you. Everything is on plan.'
    : asks === 1 ? 'One thing needs you. Everything else is on plan.' : `${fmtN(asks)} things need you. Everything else is on plan.`;

  const groups = w.groups.slice(0, 3).map((g, i) => {
    const noun = GROUP_NOUN[g.id];
    const amounts = g.members.map((m) => m.amount).filter((a) => a != null);
    const mid = median(amounts);
    const odd = amounts.length > 2 ? amounts.filter((a) => a > mid * 3).length : 0;
    const oldest = Math.max(0, ...g.members.map((m) => m.mins));
    const head = noun ? `${fmtN(g.n)} ${plural(g.n, noun[0], noun[1])}` : g.t;
    const sub = odd ? `<i>${odd} ${plural(odd, 'looks', 'look')} unusual</i>, oldest ${oldest} min`
      : g.n === 1 ? `${E(g.members[0]?.who ?? 'One decision')}, waiting ${oldest} min`
      : noun ? E(g.rule) : `${fmtN(g.n)} waiting, oldest ${oldest} min`;
    return `<a class="todo" href="/needs-you">
      <span class="ic ask">${E(w.team(g.team).ai)}</span>
      <span class="tx"><span title="${E(head)}">${E(head)}</span><small>${sub}</small></span>
      <span class="btn ${i === 0 ? 'accent' : ''}">${g.n === 1 ? 'Decide' : `Review ${fmtN(g.n)}`}</span></a>`;
  }).join('');
  const more = w.groups.length > 3 ? `<a href="/needs-you">and ${w.groups.length - 3} more</a>` : '';
  const badTop = w.patterns.bad[0];
  const bad = w.kinds.bad ? `<a class="todo" href="${badTop?.story ? storyHref(badTop.story) : '/needs-you'}">
      <span class="ic bad">!</span>
      <span class="tx"><span>${fmtN(w.kinds.bad)} ${plural(w.kinds.bad, 'action said done but the app shows nothing', 'actions said done but the app shows nothing')}</span>
      <small>${badTop ? E(w.kinds.bad > badTop.n ? `Mostly ${lower1(badTop.t)}` : badTop.t) : ''}</small></span>
      <span class="btn">Review</span></a>` : '';
  const blindApp = w.apps.find((a) => a.blind);
  const blind = blindApp ? `<div class="todo">
      <span class="ic plain">?</span>
      <span class="tx"><span>${E(blindApp.name)} can’t be checked</span><small>${fmtN(blindApp.n)} ${plural(blindApp.n, 'action', 'actions')} today on the AI’s word alone</small></span>
      <button class="btn" data-check="${E(blindApp.id)}">Check it</button></div>` : '';
  const waiting = groups + bad;

  return `
    <span class="tag accent">Lumni’s brief</span>
    <h3>${title}</h3>
    <h4>Why Lumni stepped in</h4>
    ${tops.length ? `<div class="why">${tops.map((p, i) => `<div class="why-row" title="${E(p.t)}">
      <span class="dot" style="background:${KIND[p.kind].c}"></span><span class="t">${E(p.t)}</span><b>${fmtN(p.n)}</b>
      <span class="track"><i style="width:${(p.n / maxN) * 100}%;background:${KIND[p.kind].c};animation-delay:${0.5 + i * 0.1}s"></i></span></div>`).join('')}</div>`
      : `<div class="calm">Lumni hasn’t needed to step in yet today. Each reason it does shows up here.</div>`}
    <h4>Waiting on you ${more}</h4>
    ${waiting || '<div class="calm">Nothing is waiting. When an AI needs a person, it shows up here.</div>'}
    ${blind}`;
}

function rightNow(w) {
  const head = (on) => `<h3><span class="pulse ${on ? '' : 'off'}"></span>Right now <a href="/day-map">See the whole day</a></h3>`;
  const teams = w.teams.filter((t) => t.id !== 'other').sort((a, b) => b.n - a.n).slice(0, 3);
  const maxT = Math.max(1, ...teams.map((t) => t.n));
  const teamRows = teams.length ? `<div class="teams">${teams.map((t, i) => `<div class="team"><span class="ai">${E(t.ai)}</span>
      <span class="nm" title="${E(t.name)}">${E(t.name)}</span><b>${fmtN(t.n)} <small>today</small></b>
      <span class="bar"><i style="width:${(t.n / maxT) * 100}%;animation-delay:${0.6 + i * 0.1}s"></i></span></div>`).join('')}</div>` : '';

  if (Shell.isReal) {
    // Your workspace: one tile per AI, working if it acted in the last 15 minutes.
    const f = w.fleet;
    if (!f.length) return `${head(false)}<div class="big">No AIs yet</div><div class="empty" style="text-align:left;padding:18px 0 0">Once an AI sends its first action through Lumni, it shows up here.</div>`;
    const loops = f.some((x) => x.loop);
    // AIs Lumni is still reading, or beyond the twelve it lists.
    const more = Math.max(0, w.scale.ais - f.length);
    const all = f.length + more;
    return `${head(w.working > 0)}
      <div class="big">${num(w.working, 'plain')} of ${fmtN(all)} ${plural(all, 'AI', 'AIs')} working <small>acted in the last 15 minutes</small></div>
      <div class="fleet">${f.map((x) => `<div class="fl ${x.recent ? 'on' : ''} ${x.loop ? 'loop' : ''}" title="${E(x.name)}">
        <span class="sq">${E(x.initials)}</span><span class="nm"><b>${E(x.name)}</b><small>${x.loop ? 'In a retry loop now' : x.recent ? 'Working' : 'Idle'}</small></span><em>${fmtN(x.n)}</em></div>`).join('')}${more ? `<div class="fl"><span class="sq">+</span><span class="nm"><b>${fmtN(more)} more</b><small>Not read yet</small></span></div>` : ''}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Working</span>${loops ? '<span><i style="background:var(--k-recheck)"></i>In a retry loop</span>' : ''}<span><i style="background:var(--line2)"></i>Idle</span></div>
      ${teamRows}`;
  }

  // The demo: one square per AI, sized so any number fills the same box.
  const n = w.scale.ais;
  const box = { w: 622, h: 118 };
  const pitch = Math.max(11, Math.min(30, Math.floor(Math.sqrt((box.w * box.h) / n))));
  const gap = Math.max(3, Math.round(pitch * 0.24));
  const size = pitch - gap;
  const recheck = Math.max(1, Math.round(w.working * (w.kinds.recheck / Math.max(1, w.steps)) * 0.1));
  const waiting = Math.max(1, Math.round(w.working * (w.kinds.wait / Math.max(1, w.steps)) * 0.08));
  // A fixed shuffle, so the same AIs are busy on every load.
  const order = Array.from({ length: n }, (_, i) => i);
  let seed = (w.scale.seed ?? 1) * 7919;
  for (let i = n - 1; i > 0; i--) { seed = (seed * 16807) % 2147483647; const j = seed % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
  const cls = Array(n).fill('');
  order.slice(0, w.working).forEach((i, j) => (cls[i] = j < recheck ? 'r' : j < recheck + waiting ? 'q' : 'w'));
  return `${head(true)}
    <div class="big">${num(w.working, 'plain')} of ${fmtN(n)} AIs working <small>${pct(w.working / n, 0)} of your fleet</small></div>
    <div class="matrix" style="gap:${gap}px">${cls.map((c) => `<i class="${c}" style="width:${size}px;height:${size}px;border-radius:${Math.max(2, size * 0.22)}px"></i>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Working</span><span><i style="background:var(--k-recheck)"></i>Looking again</span><span><i style="background:var(--k-wait)"></i>Waiting its turn</span><span><i style="background:var(--line2)"></i>Idle</span></div>
    ${teamRows}`;
}

function spend(w) {
  const L = Shell.isReal ? w.money.limit : null;
  let limit = '<a href="/money">Set a daily limit</a>';
  if (Shell.isReal && w.source === 'snapshots') limit = `<span class="dis" title="${NEEDS}">Set a daily limit</span>`;
  else if (L != null) {
    const at = w.money.slowAt, verb = w.money.limitMode === 'HOLD' ? 'holds' : 'slows';
    const when = at == null || at - w.dayStart >= 2 * 864e5 ? 'under pace today' : at <= w.now ? `${verb} now` : `${verb} at ${clockAt(w, at)}${at - w.dayStart >= 864e5 ? ' tomorrow' : ''}`;
    limit = `<a href="/money" title="Change it on Money">Limit ${fmtMoney(L)}, ${when}</a>`;
  }
  if (!w.pace || !w.total) {
    return `<h3>Spend ${limit}</h3>
      <div class="big">${fmtMoney(w.spend || 0)} <small>so far today</small></div><div class="empty">Nothing spent yet. Spend shows here once your AIs’ actions carry a cost.</div>`;
  }
  const W = 600, H = 190, top = 34, bot = H - 24;
  let s = 0;
  const cum = w.hourly.map((v) => (s += v));
  const nowI = Math.min(23, Math.floor(w.nowH));
  const money = (c) => (c * w.spend) / w.total;
  const x = (h) => (h / 24) * W;
  const y = (m) => bot - (m / w.pace) * (bot - top);
  const pts = [[0, bot], ...cum.slice(0, nowI).map((c, h) => [x(h + 1), y(money(c))]), [x(w.nowH), y(w.spend)]];
  const line = pts.map(([a, b]) => `${a.toFixed(1)},${b.toFixed(1)}`).join(' L');
  const [nx, ny] = pts[pts.length - 1];
  const lead = [...w.fleet].sort((p, q) => q.spend - p.spend)[0];
  return `<h3>Spend ${limit}</h3>
    <div class="big">${num(w.spend, 'm')} <small>so far, on pace for ${fmtMoney(w.pace)} by midnight</small></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b4bf5" stop-opacity=".2"/><stop offset="1" stop-color="#5b4bf5" stop-opacity="0"/></linearGradient></defs>
      ${[0.5, 1].map((f) => `<line x1="0" x2="${W}" y1="${y(w.pace * f)}" y2="${y(w.pace * f)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
      ${L != null && L <= w.pace * 1.15 ? `<line x1="0" x2="${W}" y1="${y(L)}" y2="${y(L)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="4" y="${y(L) - 6}" font-size="12" font-weight="650" fill="var(--ink)" font-family="var(--sans)">Daily limit ${fmtMoney(L)}</text>` : ''}
      <path d="M${line} L${nx},${bot} L0,${bot}Z" fill="url(#sg)"/>
      <path class="draw" d="M${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M${nx},${ny} L${W},${y(w.pace)}" fill="none" stroke="var(--accent-2)" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
      <circle cx="${nx}" cy="${ny}" r="13" fill="var(--accent)" opacity=".15"/><circle cx="${nx}" cy="${ny}" r="6" fill="var(--accent)"/>
      <text x="${W}" y="${y(w.pace) - 14}" text-anchor="end" font-size="13" font-weight="650" fill="var(--ink2)" font-family="var(--sans)">${fmtMoney(w.pace)} by midnight</text>
      <text x="${nx - 12}" y="${ny - 14}" text-anchor="end" font-size="13" font-weight="650" fill="var(--accent)" font-family="var(--sans)">${fmtMoney(w.spend)} now</text>
      ${[0, 6, 12, 18].map((h) => `<text x="${x(h)}" y="${H - 4}" font-size="11.5" font-weight="600" fill="var(--ink3)" font-family="var(--sans)">${hourName(h)}</text>`).join('')}
    </svg>
    <div class="split">
      <div><small>Biggest spender</small><b class="one" title="${E(lead?.name ?? '')}">${E(lead?.name ?? 'Nobody yet')}</b> <small style="display:inline">${lead ? fmtMoney(lead.spend) : ''}</small></div>
      <div><small>Per thing done</small><b>${'$' + (w.spend / w.total).toFixed(3)}</b></div>
      <div><small>Not spent on repeats</small><b style="color:var(--accent)">${fmtMoney(w.money.waste.repeats.usd)}</b></div>
    </div>`;
}

/** Every AI is paused: say so calmly, and offer the way back. */
function pausedBanner(w) {

  return `<section class="paused rise"><span class="pz"><i></i><i></i></span>
    <span class="tx"><b>Every AI is paused.</b> New actions wait at Lumni’s first check until you resume. Nothing is lost.</span>
    <button class="btn" id="resume" ${off}>Resume every AI</button></section>`;
}
function wireResume() {
  const b = $('#resume');
  if (!b) return;
  b.onclick = async () => {
    if (!b.classList.contains('confirm')) {
      b.classList.add('confirm');
      b.textContent = 'Confirm, resume all';
      setTimeout(() => { if (b.isConnected && !b.disabled) { b.classList.remove('confirm'); b.textContent = 'Resume every AI'; } }, 4000);
      return;
    }
    b.disabled = true;
    SHOT_PAUSED = false;
    const out = await Shell.write('POST', '/v1/config/pause', { paused: false }, { ok: 'Every AI is running again.' });
    if (!out) { b.disabled = false; b.classList.remove('confirm'); b.textContent = 'Resume every AI'; return; }
    $('.paused')?.classList.add('gone');
  };
}
// Screenshots: pause the workspace for real, then show it (and resume it).
// The fake API doesn't report the pause back on GET /v1/config, so a shot
// that paused for real carries it into the world it reads next.
let shotStep = 0, SHOT_PAUSED = false;
function shotPause(w) {
  const shot = new URLSearchParams(location.search).get('shot');
  // A real daily limit, set the way Money sets it, to show the spend card with one.
  if (Shell.isReal && shot === 'limit' && w.money.limit == null && shotStep === 0 && w.pace) {
    shotStep = 1;
    Shell.write('PUT', '/v1/config/spend-limit', { daily_micros_usd: Math.round(Math.round(w.pace * 0.8) * 1e6), when_reached: 'SLOW', tz: Intl.DateTimeFormat().resolvedOptions().timeZone }, {});
    return;
  }
  if (!Shell.isReal || (shot !== 'paused' && shot !== 'resume')) return;
  if (!w.paused && shotStep === 0) {
    shotStep = 1;
    Shell.write('POST', '/v1/config/pause', { paused: true }, { reload: false }).then((out) => { if (out) { SHOT_PAUSED = true; Shell.refresh(); } });
    return;
  }
  if (w.paused && shot === 'resume' && shotStep === 1) { shotStep = 2; setTimeout(() => { $('#resume').click(); setTimeout(() => $('#resume').click(), 500); }, 600); }
}

// ─── Live ────────────────────────────────────────────
//
// The console at the top of Today. In your workspace it follows Lumni's change
// stream: each change asks the console's server what just happened
// (/v1/console/pulse), whose totals are exact at any volume and whose newest
// few actions are told in full. In the demo, the same picture is simulated
// from the demo world's own patterns.

const WINDOW = 120_000;
/** On dark: the same meanings, a little brighter. */
const DK = { allow: 'rgba(255,255,255,.5)', stop: '#8f82ff', recheck: '#f59a3a', wait: '#4aa8ff', ask: '#ffffff', bad: '#ff5a64' };
const KINDS = ['stop', 'recheck', 'wait', 'ask', 'bad'];
const WOULD_VERB = { stop: 'Would have stopped', recheck: 'Would have sent back', wait: 'Would have held', ask: 'Would have asked you', bad: 'Didn’t happen' };
const LIVE = {
  on: new URLSearchParams(location.search).get('live') !== 'off', started: false, frozenAt: Date.now(),
  dots: [], bubbles: [], feed: [], seen: new Set(),
  base: null, totals: null, samples: [], cursor: null, offset: 0, lastAt: null,
  fetching: false, error: null, timer: null, slim: false, quietFrom: 0, nextAt: 0, sim: null, w: null, reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
};
const liveNow = () => (LIVE.on ? Date.now() : LIVE.frozenAt);

function liveHtml(w) {
  // Your workspace opens folded, and unfolds when the first actions arrive.
  if (!LIVE.started) LIVE.slim = Shell.isReal;
  const legend = [['allow', 'Checked'], ['stop', 'Stopped'], ['recheck', 'Looked again'], ['wait', 'Waited'], ['ask', 'Asked you']]
    .map(([k, t]) => `<span><i style="background:${DK[k]}"></i>${t}</span>`).join('');
  const rows = KINDS.map((k) => `<div class="ck" data-k="${k}"><i style="background:${DK[k]}"></i><span>${KIND[k].verb}</span><b id="ck-${k}">0</b></div>`).join('');
  return `<section class="console rise ${LIVE.on ? '' : 'is-paused'} ${LIVE.slim ? 'slim' : ''}" id="console" style="animation-delay:.08s">
    <div class="c-top">
      <div class="c-title"><b>As it happens</b><span>Every action your AIs take, the moment Lumni checks it. The last two minutes.</span></div>
      <div class="c-legend">${legend}</div>
      <div class="c-calm" id="calm"></div>
    </div>
    <div class="c-body">
      <div class="c-stage" id="stage"><canvas id="pulse" role="img" aria-label="The last two minutes of your AIs’ actions, live. Lumni’s step-ins are listed below."></canvas>
        <div class="c-quiet gone" id="quiet"></div>
        <div class="c-axis"><span style="left:2%">2 min ago</span><span style="left:50%">1 min ago</span><span class="now" style="left:99%">Now</span></div>
      </div>
      <div class="c-side">
        <div class="c-rate"><b id="rate">0</b><small>checks a minute<br>right now</small></div>
        <div class="c-kinds">${rows}</div>
        <div class="c-since" id="since">${Shell.isReal ? 'Today’s totals, exact. The small number is since you opened this page.' : 'Demo: a simulated stream from the demo day.'}</div>
      </div>
    </div>
    <div class="c-feed" id="feed"></div>
  </section>`;
}

/** A dot on the timeline. `told` events are full actions; the rest only count. */
function addDot(e, settled = false) {
  const H = LIVE.h || 270;
  const step = e.kind !== 'allow';
  const y = step ? H * (0.22 + Math.random() * 0.2) : H * (0.5 + Math.random() * 0.22);
  const dot = { t: e.t, kind: e.kind, would: !!e.would, step, y, born: settled || LIVE.reduced ? -1e9 : performance.now() };
  LIVE.dots.push(dot);
  // One new bubble at a time: they all land at the same edge.
  const lastBubble = LIVE.bubbles[LIVE.bubbles.length - 1];
  if (step && e.label && !settled && LIVE.on && (!lastBubble || performance.now() - lastBubble.born > 4600)) {
    const b = document.createElement(e.href ? 'a' : 'div');
    b.className = 'bubble';
    if (e.href) b.href = e.href;
    b.innerHTML = `<b><em style="color:${DK[e.kind] === '#ffffff' ? '#fff' : DK[e.kind]}">${E(e.would ? WOULD_VERB[e.kind] : KIND[e.kind].verb)}</em> · ${E(trunc(e.who ?? '', 18))}</b>${E(trunc(e.label, 46))}`;
    $('#stage')?.appendChild(b);
    LIVE.bubbles.push({ el: b, dot, born: performance.now() });
  }
  // Bound the work at volume: two minutes, at most ~40 dots a second.
  if (LIVE.dots.length > 4800) LIVE.dots.splice(0, LIVE.dots.length - 4800);
}

function draw() {
  const cv = $('#pulse');
  if (!cv) return;
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  LIVE.h = H;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const now = liveNow();
  const pad = 26;
  const x = (t) => pad + (W - pad * 2) * (1 - (now - t) / WINDOW);
  const tp = performance.now();

  // Grid: every 15 seconds, the minute lines a little brighter.
  for (let s = 0; s <= WINDOW / 1000; s += 15) {
    const gx = pad + (W - pad * 2) * (1 - s / (WINDOW / 1000));
    g.strokeStyle = s % 60 === 0 ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.035)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(gx, 14); g.lineTo(gx, H - 26); g.stroke();
  }

  // The rate: checks per two seconds, as a glowing line along the floor.
  LIVE.dots = LIVE.dots.filter((d) => now - d.t < WINDOW + 4000);
  const B = 60, buckets = new Array(B).fill(0);
  for (const d of LIVE.dots) { const i = Math.floor((1 - (now - d.t) / WINDOW) * B); if (i >= 0 && i < B) buckets[i]++; }
  const peak = Math.max(4, ...buckets);
  const fy = H - 30, amp = 58;
  g.save();
  g.beginPath();
  buckets.forEach((n, i) => { const bx = pad + ((W - pad * 2) * (i + 0.5)) / B, by = fy - (n / peak) * amp; i ? g.lineTo(bx, by) : g.moveTo(bx, by); });
  g.strokeStyle = 'rgba(143,130,255,.9)'; g.lineWidth = 2; g.shadowColor = 'rgba(143,130,255,.8)'; g.shadowBlur = 10; g.stroke();
  g.lineTo(pad + (W - pad * 2) * (B - 0.5) / B, fy); g.lineTo(pad + (W - pad * 2) * 0.5 / B, fy); g.closePath();
  const fill = g.createLinearGradient(0, fy - amp, 0, fy); fill.addColorStop(0, 'rgba(143,130,255,.22)'); fill.addColorStop(1, 'rgba(143,130,255,0)');
  g.shadowBlur = 0; g.fillStyle = fill; g.fill();
  g.restore();

  // The dots: plain checks small and quiet, step-ins bright, landing with a ring.
  for (const d of LIVE.dots) {
    const dx = x(d.t);
    if (dx < pad - 6 || dx > W) continue;
    const age = tp - d.born;
    const k = Math.min(1, age / 520);
    const ease = 1 - Math.pow(1 - k, 3);
    const dy = d.y - (1 - ease) * 46;
    g.globalAlpha = Math.min(1, 0.15 + ease) * (d.step ? 1 : 0.9);
    if (d.step) {
      g.save();
      g.shadowColor = DK[d.kind]; g.shadowBlur = 16;
      g.fillStyle = d.would ? 'transparent' : DK[d.kind];
      g.beginPath(); g.arc(dx, dy, 5.5, 0, Math.PI * 2);
      if (d.would) { g.strokeStyle = DK[d.kind]; g.lineWidth = 2; g.stroke(); } else g.fill();
      g.restore();
      if (age < 1100) {
        g.globalAlpha = (1 - age / 1100) * 0.8;
        g.strokeStyle = DK[d.kind]; g.lineWidth = 2;
        g.beginPath(); g.arc(dx, dy, 6 + age / 26, 0, Math.PI * 2); g.stroke();
      }
    } else {
      g.fillStyle = DK.allow;
      g.beginPath(); g.arc(dx, dy, 2.3, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalAlpha = 1;

  // Now: a bright edge with a beat.
  const nx = W - pad;
  const grad = g.createLinearGradient(0, 10, 0, H - 26);
  grad.addColorStop(0, 'rgba(143,130,255,0)'); grad.addColorStop(0.5, 'rgba(143,130,255,.7)'); grad.addColorStop(1, 'rgba(143,130,255,0)');
  g.strokeStyle = grad; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(nx, 10); g.lineTo(nx, H - 26); g.stroke();
  if (LIVE.on) {
    const beat = (Math.sin(tp / 380) + 1) / 2;
    g.fillStyle = `rgba(143,130,255,${0.25 + beat * 0.35})`;
    g.beginPath(); g.arc(nx, fy, 7 + beat * 5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(nx, fy, 3, 0, Math.PI * 2); g.fill();
  }

  // Bubbles follow their dot, then fade.
  LIVE.bubbles = LIVE.bubbles.filter((b) => {
    const life = tp - b.born;
    const bx = x(b.dot.t);
    if (life > 4600 || bx < 120 || !b.el.isConnected) { b.el.remove(); return false; }
    b.el.style.left = `${Math.min(W - 150, bx)}px`;
    b.el.style.top = `${b.dot.y}px`;
    b.el.classList.toggle('fade', life > 3800);
    return true;
  });

  // Quiet: say when the last action was, rather than show an empty sky.
  const recent = LIVE.dots.some((d) => now - d.t < WINDOW) && !LIVE.error;
  // Fold after a few quiet seconds (not on every gap between two actions); open at once.
  if (recent || LIVE.error) LIVE.quietFrom = 0;
  else LIVE.quietFrom ||= tp;
  const quiet = !recent && !LIVE.error;
  const slim = quiet && (LIVE.slim || tp - LIVE.quietFrom > 4000);
  if (slim !== LIVE.slim) {
    LIVE.slim = slim;
    $('#console')?.classList.toggle('slim', slim);
  }
  const calm = $('#calm');
  if (calm && slim) calm.innerHTML = `<b>${LIVE.on ? 'Quiet right now.' : 'Paused.'}</b> ${LIVE.lastAt ? `The last action was ${ago(now - LIVE.lastAt)} ago.` : 'No actions in the last few minutes.'} ${LIVE.on ? 'This opens up when your AIs act.' : ''}`;
  const q = $('#quiet');
  if (q) {
    q.classList.toggle('gone', recent);
    if (LIVE.error) q.innerHTML = `<b>Not live</b>${E(LIVE.error)}`;
    else if (!recent) q.innerHTML = `<b>${LIVE.on ? 'Quiet right now' : 'Paused'}</b>${LIVE.lastAt ? `The last action was ${ago(now - LIVE.lastAt)} ago.` : 'Waiting for the next action.'}`;
  }

  // Checks a minute: from exact totals when there's history, else from the dots.
  const r = $('#rate');
  if (r) r.textContent = fmtN(rateNow(now));
  requestAnimationFrame(draw);
}
const ago = (ms) => (ms < 90_000 ? `${Math.max(1, Math.round(ms / 1000))} s` : ms < 90 * 60_000 ? `${Math.round(ms / 60_000)} min` : `${Math.round(ms / 3_600_000)} h`);

function rateNow(now) {
  const s = LIVE.samples;
  if (s.length >= 2 && s[s.length - 1].at - s[0].at >= 10_000) {
    const a = s.find((p) => p.at >= now - 60_000) ?? s[0], b = s[s.length - 1];
    return b.at > a.at ? Math.round(((b.total - a.total) / (b.at - a.at)) * 60_000) : 0;
  }
  return LIVE.dots.filter((d) => now - d.t < 60_000).length;
}

/** Totals arrive: the counters, the headline and the number row follow. */
function applyTotals(t, quiet = false) {
  const prev = LIVE.totals;
  LIVE.totals = t;
  LIVE.base ??= t;
  LIVE.samples.push({ at: liveNow(), total: t.total });
  if (LIVE.samples.length > 40) LIVE.samples.shift();
  paintTotals(prev && !quiet ? prev : null);
}
function paintTotals(prev) {
  const t = LIVE.totals;
  if (!t) return;
  for (const k of KINDS) {
    const el = $(`#ck-${k}`);
    if (!el) continue;
    const since = t.kinds[k] - (LIVE.base?.kinds[k] ?? t.kinds[k]);
    el.innerHTML = `${fmtN(t.kinds[k])}${since > 0 ? `<small>+${fmtN(since)}</small>` : ''}`;
    if (prev && t.kinds[k] > prev.kinds[k]) {
      const row = el.closest('.ck');
      row.classList.remove('hit'); void row.offsetWidth; row.classList.add('hit');
      clearTimeout(row._t); row._t = setTimeout(() => row.classList.remove('hit'), 1400);
    }
  }
  const set = (sel, v, f, changed) => {
    const el = $(sel);
    if (!el) return;
    el.dataset.n = v;
    el.textContent = FMT[f](v);
    if (changed) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  };
  set('#h-total', t.total, 'n', prev && t.total !== prev.total);
  set('#h-steps', t.steps, 'n', prev && t.steps !== prev.steps);
  if (t.kept) set('#h-kept', t.kept, 'm', prev && t.kept !== prev.kept);
  set('#n-total', t.total, 'n', false);
  set('#n-steps', t.steps, 'n', false);
  if (t.spend) set('#n-spend', t.spend, 'm', false);
}

/** The feed: the newest step-ins first; plain checks only when there's nothing else. */
function pushFeed(e) {
  LIVE.feed = [e, ...LIVE.feed.filter((x) => x.id !== e.id)];
  const steps = LIVE.feed.filter((x) => x.kind !== 'allow');
  LIVE.feed = [...steps, ...LIVE.feed.filter((x) => x.kind === 'allow')].slice(0, 12);
}
function paintFeed() {
  const el = $('#feed');
  if (!el) return;
  const rows = LIVE.feed.slice(0, 3);
  if (!rows.length) { el.innerHTML = `<div class="fe-none">${Shell.isReal ? 'When Lumni steps in, it shows up here the moment it happens.' : ''}</div>`; return; }
  const key = rows.map((r) => r.id).join();
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = rows.map((r) => {
    const c = DK[r.kind], verb = r.kind === 'allow' ? 'Went ahead' : r.would ? WOULD_VERB[r.kind] : KIND[r.kind].verb;
    const bg = r.kind === 'allow' ? 'rgba(255,255,255,.12)' : r.kind === 'ask' ? '#fff' : c;
    return `<a class="fe" ${r.href ? `href="${E(r.href)}"` : ''} title="${E(r.label ?? '')}">
      <span class="av" style="background:${bg};${r.kind === 'ask' ? 'color:var(--ink)' : ''}">${E(r.initials ?? 'AI')}</span>
      <span class="tx"><b>${E(r.label ?? '')}</b><small><em style="color:${r.kind === 'allow' ? 'rgba(255,255,255,.7)' : c}">${verb}</em>${r.why ? ` · ${E(r.why)}` : ''} · ${E(r.who ?? '')}</small></span></a>`;
  }).join('');
}

// ─── your workspace: follow the stream ────────────────

async function pull() {
  if (!Shell.isReal || !LIVE.on || LIVE.fetching || document.visibilityState !== 'visible') return;
  LIVE.fetching = true;
  try {
    const first = LIVE.cursor == null;
    const p = await Shell.api.get(`/v1/console/pulse${first ? '' : `?after=${LIVE.cursor}`}`);
    LIVE.offset = p.now - Date.now();
    const from = first ? p.now - 10 * 60_000 : LIVE.cursor;
    LIVE.cursor = p.cursor;
    const fresh = p.events.filter((e) => !LIVE.seen.has(e.id)).sort((a, b) => a.at - b.at);
    for (const e of fresh) {
      LIVE.seen.add(e.id);
      const ev = { id: e.id, t: e.at - LIVE.offset, kind: e.kind, would: e.would, label: e.did, who: e.who.name, initials: e.who.initials, why: e.why, href: storyHref(e.id) };
      addDot(ev, first);
      pushFeed(ev);
      LIVE.lastAt = Math.max(LIVE.lastAt ?? 0, ev.t);
    }
    // The ones not told are counted, spread over the time they came in.
    const n = Math.min(p.more, 400);
    for (let i = 0; i < n; i++) addDot({ t: from + ((p.cursor - from) * (i + 1)) / (n + 1) - LIVE.offset, kind: 'allow' }, first);
    if (p.totals) applyTotals(p.totals, first);
    if (p.lastAt) LIVE.lastAt = Math.max(LIVE.lastAt ?? 0, p.lastAt - LIVE.offset);
    paintFeed();
    Shell.seenChanges();
    LIVE.error = null;
  } catch (e) {
    // Say why, rather than look quiet: a 404 means this page is newer than the server running it.
    LIVE.error = e.status === 404
      ? 'This console’s server is older than this page. Restart it (bun serve.ts) to go live.'
      : `Lumni’s live view can’t be read: ${e.message}`;
  }
  LIVE.fetching = false;
}
/** A change happened: look soon, but not more than every 1.5 s. */
function soon() {
  if (!LIVE.on) return;
  clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(() => { LIVE.nextAt = Date.now() + 1500; pull(); }, Math.max(250, LIVE.nextAt - Date.now()));
}

// ─── the demo: the same picture, simulated ───────────

function startSim(w) {
  const rate = { small: 1.2, mid: 3.4, large: 9 }[Shell.key] ?? 3;
  const weights = KINDS.map((k) => Math.max(1, w.kinds[k] ?? 0));
  const wsum = weights.reduce((a, b) => a + b, 0);
  const pickKind = () => { let r = Math.random() * wsum; for (let i = 0; i < KINDS.length; i++) if ((r -= weights[i]) < 0) return KINDS[i]; return 'stop'; };
  const fleet = (w.fleet.length ? w.fleet : [{ name: 'Support AI' }]).map((f) => ({ ...f, initials: f.initials ?? f.name.slice(0, 2) }));
  const one = (t, settled) => {
    // A little above the day's real share, so a demo minute has something to show.
    const step = Math.random() < 0.08;
    const kind = step ? pickKind() : 'allow';
    const pats = (w.patterns[kind] ?? []);
    const p = pats[Math.floor(Math.random() * Math.min(4, pats.length))];
    const ai = fleet[Math.floor(Math.random() * Math.min(10, fleet.length))];
    const id = `sim-${Math.random().toString(36).slice(2, 9)}`;
    const ev = { id, t, kind, would: false, label: p ? p.t : 'Checked an action', who: ai.name, initials: ai.initials, why: null, href: p?.story ? storyHref(p.story) : null };
    addDot(ev, settled);
    if (!settled && step) pushFeed(ev);
    return ev;
  };
  // Two minutes already on the timeline, so it opens alive.
  const now = Date.now();
  for (let t = now - WINDOW; t < now; t += 1000 / rate) one(t + Math.random() * 300, true);
  const totals = { total: w.total, steps: w.steps, kinds: { ...w.kinds }, kept: w.kept, spend: w.spend };
  applyTotals(totals, true);
  for (let i = 0; i < 3; i++) { const k = KINDS[i]; const p = w.patterns[k]?.[0]; if (p) pushFeed({ id: `seed-${k}`, kind: k, label: p.t, who: fleet[i % fleet.length].name, initials: fleet[i % fleet.length].initials, href: p.story ? storyHref(p.story) : null }); }
  paintFeed();
  clearInterval(LIVE.sim);
  LIVE.sim = setInterval(() => {
    if (!LIVE.on || document.visibilityState !== 'visible') return;
    // `rate` a second, so rate/10 per 100 ms tick.
    let n = 0;
    for (let i = 0; i < 10; i++) if (Math.random() < rate / 100) n++;
    if (!n) return;
    const next = { ...LIVE.totals, kinds: { ...LIVE.totals.kinds } };
    for (let i = 0; i < n; i++) {
      const ev = one(Date.now() - Math.random() * 80, false);
      next.total++;
      if (ev.kind !== 'allow') { next.steps++; next.kinds[ev.kind]++; if (ev.kind === 'stop') next.kept += 40 + Math.round(Math.random() * 60); }
      next.spend += 0.09;
    }
    applyTotals(next);
    paintFeed();
  }, 100);
}

/** Screenshots: a few real checks through the API, one of them a repeat Lumni stops. */
async function burst(w) {
  const ais = w.fleet.slice(0, 3);
  const check = (ai, i, key, summary) => Shell.api.post('/v1/actions/check', {
    action_id: `burst-${Date.now()}-${i}`, work_id: `burst-${ai.id}`, actor_id: ai.id, operation: 'stripe.refund', idempotency_key: key,
    arguments: { amount: 60 }, resources: [{ type: 'charge', external_id: key ?? `ch_${i}`, mode: 'WRITE' }], metadata: { summary },
  }).catch(() => {});
  await sleep(1200);
  for (let i = 0; i < 6; i++) { await check(ais[i % ais.length], i, null, `Refund $${40 + i * 7} on order #88${10 + i}`); await sleep(260); }
  await check(ais[0], 10, 'refund-ch_burst', 'Refund $60 on ch_burst');
  await sleep(500);
  await check(ais[0], 11, 'refund-ch_burst', 'Refund $60 on ch_burst');
}

function mountLive(w) {
  LIVE.w = w;
  const sw = $('#live');
  const paint = () => {
    sw.classList.toggle('on', LIVE.on);
    sw.innerHTML = LIVE.on ? '<i></i>Live' : '<i></i>Paused <small>Resume</small>';
    $('#console')?.classList.toggle('is-paused', !LIVE.on);
  };
  sw.onclick = () => {
    LIVE.on = !LIVE.on;
    if (!LIVE.on) LIVE.frozenAt = Date.now();
    paint();
    if (LIVE.on) pull();
  };
  paint();
  paintTotals(null);
  paintFeed();
  if (!LIVE.started) {
    LIVE.started = true;
    requestAnimationFrame(draw);
    if (Shell.isReal) {
      pull();
      Shell.onChange(soon);
      // In case the stream drops: a slow look anyway.
      setInterval(() => { if (LIVE.on) pull(); }, 10_000);
      if (new URLSearchParams(location.search).get('shot') === 'burst') burst(w);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
    } else {
      startSim(w);
    }
  }
}

function render(w) {
  if (SHOT_PAUSED) w.paused = true;
  const part = w.nowH < 12 ? 'morning' : w.nowH < 17 ? 'afternoon' : 'evening';
  const p = pickCatch(w);
  $('#main').innerHTML = `
  ${Shell.isReal && w.paused ? pausedBanner(w) : ''}
  <section class="hello rise">
    <div class="lhead"><div class="eyebrow">${E(w.dayLabel)}<button class="live-sw ${LIVE.on ? 'on' : ''}" id="live" title="Follow what your AIs do as it happens"></button></div></div>
    <h1>Good ${part}${Shell.isReal ? '' : ', AK'}.<span class="line">${headline(w)}</span></h1>
  </section>
  ${liveHtml(w)}
  <section class="nums">${numbers(w)}</section>
  <section class="grid">
    <article class="card hero rise" style="animation-delay:.15s">${!p ? heroNone(w) : p.n === 1 ? heroOne(w, p) : heroMany(w, p)}</article>
    <aside class="card brief rise" style="animation-delay:.25s">${brief(w)}</aside>
  </section>
  <section class="row2">
    <article class="card mini rise" style="animation-delay:.35s">${rightNow(w)}</article>
    <article class="card mini spend rise" style="animation-delay:.42s">${spend(w)}</article>
  </section>`;

  $$('[data-n]').forEach((e) => tick(e, Number(e.dataset.n), FMT[e.dataset.f]));
  $$('[data-check]').forEach((b) => (b.onclick = () => checkApp(w.apps.find((a) => a.id === b.dataset.check))));
  wireResume();
  shotPause(w);
  mountLive(w);

  // The demo fleet twinkles: now and then one AI finishes and another picks up.
  clearInterval(window.__tick);
  if (Shell.isReal || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  window.__tick = setInterval(() => {
    const on = $$('.matrix i.w'), off = $$('.matrix i:not(.w):not(.r):not(.q)');
    for (let k = 0; k < Math.max(1, Math.round(on.length / 40)); k++) {
      if (!on.length || !off.length) return;
      on.splice(Math.floor(Math.random() * on.length), 1)[0].className = '';
      off.splice(Math.floor(Math.random() * off.length), 1)[0].className = 'w';
    }
  }, 900);
}

Shell.boot({ nav: 'Today', onWorld: render });
Shell.ready.then(() => {
  if (new URLSearchParams(location.search).get('shot') === 'check') setTimeout(() => $('[data-check]')?.click(), 2400);
});
</script>
