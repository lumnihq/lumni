    return shown.map((f, j) => `<g><rect x="${R0 + 14 + j * 26}" y="${Y(l) - 11}" width="22" height="22" rx="6" fill="${l === 3 ? 'var(--accent)' : S.done[f.id] ? 'var(--accent)' : 'var(--ink)'}"/><text x="${R0 + 25 + j * 26}" y="${Y(l) + 4}" text-anchor="middle" font-family="var(--sans)" font-size="9.5" font-weight="750" fill="#fff">${avatar(f)}</text></g>`).join('') +
      (on.length > 4 ? `<text x="${W}" y="${Y(l) + 4}" text-anchor="end" font-family="var(--sans)" font-size="11.5" font-weight="650" fill="var(--ink2)">+${on.length - 4}</text>` : '');
  }).join('');
  const reverts = changes.filter((c) => c.system && c.before === 3);
  const banner = reverts.length ? `<div class="revert">${shield('var(--orange)')}<span>${reverts.slice(-2).reverse().map((c) => `<b>Lumni took Autopilot back from ${names(c.ais.map((f) => safe(f.name)))}</b> on its own, ${safe(when(c.at))}, after ${fmtN(c.slips)} slips in ${fmtN(c.per)}.`).join(' ')}${reverts.length > 2 ? ` And ${reverts.length - 2} more.` : ''} It runs on Enforce again, and its approval rules ask a person.</span></div>` : '';
  const rows = [...changes].reverse();
  const list = rows.length
    ? rows.slice(0, 5).map((c) => `<div class="hr ${c.system ? 'sys' : ''}"><i class="${c.after > c.before ? 'up' : 'down'}"></i><span>${changeText(c)}</span><time>${safe(when(c.at))}</time></div>`).join('') + (rows.length > 5 ? `<div class="hr more">And ${fmtN(rows.length - 5)} more in the last 30 days</div>` : '')
    : `<div class="hr none">No AI changed level in the last 30 days. Each one has held where it is.</div>`;
  el.innerHTML = `<div><h3>Autonomy over time</h3><p>Each AI’s level, the last 30 days, from Lumni’s own record of every change</p>
    ${banner}
    <svg viewBox="0 0 ${W} ${H}" style="height:${H}px">
      ${lanes.map(([l, t]) => `<line x1="${L}" x2="${R0}" y1="${Y(l)}" y2="${Y(l)}" stroke="var(--line)" ${l === 3 ? 'stroke-dasharray="2 4"' : ''}/><text x="0" y="${Y(l) + 4}" font-family="var(--sans)" font-size="12" font-weight="600" fill="${l === 3 ? 'var(--accent)' : 'var(--ink3)'}">${t}</text>`).join('')}
      ${lines}${marks}${ends}
      ${[30, 20, 10].map((d) => `<text x="${X(t1 - d * DAY_MS)}" y="${H - 2}" font-family="var(--sans)" font-size="11.5" font-weight="600" fill="var(--ink3)">${d} days ago</text>`).join('')}
      <text x="${R0}" y="${H - 2}" text-anchor="end" font-family="var(--sans)" font-size="11.5" font-weight="650" fill="var(--ink)">Today, ${safe(S.w.timeLabel)}</text>
    </svg></div>
    <div class="side">
      <div class="big"><span class="num" id="freeN">${Math.round(share * 100)}%</span></div>
      <div class="lab">of today’s actions came from AIs on Enforce or Autopilot</div>
      <div class="hist"><h5>Changes, newest first <span>${fmtN(changes.length)} in 30 days</span></h5>${list}</div>
    </div>`;
  if (first) countUp($('#freeN'), Math.round(share * 100), { suffix: '%', ms: 1200 });
}

/** Real, when the history can't be read: where each AI is now. */
function todayOnly(el, first) {
  const n = S.fleet.reduce((s, f) => s + f.n, 0);
  const onEnforce = S.fleet.reduce((s, f) => s + (levelOf(f) === 2 ? f.n : 0), 0) / Math.max(1, n);
  const W = 912, L = 80, R = 900;
  const Y = (l) => 24 + (2 - l) * 56;
  const at = [2, 1, 0].map((l) => S.fleet.filter((f) => (l === 2 ? levelOf(f) >= 2 : levelOf(f) === l)));
  const dots = at.map((list, i) => {
    const l = 2 - i;
    return list.map((f, j) => {
      const x = R - j * 30;
      return `<g><rect x="${x - 12}" y="${Y(l) - 12}" width="24" height="24" rx="7" fill="${S.done[f.id] ? 'var(--accent)' : 'var(--ink)'}"/><text x="${x}" y="${Y(l) + 4}" text-anchor="middle" font-family="var(--sans)" font-size="10" font-weight="750" fill="#fff">${avatar(f)}</text></g>`;
    }).join('') + (list.length ? '' : `<text x="${R}" y="${Y(l) + 4}" text-anchor="end" font-family="var(--sans)" font-size="12" font-weight="600" fill="var(--ink3)">None today</text>`);
  }).join('');
  const movedHere = Object.keys(MOVED).length;
  el.innerHTML = `<div><h3>Autonomy over time</h3><p>${S.old ? 'Past levels need a newer Lumni API, so this shows where each AI is now.' : 'Lumni’s record of level changes couldn’t be read just now, so this shows where each AI is now.'}</p>
    <svg viewBox="0 0 ${W} 178" style="height:178px">
      ${[[2, 'Enforce'], [1, 'Warn'], [0, 'Watch']].map(([l, t]) => `<line x1="${L}" x2="${W}" y1="${Y(l)}" y2="${Y(l)}" stroke="var(--line)"/><text x="0" y="${Y(l) + 4}" font-family="var(--sans)" font-size="12" font-weight="600" fill="var(--ink3)">${t}</text>`).join('')}
      ${dots}
      <text x="${R + 12}" y="176" text-anchor="end" font-family="var(--sans)" font-size="11.5" font-weight="650" fill="var(--ink)">Today, ${safe(S.w.timeLabel)}</text>
    </svg></div>
    <div class="side">
      <div class="big"><span class="num" id="freeN">${Math.round(onEnforce * 100)}%</span></div>
      <div class="lab">of today’s actions came from AIs on Enforce</div>
      <p>Those are the ones Lumni steps in on for real. The rest it only ${S.fleet.some((f) => levelOf(f) === 1) ? 'flags or ' : ''}watches.</p>
      <div class="pair"><div><small>On Enforce</small><b>${at[0].length}</b></div><div><small>Warn or Watch</small><b>${at[1].length + at[2].length}</b></div><div><small>Moved on this page</small><b>${movedHere}</b></div></div>
    </div>`;
  if (first) countUp($('#freeN'), Math.round(onEnforce * 100), { suffix: '%', ms: 1200 });
}

// ─── page ───────────────────────────────────────────

function render(w, first) {
  timers.forEach(clearTimeout); timers = [];
  const real = Shell.isReal;
  const keep = S?.sel;
  if (!w.fleet.length) return renderEmpty(w);
  const maxStreak = Math.max(...w.fleet.map((f) => f.streak));
  const fleet = w.fleet.map((f) => ({ ...f, trust: trustOf(f, maxStreak), r: { repeats: per1k(f.repeats, f.n), stale: per1k(f.stale, f.n), bad: per1k(f.bad, f.n), lag: real ? f.lag ?? null : null } }));
  const levels = Object.fromEntries(fleet.map((f) => [f.id, f.level]));
  S = { w, real, fleet, levels, done: {}, trails: [], sel: null, old: real && w.source === 'snapshots', rules: undefined, hist: undefined, grants: {}, below: {} };
  // A move you made here stays marked after Lumni is read again.
  if (real) for (const [id, m] of Object.entries(MOVED)) if (levels[id] === m.to && m.to !== m.from) S.done[id] = m.to > m.from ? 'promoted' : 'demoted';
  // Open on the one asked for, then the strongest case to move.
  const asked = query.get('ai');
  const cands = real
    ? fleet.filter((f) => isUp(f) || isApex(f)).sort((a, b) => b.demote - a.demote || b.streak - a.streak)
    : fleet.filter((f) => f.promote).sort((a, b) => per1k(a.repeats + a.stale + a.bad, a.n) - per1k(b.repeats + b.stale + b.bad, b.n) || b.streak - a.streak);
  S.sel = [keep, first ? asked : null, cands[0]?.id, fleet[0].id].find((id) => id && fleet.some((f) => f.id === id));

  $('#main').innerHTML = `
    <section class="head ${first ? 'rise' : ''}">
      <div><div class="eyebrow">${real ? `${safe(w.scale.org)}, ${safe(w.dayLabel)}` : `${w.scale.org}, ${w.dayLabel}`}</div>
        <h1 id="h1" class="${real ? 'wrap1' : ''}">${headline()}</h1>
        <p>${real ? 'Each level is how strictly Lumni enforces an AI’s main operation. Move one on its record.' : 'Autonomy is earned from evidence, never set by a feeling.'}</p></div>
      <div class="chips">${chips()}</div>
    </section>
    <section class="grid">
      <article class="card ladder ${first ? 'rise' : ''}" id="ladder" style="animation-delay:.08s">${ladderHTML()}</article>
      <aside class="card case ${first ? 'rise' : ''}" id="case" style="animation-delay:.16s"></aside>
    </section>
    <section class="card time ${first ? 'rise' : ''}" id="time" style="animation-delay:.24s"></section>`;

  renderTokens(true, first);
  wireTokens();
  renderCase();
  renderTime(first);
  if (real) readHistory(S, first);
  if (first) shot(fleet, real);
}

/** Real: your approval rules (what Autopilot can skip) and the last 30 days of level changes. */
async function readHistory(my, first) {
  if (my.old) { my.rules = null; my.hist = null; renderCase(); renderTime(false); return; }
  const from = new Date(my.w.now - 30 * DAY_MS).toISOString();
  const [rules, hist] = await Promise.all([
    Shell.api.get('/v1/config/policy-rules').then((r) => r?.items ?? [], () => null),
    Shell.api.get(`/v1/audit?type=${HIST_TYPES}&from=${encodeURIComponent(from)}&limit=200`).then((r) => r?.items ?? [], () => null),
  ]);
  if (S !== my) return;
  S.rules = rules; S.hist = hist;
  renderCase();
  renderTime(first);
}

function renderEmpty(w) {
  S = null;
  $('#main').innerHTML = `
    <section class="head rise"><div><div class="eyebrow">${safe(w.scale.org)}, ${safe(w.dayLabel)}</div>
      <h1 id="h1">No AI has acted today yet. <span class="soft">The ladder fills in as they do.</span></h1>
      <p>Each AI lands on the level its main operation runs at, with its record beside it.</p></div></section>
    <section class="card calm-empty rise" style="animation-delay:.08s">
      <b>Nothing to move yet</b>
      <p>Once your agents send actions through Lumni, each one shows up here on Watch, Warn or Enforce. Then you can move it on its record.</p>
      <div class="row"><a class="btn" href="/flow">See today’s flow</a><a class="btn" href="/fixes">See fixes</a></div>
    </section>`;
}

// Screenshot states. Demo: promoted, demote, demoted, notyet, hover.
// Real: promote (move the open case up), undo (then undo it), down (move it
// down), pilot (put an Enforce AI on Autopilot), takeback (then take it back), hover.
function shot(fleet, real) {
  const s = query.get('shot');
  if (!s) return;
  if (s === 'hover') later(() => showTip(fleet.find((f) => f.id === S.sel)), 2400);
  if (real) {
    if (s === 'promote') later(() => $('#go')?.click(), 2000);
    if (s === 'down') later(() => { const f = fleet.find((x) => x.level === 2); if (f) { tokEl(f.id).click(); $('#down')?.click(); } }, 2000);
    if (s === 'undo') { later(() => $('#go')?.click(), 2000); setTimeout(() => $('#undo')?.click(), 6500); }
    if (s === 'pilot' || s === 'takeback') {
      // The first AI on Enforce that an approval rule covers.
      const pick = () => fleet.find((x) => x.level === 2 && pilotPlan(x).state === 'ok');
      later(() => { const f = pick(); if (f) { tokEl(f.id).click(); $('#pilot')?.click(); } }, 2000);
      // A plain timer: the page reads the workspace again in between, which drops its own timers.
      if (s === 'takeback') setTimeout(() => $('#takeback')?.click(), 7000);
    }
    return;
  }
  if (s === 'promoted') later(() => move(S.sel, +1, false), 2600);
  if (s === 'demote') later(() => { const d = fleet.find((f) => f.demote); if (d) tokEl(d.id).click(); }, 400);
  if (s === 'demoted') later(() => { const d = fleet.find((f) => f.demote); if (d) { tokEl(d.id).click(); move(d.id, -1, false); } }, 2600);
  if (s === 'notyet') later(() => { $('#nope').click(); later(() => { tokEl('dunning').click(); $('#nope').click(); }, 300); }, 2400);
}

Shell.boot({ nav: 'Autonomy', onWorld: render });
</script>
