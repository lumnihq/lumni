      <line x1="196" x2="196" y1="0" y2="66" stroke="#a3a7b3" stroke-dasharray="3 3"/>
      <rect x="206" y="43" width="${W - 206}" height="22" rx="7" fill="none" stroke="#d9dae2" stroke-dasharray="4 4"/>
      <text x="215" y="58" font-size="11.5" font-weight="600" fill="#a3a7b3">The next AI’s turn, with a newer token</text>
    </svg>`;
  }
  return `<svg viewBox="0 0 ${W} 66">
    ${lane(20, 0, 150, 'Deploy bot 1, #207', '#f0eeff', '#dcd7ff', '#5b4bf5')}
    <line x1="150" x2="150" y1="0" y2="66" stroke="#a3a7b3" stroke-dasharray="3 3"/>
    <text x="156" y="6" font-size="10.5" font-weight="600" fill="#6a6f7d">lease ran out</text>
    ${lane(54, 160, W, 'Deploy bot 2, #208, wrote update 2.4', '#5b4bf5', '#5b4bf5', '#ffffff')}
    <line x1="150" x2="250" y1="20" y2="20" stroke="#c9c2ff" stroke-width="2" stroke-dasharray="2 4"/>
    <circle cx="259" cy="20" r="8.5" fill="#ffffff" stroke="#5b4bf5" stroke-width="2"/>
    <path d="M255.5 16.5l7 7M262.5 16.5l-7 7" stroke="#5b4bf5" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="24" font-size="11.5" font-weight="650" fill="#0d0e14">Late write from #207, refused</text>
  </svg>`;
}

// ─── boot ───────────────────────────────────────────

function header() {
  if (M.real && M.cleared) {
    // Someone holds a thing right now: say so, like the demo does.
    const n = M.cleared, h = M.holding;
    $('#h1').innerHTML = `<span class="c num" id="hc">${fmtN(n)}</span> AI${n === 1 ? ' is' : 's are'} cleared on ${n === 1 ? 'a shared thing' : `${fmtN(n)} shared things`} right now. `
      + (h ? `<span class="h num" id="hh">${fmtN(h)}</span> ${h === 1 ? 'is' : 'are'} holding.` : 'Nobody is holding.');
    countTo($('#hc'), n, fmtN, 1100);
    if (h) countTo($('#hh'), h, fmtN, 1300);
    return;
  }
  if (M.real) {
    const sh = M.shared, wt = w.kinds.wait;
    $('#h1').innerHTML = !w.things.length
      ? 'Nothing has been touched today yet.'
      : !sh
        ? `Your AIs touched <span class="c num">${fmtN(w.scale.things)}</span> ${w.scale.things === 1 ? 'thing' : 'things'} today, each on its own. Nobody had to wait.`
        : `<span class="c num" id="hc">${fmtN(sh)}</span> thing${sh === 1 ? ' had' : 's had'} more than one AI on ${sh === 1 ? 'it' : 'them'} today. `
        + (wt ? `<span class="h num" id="hh">${fmtN(wt)}</span> ${wt === 1 ? 'time' : 'times'}, an AI waited its turn.` : 'Nobody had to wait.');
    if (sh) countTo($('#hc'), sh, fmtN, 1100);
    if (wt) countTo($('#hh'), wt, fmtN, 1300);
    return;
  }
  const n = M.cleared, t = M.things, h = M.holding;
  $('#h1').innerHTML = `<span class="c num" id="hc">${fmtN(n)}</span> AI${n === 1 ? ' is' : 's are'} cleared on ${fmtN(t)} thing${t === 1 ? '' : 's'} right now. `
    + (h ? `<span class="h num" id="hh">${fmtN(h)}</span> ${h === 1 ? 'is' : 'are'} holding.` : 'Nobody is holding.');
  countTo($('#hc'), n, fmtN, 1100);
  if (h) countTo($('#hh'), h, fmtN, 1300);
}

function legend() {
  const items = M.real
    ? [['#8578ff', 'Went straight in'], ['var(--sky)', 'Waited its turn'], ...(M.runways.some((r) => r.rechecks) ? [['var(--orange)', 'Old info, sent to look again']] : [])]
    : [['#8578ff', 'Cleared, writing now'], ['var(--sky)', 'Holding, waits its turn'], ['var(--orange)', 'Old info, sent to look again'], [null, 'Clash predicted']];
  $('#legend').innerHTML = items.map(([c, t]) => `<span><i ${c ? `style="background:${c}"` : 'class="dash"'}></i>${t}</span>`).join('');
}

function load(world) {
  gen++;
  w = world;
  rnd = rng(w.key.length * 7919 + 17);
  M = buildModel(w);
  if (M.real) M.newer = w.source !== 'snapshots';
  // A re-read keeps the thing you were looking at.
  const keep = M.real && keepId ? M.runways.findIndex((r) => r.thing.id === keepId) : -1;
  sel = keep >= 0 ? keep : 0; note = ''; blipId = 0; confirmHold = false;
  S = newSim();
  paintBackground();
  // The long tail: thousands of smaller shared things, as faint points.
  const T = TARGET[w.key];
  for (let k = 0; k < T.tailThings; k++) {
    for (let tries = 0; tries < 20; tries++) {
      const a = rnd() * TAU, d = Math.sqrt(rnd()) * (R - 22);
      const x = CX + Math.cos(a) * d, y = CY + Math.sin(a) * d;
      if (d < 26 || M.runways.some((r) => Math.hypot(r.x - x, r.y - y) < r.oR + 30)) continue;
      S.tail.push({ x, y }); break;
    }
  }
  // Start mid-flight: holders docked, holding patterns full.
  for (const r of M.runways) {
    const b = mkBlip('dock', r.x, r.y, { rw: r, color: VIOLET });
    r.docked = b;
    if (M.real) r.leaseLeft = 0.4 + rnd() * 2.2;
    for (let k = 0; k < r.visMax; k++) {
      const a = r.orbit + (k * TAU) / r.visMax;
      r.holding.push(mkBlip('hold', r.x + Math.cos(a) * r.oR, r.y + Math.sin(a) * r.oR, { rw: r, color: SKY }));
    }
  }
  // Let the sky fill up before the first frame.
  for (let k = 0; k < (M.real ? 300 : 540); k++) step(1 / 60);
  S.nextConflict = S.t + 1.2;

  header();
  legend();
  $('#livet').textContent = M.real ? `Today so far, ${w.timeLabel}` : `Live, ${w.timeLabel}`;
  $('#tlsub').textContent = M.real
    ? (M.runways.length ? `Top ${fmtN(M.runways.length)} of ${plural(w.scale.things, 'thing')} touched today` : 'Nothing touched today yet')
    : `Top ${M.runways.length} of ${fmtN(w.scale.things)} shared things`;
  $('#sample').textContent = M.real
    ? 'Dots replay today’s traffic at a calm pace, not who is on each thing right now. Counters are exact.'
    : w.key === 'large'
      ? `Dots are a sample of ${fmtN(M.cleared + M.holding)} AIs in the air. Counters are exact.`
      : 'Each dot is one AI. Counters are exact.';
  if (M.real && M.cleared) $('#sample').textContent = 'Dots replay today’s traffic at a calm pace. Who holds each thing, and the queue, are read live on the board.';
  const empty = $('#empty');
  empty.hidden = M.runways.length > 0;
  $('#hint').hidden = M.runways.length < 2;
  if (!M.runways.length) {
    empty.innerHTML = '<b>Nothing touched yet today</b><p>When your AIs start working, each thing they change gets a runway here, one writer at a time.</p><a class="btn accent" href="/today">See today</a>';
  }
  renderBoard(true);
  renderBottom();

  if (SHOT === 'conflict') {
    const r = M.real ? M.runways.find((x) => x.thing.waits) : M.runways[sel];
    if (r) {
      if (r.i !== sel) { sel = r.i; renderBoard(false); }
      S.conflict = null;
      spawnConflict(r);
      while ((S.t - S.conflict.t0) / S.conflict.dur < 1 - 4 / 6) step(1 / 60);
      S.frozen = true;
    }
  }
  if (SHOT === 'resolved' && M.real) {
    const r = M.runways.find((x) => x.thing.waits);
    if (r) {
      if (r.i !== sel) { sel = r.i; renderBoard(false); }
      S.conflict = null;
      spawnConflict(r);
      while ((S.t - S.conflict.t0) / S.conflict.dur < 0.62) step(1 / 60);
      S.frozen = true;
    }
  }
  if (SHOT === 'held' && !M.real) { toggleHold(M.runways[0]); for (let k = 0; k < 300; k++) step(1 / 60); S.frozen = true; renderBoard(false); }
  if (SHOT === 'raised' && !M.real) raise(M.runways[0]);
  if (SHOT === 'select' && M.runways.length > 1) select(1);
  // Real writes, clicked once per page load: hold (twice, to confirm), let go, raise.
  if (M.real && SHOT && !shotDone) {
    shotDone = true;
    const press = (id, ms) => setTimeout(() => $(id)?.click(), ms);
    if (SHOT === 'hold-confirm') press('#bhold', 500);
    if (SHOT === 'hold') { press('#bhold', 500); press('#bhold', 900); }
    if (SHOT === 'letgo') { press('#bhold', 500); press('#bhold', 900); setTimeout(() => press('#bhold', 0), 4200); }
    if (SHOT === 'raise') press('#braise', 500);
    if (SHOT === 'queue' && M.runways.length > 1) { const k = M.runways.findIndex((r, i) => i !== sel && r.lease); if (k >= 0) select(k); }
  }
  draw();
}
let shotDone = false;
let keepId = null;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (M && S) {
    if (!S.frozen && !REDUCED) step(dt);
    draw();
    tickBoard();
  }
  requestAnimationFrame(frame);
}

Shell.boot({
  nav: 'Tower',
  onWorld: async (world) => {
    if (world.key === 'real') {
      keepId = M?.real ? M.runways[sel]?.thing.id ?? null : null;
      EXTRA = await readExtra(world);
    }
    load(world);
  },
});
requestAnimationFrame(frame);
</script>
</body>
</html>
