<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lumni, Contracts</title>
<link rel="stylesheet" href="/lib/base.css" />
<style>
  :root {
    --k-when: #6a6f7d; --k-before: var(--accent); --k-verify: #2563eb; --k-match: #0f766e; --k-within: #b45309;
    --good: #059669; --good-bg: #ecfdf5; --good-line: #a7f3d0; --amber: #b45309; --amber-bg: #fffbeb; --amber-line: #fde68a;
    --shell: #f6f6f9;
  }
  .stage { overflow: clip; }
  .wrap { padding: 30px 40px 90px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 48px; align-items: start; }
  .main { max-width: 780px; width: 100%; justify-self: center; min-height: calc(100vh - 170px); }
  .banner { margin-bottom: 18px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--accent-line); font-size: 14px; color: var(--ink2); }
  .banner b { color: var(--ink); }
  .banner a { margin-left: auto; color: var(--accent); font-weight: 650; white-space: nowrap; }

  /* Motion: things arrive soft, one at a time. */
  @keyframes blurin { from { opacity: 0; filter: blur(5px); transform: translateY(4px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @keyframes chipin { from { opacity: 0; transform: translateY(4px) scale(.92); filter: blur(2px); } }
  @keyframes swap { 35% { transform: scale(1.05); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .shake { animation: shake .4s; }
  .ttl.rv { background: linear-gradient(90deg, var(--ink) 0 50%, var(--ink3) 50% 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep .7s var(--ease) both; }

  /* ── Describe: the box ── */
  .hero { overflow: hidden; }
  .tag { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 650; }
  h1.big { font-size: 38px; font-weight: 750; letter-spacing: -0.035em; line-height: 1.1; margin-top: 14px; text-wrap: balance; }
  .lede { margin-top: 10px; color: var(--ink2); font-size: 16px; line-height: 1.5; }
  .composer { margin-top: 24px; border-radius: 20px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line), 0 18px 46px -26px rgba(40,30,120,.3); transition: box-shadow .25s; }
  .composer:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent-line), 0 22px 56px -24px rgba(91,75,245,.32); }
  .composer textarea { display: block; width: 100%; min-height: 84px; max-height: 200px; resize: none; border: 0; outline: 0; background: none; padding: 20px 22px 6px; font: 17px/1.5 var(--sans); color: var(--ink); }
  .composer textarea::placeholder { color: var(--ink3); }
  .sees { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 22px; }
  .sees:not(:empty) { padding: 2px 22px 4px; }
  .sees .lbl { font-size: 12px; color: var(--ink3); font-weight: 650; margin-right: 2px; animation: fade .3s both; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 650; background: var(--wash); color: var(--ink2); white-space: nowrap; animation: chipin .42s var(--spring) both; transition: opacity .18s, transform .18s, background .3s, color .3s, border-color .15s; border: 1px solid transparent; }
  .chip.intent { background: var(--accent-soft); color: var(--accent); }
  .chip.ask { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
  .chip.muted { background: none; color: var(--ink3); font-weight: 600; }
  .chip.mono { font: 600 12px var(--mono); }
  .chip.add { background: none; color: var(--ink2); border: 1px dashed var(--line2); font-weight: 600; }
  .chip.add:hover { border-color: var(--accent); color: var(--accent); }
  .chip .mk { width: 17px; height: 17px; border-radius: 5px; color: #fff; font-size: 9.5px; font-weight: 800; display: grid; place-items: center; }
  .chip .ok { color: var(--good); display: grid; }
  .chip .off { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .chip.out { opacity: 0; transform: scale(.85); }
  .chip.swap { animation: swap .5s var(--ease); }
  .c-row { display: flex; align-items: center; gap: 10px; padding: 6px 16px 12px 22px; font-size: 12.5px; color: var(--ink3); }
  .c-row .enter { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .send { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; flex: none; box-shadow: 0 8px 20px -8px rgba(91,75,245,.7); transition: transform .15s, opacity .2s, box-shadow .2s; }
  .send:hover:not(:disabled) { transform: translateY(-1px) scale(1.04); }
  .send:disabled { opacity: .3; cursor: default; box-shadow: none; }
  .c-row kbd { font: 600 11.5px var(--mono); padding: 2px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line2); color: var(--ink2); }
  .starters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .starters[hidden] { display: none; }
  .starters .lbl { font-size: 12.5px; color: var(--ink3); font-weight: 650; margin-right: 4px; }
  .starter { height: 32px; padding: 0 13px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; animation: blurin .5s var(--ease) both; transition: box-shadow .15s, color .15s; }
  .starter svg { color: var(--accent-2); }
  .starter:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  .safe { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--ink3); }
  .safe svg { color: var(--good); }

  /* The rule, folded, once it's a contract. */
  .rulepill { display: flex; align-items: center; gap: 12px; padding: 7px 7px 7px 16px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); width: fit-content; max-width: 100%; animation: blurin .45s var(--ease) both; }
  .rulepill svg { color: var(--accent); flex: none; }
  .rulepill span { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rulepill button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 650; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .rulepill button:hover { background: var(--wash); color: var(--ink); }

  /* ── The contract card: one surface that evolves ── */
  .card-c { margin-top: 22px; border-radius: 24px; background: var(--shell); box-shadow: inset 0 0 0 1px var(--line), 0 30px 70px -40px rgba(40,30,120,.35); padding: 8px; animation: blurin .5s var(--ease) both; }
  .card-c[hidden] { display: none; }
  .c-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px 12px; }
  .back-b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); position: relative; transition: color .15s, box-shadow .15s, transform .15s var(--ease); }
  .back-b:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); transform: translateX(-2px); }
  .back-b .tip { position: absolute; top: calc(100% + 8px); left: 0; padding: 6px 10px; border-radius: 8px; background: rgba(13,14,20,.82); color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity .15s, transform .2s var(--ease); z-index: 5; }
  .back-b:hover .tip { opacity: 1; transform: none; }
  .c-icon { width: 40px; height: 40px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
  .c-head .tt { min-width: 0; }
  .c-head b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .c-head small { display: block; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
  .badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); flex: none; animation: fade .3s both; }
  .badge.step::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.good { background: var(--good-bg); color: var(--good); box-shadow: inset 0 0 0 1px var(--good-line); }
  .badge.quiet { background: var(--paper); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--line); }

  .sheet { border-radius: 16px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .sheet + .sheet { margin-top: 8px; }
  /* The stepper. */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); padding: 18px 10px 14px; }
  .st { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .st:not(:last-child)::before, .st:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: calc(50% + 22px); right: calc(-50% + 22px); height: 2px; border-radius: 1px; background: var(--line); }
  .st:not(:last-child)::after { background: var(--good); transform-origin: left; transform: scaleX(var(--fill, 0)); transition: transform .7s var(--ease); }
  .st button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line2); color: var(--ink3); position: relative; transition: box-shadow .3s, background .3s; }
  .st button:disabled { cursor: default; }
  .st.done button { background: var(--good-bg); box-shadow: inset 0 0 0 1.5px var(--good-line); color: var(--good); }
  .st.done button svg { animation: pop .45s var(--spring) both; }
  .st.done button:not(:disabled):hover { box-shadow: inset 0 0 0 1.5px var(--good), 0 0 0 4px var(--good-bg); }
  .st.cur button { box-shadow: inset 0 0 0 1.5px var(--accent-line), 0 0 0 4px var(--accent-soft); color: var(--accent); }
  .st.cur button .arc { position: absolute; inset: -1px; width: 34px; height: 34px; animation: spin 1s linear infinite; }
  .st.stop button { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
  .st .n { font-size: 13.5px; font-weight: 650; color: var(--ink2); }
  .st.cur .n, .st.done .n { color: var(--ink); }
  .st .s { font: 12px var(--mono); color: var(--ink3); min-height: 15px; animation: fade .3s both; }

  /* The step's panel. */
  .panel { padding: 16px 20px 18px; }
  .p-head { display: flex; align-items: baseline; gap: 10px; }
  .p-head .ttl { font-size: 15px; font-weight: 650; }
  .p-head .rt { margin-left: auto; font: 12.5px var(--mono); color: var(--ink3); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
  .lines { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; position: relative; }
  .ln { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 0 12px; align-items: start; font-size: 14.5px; line-height: 1.45; animation: blurin .45s var(--ease) both; position: relative; }
  .ln .li { width: 22px; height: 21px; display: grid; place-items: center; color: var(--ink2); }
  .ln .li .mk { width: 18px; height: 18px; border-radius: 5px; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .ln .lt { min-width: 0; color: var(--ink); }
  .ln .lt small { display: block; font-size: 12.5px; color: var(--ink2); margin-top: 1px; }
  .ln .lr { font-size: 13px; font-weight: 650; color: var(--good); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ln.k { grid-template-columns: 64px minmax(0, 1fr) auto; }
  .ln.k .li { width: auto; justify-content: start; display: flex; }
  .kk { height: 21px; padding: 0 8px; border-radius: 6px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line2); font-size: 11.5px; font-weight: 700; color: var(--kc); display: inline-flex; align-items: center; }
  .kk.when { --kc: var(--k-when); } .kk.before { --kc: var(--k-before); } .kk.verify { --kc: var(--k-verify); } .kk.match { --kc: var(--k-match); } .kk.within { --kc: var(--k-within); }
  .field { height: 22px; padding: 0 8px; border-radius: 6px; background: #f0fdfa; color: var(--k-match); font: 600 12px var(--mono); display: inline-flex; align-items: center; box-shadow: inset 0 0 0 1px #ccfbf1; margin-right: 4px; }
  .ln.good .lt, .ln.good .li { color: var(--good); font-weight: 600; }
  .ln.stop .lt, .ln.stop .li { color: var(--accent); font-weight: 600; }
  .ln.muted .lt { color: var(--ink2); }
  .ln.muted .li { color: var(--ink3); }
  .ln.sep { margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line2); }
  .ln.skel .lt { padding-top: 6px; }
  .ln.skel .lt i { display: block; height: 9px; width: 180px; border-radius: 5px; background: linear-gradient(90deg, var(--wash) 0%, #e7e6f2 50%, var(--wash) 100%); background-size: 200% 100%; animation: sk 1.1s linear infinite; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid var(--line2); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; flex: none; }
  .tok { border-bottom: 1.5px dotted var(--accent-line); font-weight: 650; cursor: pointer; border-radius: 3px; transition: color .15s, background .15s; }
  .tok:hover { color: var(--accent); background: var(--accent-soft); }
  .q { padding: 12px 14px; border-radius: 12px; background: var(--amber-bg); box-shadow: inset 0 0 0 1px var(--amber-line); animation: blurin .4s var(--ease) both; }
  .q b { display: block; font-size: 14px; color: #92400e; }
  .q .said { font-size: 13px; color: #a16207; margin-top: 2px; }
  .answers { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .ans { height: 34px; padding: 0 13px; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--amber-line); font-size: 13.5px; font-weight: 650; }
  .ans:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  .ans.quiet { background: none; box-shadow: none; color: #a16207; }
  .kinds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .kinds button { display: grid; grid-template-columns: 26px 1fr; gap: 1px 10px; text-align: left; padding: 8px 11px; border-radius: 11px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); animation: blurin .4s var(--ease) both; }
  .kinds button:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .kinds .ic { grid-row: span 2; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 750; font-size: 12px; }
  .kinds b { font-size: 13px; } .kinds span:last-child { font-size: 12px; color: var(--ink2); }
  .hook { margin-top: 4px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--wash); gap: 2px; box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 32px; padding: 0 14px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--ink3); transition: background .2s, color .2s, box-shadow .2s; }
  .seg button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(13,14,20,.08), 0 0 0 1px var(--line); }
  .seg button:disabled { cursor: default; }
  .seg.sm button { height: 28px; padding: 0 11px; font-size: 12.5px; }
  .diff { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #fafafc; box-shadow: inset 0 0 0 1px var(--line); font: 12px/1.7 var(--mono); color: var(--ink3); overflow-x: auto; white-space: pre; }
  .diff .add { color: var(--good); display: block; }
  .diff .keep { display: block; }
  details.more { margin-top: 8px; font-size: 13px; color: var(--ink2); }
  details.more summary { cursor: pointer; font-weight: 650; list-style: none; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more pre { margin-top: 6px; white-space: pre-wrap; font: 12px/1.6 var(--mono); color: var(--ink); background: #fafafc; padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
  .link { font-size: 13.5px; font-weight: 650; color: var(--accent); }

  /* The footer: a choice, a hint, one primary action. */
  .c-foot { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; }
  .icon-b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); position: relative; transition: color .2s, background .2s, box-shadow .2s; animation: blurin .35s var(--ease) both; }
  .icon-b:hover { color: var(--ink); }
  .icon-b[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .icon-b[hidden] { display: none; }
  .icon-b .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translate(-50%, 4px); padding: 6px 10px; border-radius: 8px; background: rgba(13,14,20,.82); color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .2s var(--ease); }
  .icon-b:hover .tip { opacity: 1; transform: translate(-50%, 0); }
  .primary { margin-left: auto; height: 42px; min-width: 150px; padding: 0 20px; border-radius: 13px; background: var(--ink); color: #fff; font-size: 14.5px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s, opacity .2s, background .3s; }
  .primary:hover:not(:disabled) { transform: translateY(-1px); }
  .primary:disabled { opacity: .35; cursor: default; }
  .primary.violet { background: var(--accent); box-shadow: 0 12px 28px -12px rgba(91,75,245,.7); }
  .primary span { animation: blurin .35s var(--ease) both; display: inline-flex; align-items: center; gap: 8px; }
  .quiet-b { height: 42px; padding: 0 14px; border-radius: 13px; font-size: 14px; font-weight: 650; color: var(--ink2); }
  .quiet-b:hover { color: var(--ink); background: var(--paper); }
  .primary + .quiet-b, .quiet-b + .primary { margin-left: 0; }
  .c-foot .quiet-b { margin-left: auto; }
  .c-foot .quiet-b + .primary { margin-left: 0; }

  .codecard { margin-top: 16px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); padding: 14px 16px; animation: blurin .45s var(--ease) both; }
  .codecard .hd { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 650; }
  .codecard .hd .x { margin-left: auto; font-size: 13px; color: var(--ink3); }
  pre.code { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: #0f1017; color: #e6e6ef; font: 12.5px/1.6 var(--mono); overflow: auto; max-height: 320px; white-space: pre; }
  pre.code .c { color: #7d8196; } pre.code .s { color: #b9e28c; } pre.code .k { color: #b8afff; } pre.code .f { color: #7cc4ff; }
  .codecard .ft { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  .ghost { height: 34px; padding: 0 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line2); font-size: 13px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; background: var(--paper); }
  .ghost:hover { box-shadow: inset 0 0 0 1px var(--ink); }

  /* ── Rail: your contracts ── */
  .rail { position: sticky; top: 24px; }
  .panel-r { border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); padding: 14px 14px 8px; animation: blurin .45s var(--ease) both; }
  .panel-r[hidden] { display: none; }
  .panel-r h3 { display: flex; align-items: center; font-size: 14px; font-weight: 700; padding: 0 4px 8px; }
  .panel-r h3 button { margin-left: auto; font-size: 12.5px; color: var(--ink3); font-weight: 650; }
  .panel-r h3 button:hover { color: var(--accent); }
  .mine { display: flex; flex-direction: column; gap: 2px; }
  .mc { display: grid; grid-template-columns: 10px 1fr; gap: 1px 10px; text-align: left; padding: 9px 8px; border-radius: 10px; transition: background .15s; animation: chipin .45s var(--spring) both; }
  .mc:hover { background: #fafafc; }
  .mc.cur { background: var(--accent-soft); }
  .mc i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--ink3); }
  .mc i.protect { background: var(--accent); }
  .mc i.paused { background: var(--ink3); }
  .mc i.watch { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
  .mc b { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc span { grid-column: 2; font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc.arriving { visibility: hidden; animation: none; }
  .mc.landed { animation: landed .7s var(--spring) both; }

<script>
// Contracts: say what must be true when your agent says it's done. One card
// follows the contract from there: what Lumni understood, a preview on last
// week's data, a read-only connection to only what it reads, and turning it
// on. Lines arrive one at a time; one primary action at a time. With real
// data the Go API reads, keeps, binds, replays and runs it
// (lib/contracts-real.js), and Connect is where each rule is bound.

const C = window.Contracts;
const R = window.ContractsReal;
const API = R.client(Shell.api);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const safe = (s) => Shell.esc(s);
const fmtN = (n) => Math.round(n).toLocaleString('en-US');
// ?motion=1 plays the motion even where reduced motion is set (screenshots, demos).
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches && !new URLSearchParams(location.search).has('motion');
const NO_API = 'Lumni’s API can’t do this yet';
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const usd = (n) => `$${Number(n).toFixed(2)}`;
const list = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs.at(-1)}`);

const I = {
  spark: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8 6.6 6.6z" fill="currentColor"/></svg>',

  x: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',

  shield: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5 13.5 3.5V8c0 3.2-2.4 5.6-5.5 6.5C4.9 13.6 2.5 11.2 2.5 8V3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.6 8.1 7.3 9.7 10.6 6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  rule: '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 6h5M5.5 9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  pen: '<svg width="13" height="13" viewBox="0 0 14 14"><path d="M9.5 2.5 11.5 4.5 5 11 2.5 11.5 3 9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  copy: '<svg width="15" height="15" viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 3H4a1.5 1.5 0 0 0-1.5 1.5V11" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  warn: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 2 14.5 13.5h-13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.5v3M8 11.6h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  receipt: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M3.5 2h9v12l-2-1.2L8.5 14l-2-1.2L4.5 14l-1-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 5.5h4M6 8h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  arc: '<svg class="arc" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#5b4bf5" stroke-width="2" stroke-linecap="round" stroke-dasharray="24 74"/></svg>',
  enter: '<svg width="13" height="13" viewBox="0 0 14 14"><path d="M11.5 3v4.5a1.5 1.5 0 0 1-1.5 1.5H3M5.5 6.5 3 9l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  more: '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

const EXAMPLES = [
  { t: 'No more than one refund is permitted per order. Every successful cancellation must leave the subscription inactive in Stripe.', short: 'Refund once per order' },
  { t: 'Every successful cancellation must leave the subscription inactive in Stripe within 5 minutes.', short: 'Cancellations really cancel' },
  { t: 'Ask a person before any refund over $500.', short: 'A person approves big refunds' },
];
const KEYS = { when: 'When', before: 'Before', verify: 'Verify', match: 'Match', within: 'Within' };
// With real data a preview replays the rules on recorded actions, so the API
// needs them bound first: Connect comes before Preview.
const STEPS_DEMO = [['describe', 'Describe'], ['preview', 'Preview'], ['connect', 'Connect'], ['on', 'Turn on']];
const STEPS_REAL = [['describe', 'Describe'], ['connect', 'Connect'], ['preview', 'Preview'], ['on', 'Turn on']];
let STEPS = STEPS_DEMO;
const STATE = { draft: 'Not on yet', watch: 'Watching', protect: 'Protecting', paused: 'Paused' };
const CLAIM = { refund: 'Refunded', cancellation: 'Canceled', charge: 'Charged', invoice: 'Sent invoice', renewal: 'Renewed', email: 'Sent', 'ticket close': 'Closed ticket', deploy: 'Deployed', delete: 'Deleted', 'record update': 'Updated' };
const TOOLS = { claude: 'Claude Code', codex: 'Codex', cursor: 'Cursor' };

let W = null;
let S = null;
let TIMERS = [];
const later = (fn, ms) => { const t = setTimeout(fn, calm ? Math.min(ms, 20) : ms); TIMERS.push(t); return t; };
/** A wait that's part of the story (connecting, a first call), not motion: reduced motion keeps it. */
const wait = (fn, ms) => { const t = setTimeout(fn, ms); TIMERS.push(t); return t; };
const sleep = (ms) => new Promise((r) => later(r, ms));

// ─── saved contracts (this browser, per demo volume) ─────

const storeKey = () => `lumni.contracts.v4.${Shell.key}`;
function load() {
  if (Shell.isReal) return [];
  try { const v = JSON.parse(localStorage.getItem(storeKey()) ?? 'null'); if (Array.isArray(v)) return v; } catch {}
  return [];
}
function save() {
  if (Shell.isReal) return;
  try { localStorage.setItem(storeKey(), JSON.stringify(S.list.map(({ rp, ...c }) => c))); } catch {}
}

/** Read a message into rules, with the kinds you picked and the parts you changed. */
function derive(text, forced, over) {
  return readRules(text).map((r) => {
    let x = forced[r.text] ? C.choose(r, forced[r.text]) : r;
    if (over[r.text] && x.type) x = { ...x, slots: { ...x.slots, ...over[r.text] }, guessed: x.guessed.filter((g) => !(g in over[r.text])) };
    return x;
  });
}
const ruleOf = (c) => c.rules.find((r) => r.type);

// With real data, the API reads the words (POST /v1/contracts/classify), once
// per text; the page repaints when its answer lands.
const READS = new Map();
const ASKED = new Map();
function readRules(text) {
  if (!Shell.isReal) return C.classify(text);
  const t = String(text ?? '').trim();
  if (!t) return [];
  if (READS.has(t)) return READS.get(t);
  readNow(t).catch(() => {});
  return [];
}
function readNow(t) {
  if (READS.has(t)) return Promise.resolve(READS.get(t));
  if (ASKED.has(t)) return ASKED.get(t);
  const p = API.classify(t).then((rs) => {
    READS.set(t, R.fromReadings(rs));
    ASKED.delete(t);
    if (S?.draft.text.trim() === t) { paintSees(); if (S.entered && S.stage === 'describe' && !S.c?.busy) paintCard(); }
    return READS.get(t);
  }, (e) => {
    ASKED.delete(t);
    if (S?.draft.text.trim() === t) Shell.toast(e.message, 'bad');
    throw e;
  });
  ASKED.set(t, p);
  return p;
}
const appColor = (id) => W.apps?.find((a) => a.id === id)?.color ?? { shopify: '#5e8e3e', hubspot: '#ff7a59' }[id] ?? '#0d0e14';

// ─── the screen ─────────────────────────────────────

function render(w, first) {
  for (const t of TIMERS) clearTimeout(t);
  TIMERS = [];
  W = w;
  const connected = new Set((w.apps ?? []).filter((a) => !a.blind && a.id !== 'more').map((a) => a.id));
  // What each connected app already lets Lumni read. The demo's checkers read
  // refunds, charges and invoices in Stripe; anything else is asked for.
  const GRANTED = { stripe: ['refunds', 'charges', 'invoices'], zendesk: ['tickets'], salesforce: ['records'], quickbooks: ['invoices'], vercel: ['deployments'] };
  const grants = new Map([...connected].map((id) => [id, new Set(GRANTED[id] ?? [])]));
  STEPS = Shell.isReal ? STEPS_REAL : STEPS_DEMO;
  S = { list: load(), c: null, stage: 'describe', miss: false, draft: { text: '', forced: {}, over: {} }, connected, grants, hooked: new Set(), run: 0, ctx: null, raw: {}, needs: null, hooks: null, pv: null, dirty: false, saving: false };
  $('#main').innerHTML = `
    <section class="grid">
      <div class="main">
        <div id="top-slot"></div>
        <article class="card-c" id="card" hidden></article>
        <div id="extra"></div>
      </div>
      <aside class="rail"><div class="panel-r" id="minepanel" hidden><h3>Your contracts <a href="/contract-list" style="margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:650">See all</a><button data-new style="margin-left:12px">New</button></h3><div class="mine" id="mine"></div></div></aside>
    </section>`;
  paintTop(true);
  paintMine();
  if (Shell.isReal) return loadReal(first);
  const want = new URLSearchParams(location.search);
  const c = want.get('open') && S.list.find((x) => x.id === want.get('open'));
  if (first && c) {
    openContract(c);
    if (want.get('edit')) reopen();
    return;
  }
  if (first) shot();
}

/** The top: the box while you describe, the rule folded once you press Enter. */
function paintTop(open) {
  const slot = $('#top-slot');
  if (!open) {
    slot.innerHTML = `<div class="rulepill">${I.rule}<span title="${safe(S.draft.text)}">${safe(S.draft.text)}</span><button data-edit>${I.pen}Edit</button></div>`;
    return;
  }
  slot.innerHTML = `<section class="hero">
      <span class="tag">${I.spark}${S.c ? `Editing ${safe(S.c.title)}` : 'Outcome contracts'}</span>
      <h1 class="big">What should always be true when your agent says it’s done?</h1>
      <p class="lede">Say it the way you’d tell a new teammate. Lumni works out the rule, the apps it has to read, and what must match.</p>
      <div class="composer" id="composer">
        <textarea id="say" rows="2" placeholder="e.g. Never refund the same order twice, and check Stripe shows it" aria-label="Describe the outcome">${safe(S.draft.text)}</textarea>
        <div class="sees" id="sees" aria-live="polite"></div>
        <div class="c-row"><span id="hint">Lumni reads it as you type</span><span class="enter">${I.enter}<kbd>Enter</kbd></span><button class="send" id="send" type="button" aria-label="Continue" title="Continue" disabled>${I.arrow}</button></div>
      </div>
      <div class="starters" id="starters">${S.c ? '' : `<span class="lbl">Try</span>${EXAMPLES.map((e, i) => `<button class="starter" data-try="${i}" style="animation-delay:${0.15 + i * 0.06}s">${I.spark}${safe(e.short)}</button>`).join('')}`}</div>
      <p class="safe">${I.shield}Nothing runs until you turn it on. Lumni only ever reads your apps.</p>
    </section>`;
  const ta = $('#say');
  let soon = 0;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = `${Math.min(200, Math.max(84, ta.scrollHeight))}px`; };
  const send = $('#send');
  const update = () => { S.draft.text = ta.value; send.disabled = !ta.value.trim(); paintSees(); };
  ta.addEventListener('input', () => { grow(); clearTimeout(soon); soon = setTimeout(update, 140); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); clearTimeout(soon); update(); enter(); } });
  send.addEventListener('click', () => { clearTimeout(soon); update(); enter(); });
  grow();
  if (S.draft.text) update();
  if (!calm) ta.focus({ preventScroll: true });
}

/** Swap the top between the box and the folded rule, its height gliding. */
function swapTop(open) {
  const slot = $('#top-slot');
  const h0 = slot.offsetHeight;
  paintTop(open);
  if (calm) return;
  slot.animate([{ height: `${h0}px`, opacity: 0.4 }, { height: `${slot.offsetHeight}px`, opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

/** Enter: the box folds into the rule, and the card arrives with what Lumni understood. */
function enter() {
  const said = S.draft.text.trim();
  // Real data: wait for the API's reading of these words, then go on.
  if (Shell.isReal && said && !READS.has(said)) return readNow(said).then(() => { if (S.draft.text.trim() === said) enter(); }, () => {});
  if (!S.draft.text.trim() || !draftRules().length) { const k = $('#composer'); k?.classList.remove('shake'); void k?.offsetWidth; k?.classList.add('shake'); return; }
  S.entered = true;
  S.stage = 'describe';
  S.run++;
  $('#extra').innerHTML = '';
  swapTop(false);
  const card = $('#card');
  card.hidden = true;
  card.innerHTML = '';
  paintCard();
  window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
}

/** Edit: the card steps aside and the box opens again with your words. */
function reopen() {
  S.entered = false;
  S.stage = 'describe';
  S.run++;
  $('#extra').innerHTML = '';
  if (S.c) S.draft = { text: S.c.text, forced: { ...S.c.forced }, over: { ...S.c.over } };
  const card = $('#card');
  const done = () => { card.hidden = true; card.innerHTML = ''; };
  if (calm) done();
  else card.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(8px)', filter: 'blur(4px)' }], { duration: 220, fill: 'forwards' }).onfinish = () => { done(); card.getAnimations().forEach((a) => a.cancel()); };
  swapTop(true);
}

// ─── what Lumni sees, while you type ────────────────

const draftRules = () => derive(S.draft.text, S.draft.forced, S.draft.over);

function seesChips() {
  const t = S.draft.text.trim();
  if (!t) return [];
  const rules = draftRules();
  const words = t.split(/\s+/).length;
  const out = [];
  for (const r of rules) {
    if (r.type) out.push({ k: `i:${r.text}`, cls: 'intent', html: safe(C.short(r)) });
    else if (r.state === 'ask') out.push({ k: `i:${r.text}`, cls: 'ask', html: `${safe(C.typeOf(r.ranked[0].type).label)} or ${safe(C.typeOf(r.ranked[1].type).label.toLowerCase())}?` });
    else if (words >= 3) out.push({ k: `i:${r.text}`, cls: 'muted', html: 'Still reading…' });
  }
  const typed = rules.map((r) => (r.type ? r : r.state === 'ask' ? { ...r, type: r.ranked[0].type } : null)).filter(Boolean);
  for (const n of C.needs(typed, S.connected)) {
    if (n.kind === 'app') out.push({ k: `a:${n.id}`, cls: '', html: `<span class="mk" style="background:${appColor(n.id)}">${safe(n.name[0])}</span>${safe(n.name)}${n.ok ? `<span class="ok" title="Connected">${I.tick}</span>` : '<span class="off" title="Not connected yet"></span>'}` });
    else out.push({ k: `f:${n.name}`, cls: 'mono', html: safe(n.name) });
  }
  for (const h of C.hints(t, rules)) out.push({ k: `h:${h.slot}`, cls: 'add', html: `+ ${safe(h.label)}`, add: h.add });
  return out;
}

function paintSees() {
  const el = $('#sees');
  if (!el) return;
  const want = seesChips();
  $('#hint').textContent = want.length ? '' : 'Lumni reads it as you type';
  $('#starters')?.toggleAttribute('hidden', !!S.draft.text.trim());
  const have = new Map($$('.chip:not(.out)', el).map((x) => [x.dataset.k, x]));
  for (const [k, x] of have) if (!want.some((w) => w.k === k)) { x.classList.add('out'); setTimeout(() => x.remove(), 200); }
  let lbl = $('.lbl', el);
  if (want.length && !lbl) { lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'Lumni sees'; el.prepend(lbl); }
  if (!want.length) lbl?.remove();
  let i = 0;
  for (const w of want) {
    let x = have.get(w.k);
    const cls = `chip ${w.cls}`;
    if (x) {
      if (x.innerHTML !== w.html || x.className !== cls) { x.className = cls; x.innerHTML = w.html; x.classList.remove('swap'); void x.offsetWidth; x.classList.add('swap'); }
    } else {
      x = document.createElement(w.add ? 'button' : 'span');
      x.className = cls;
      x.dataset.k = w.k;
      x.innerHTML = w.html;
      x.style.animationDelay = `${i++ * 0.05}s`;
      el.append(x);
    }
    if (w.add) { x.dataset.add = w.add; x.title = 'Add this to your rule'; }
  }
  for (const w of want) { const x = $$('.chip:not(.out)', el).find((y) => y.dataset.k === w.k); if (x) el.append(x); }
}

// ─── the card ───────────────────────────────────────

/** Change a box's content, letting its height glide to the new one. */
function morph(box, fn) {
  const h0 = box.offsetHeight;
  fn();
  const h1 = box.offsetHeight;
  if (calm || !h0 || Math.abs(h1 - h0) < 2) return;
  box.style.overflow = 'hidden';
  const a = box.animate([{ height: `${h0}px` }, { height: `${h1}px` }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  a.onfinish = () => { box.style.overflow = ''; };
}

/** One line in a panel: an icon, the words, and something on the right. */
function line(o) {
  return `<div class="ln ${o.cls ?? ''}" data-key="${safe(o.key ?? '')}"><span class="li">${o.icon ?? ''}</span><div class="lt">${o.html}</div>${o.right ? `<span class="lr">${o.right}</span>` : ''}</div>`;
}
const skel = (text) => line({ cls: 'skel', key: 'skel', icon: '<span class="spin"></span>', html: text ? `<span style="color:var(--ink2);font-size:13.5px">${text}</span>` : '<i></i>' });

/** Paint the whole card for the stage it's in. */
function paintCard() {
  const card = $('#card');
  const c = S.c;
  const rules = c ? c.rules : draftRules();
  const t = S.draft.text.trim();
  const show = S.entered && (!!c || !!t);
  if (!show) { card.hidden = true; card.innerHTML = ''; return; }
  const fresh = card.hidden || !card.innerHTML;
  card.hidden = false;
  if (fresh) {
    card.innerHTML = `<div class="c-head" id="c-head"></div><div class="sheet"><div class="steps" id="c-steps"></div></div><div class="sheet" id="c-sheet"><div class="panel" id="c-panel"></div></div><div class="c-foot" id="c-foot"></div>`;
  }
  paintHead();
  paintSteps();
  if (S.stage === 'describe') describePanel(fresh);
  paintFoot();
}

function paintHead() {
  const c = S.c;
  const rules = c ? c.rules : draftRules();
  const ready = rules.length && rules.every((r) => r.type);
  const title = c?.title ?? (ready ? C.title(rules) : 'Taking shape');
  const sub = rules.filter((r) => r.type).map((r) => C.short(r)).join(', ') || 'Lumni is reading your rule';
  const n = STEPS.findIndex(([id]) => id === S.stage) + 1;
  const badge = c && c.mode !== 'draft'
    ? `<span class="badge good">${I.tick}${STATE[c.mode]}</span>`
    : !ready ? '<span class="badge quiet"><span class="spin"></span>Reading</span>' : `<span class="badge step">Step ${n}/4</span>`;
  const head = $('#c-head');
  const was = head.dataset.t;
  const i = STEPS.findIndex(([id]) => id === S.stage);

  const html = `<button class="back-b" data-back aria-label="${back}">${I.back}<span class="tip">${back}</span></button><span class="c-icon">${I.spark}</span><div class="tt"><b class="ttl">${safe(title)}</b><small>${safe(sub)}</small></div>${badge}`;
  if (head.dataset.h === html) return;
  head.innerHTML = html;
  head.dataset.h = html;
  if (was && was !== title) $('.ttl', head).classList.add('rv');

}

function stepDone(id) {
  const c = S.c;
  // Before it's saved, Describe is done as soon as every sentence reads cleanly.
  if (!c) { const rs = draftRules(); return id === 'describe' && rs.length > 0 && rs.every((r) => r.type); }
  if (id === 'on') return c.mode !== 'draft';
  return !!c.done[id];
}
function stepSub(id) {
  const c = S.c;
  const rules = c ? c.rules : draftRules();
  if (id === 'describe') { const n = rules.filter((r) => r.type).length; return n ? `${n} ${n === 1 ? 'rule' : 'rules'}` : ''; }
  if (!c) return '';
  if (Shell.isReal) {
    if (id === 'preview') return c.done.preview && S.pv ? `${R.dash(S.pv.seen)} replayed` : '';
    if (id === 'connect') return c.done.connect ? [...new Set(c.rules.map((r) => r.binding?.operation).filter(Boolean))].join(', ') : '';
  }
  if (id === 'preview') return c.done.preview ? (S.miss && S.stage === 'preview' ? 'stopped' : '1.8s') : '';
  if (id === 'connect') return c.done.connect ? appsOf(c).map((a) => a.name).join(', ') : '';
  return c.mode !== 'draft' ? STATE[c.mode].toLowerCase() : '';
}

function paintSteps() {
  const el = $('#c-steps');
  const cur = S.stage;
  const html = STEPS.map(([id, name], i) => {
    const done = stepDone(id);
    const isCur = id === cur && !done;
    const stop = id === 'preview' && cur === 'preview' && S.miss && S.c?.done.preview;
    const next = STEPS[i + 1]?.[0];
    const fill = !next ? 0 : done && (stepDone(next) || next === cur) ? 1 : done ? 0.5 : 0;
    const can = !!S.c && (done || isCur);
    return `<div class="st ${done ? 'done' : ''} ${isCur ? 'cur' : ''} ${stop ? 'stop' : ''}" style="--fill:${fill}">
      <button data-step="${id}" ${can ? '' : 'disabled'} aria-label="${name}">${stop ? I.shield : done ? I.tick : isCur ? I.arc : ''}</button>
      <span class="n">${name}</span><span class="s">${safe(stepSub(id))}</span></div>`;
  }).join('');
  if (el.dataset.h === html) return;
  // Keep the nodes, so the line fills and the ticks pop rather than redraw.
  if (el.children.length === 4) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    [...tmp.children].forEach((n, i) => {
      const o = el.children[i];
      if (o.className !== n.className) o.className = n.className;
      o.style.cssText = n.getAttribute('style');
      const ob = $('button', o), nb = $('button', n);
      if (ob.innerHTML !== nb.innerHTML) ob.innerHTML = nb.innerHTML;
      ob.disabled = nb.disabled;
      const os = $('.s', o), ns = $('.s', n);
      if (os.textContent !== ns.textContent) { os.textContent = ns.textContent; os.style.animation = 'none'; void os.offsetWidth; os.style.animation = ''; }
    });
  } else el.innerHTML = html;
  el.dataset.h = html;
}

function paintFoot() {
  const c = S.c;
  const foot = $('#c-foot');
  const real = Shell.isReal;
  const mode = c && c.mode !== 'draft' ? c.mode : S.pick ?? 'watch';
  const seg = `<div class="seg" role="tablist" title="How it starts">
      <button role="tab" data-pick="watch" aria-selected="${mode === 'watch'}" ${c?.busy ? 'disabled' : ''}>Watch</button>
      <button role="tab" data-pick="protect" aria-selected="${mode === 'protect'}" ${c?.busy ? 'disabled' : ''}>Protect</button></div>`;
  const showWarn = S.stage === 'preview' && c?.done.preview && !real;
  const warn = showWarn ? `<button class="icon-b" data-miss aria-pressed="${S.miss}">${I.warn}<span class="tip">${S.miss ? 'Back to one that held' : 'Show one it would stop'}</span></button>` : '';
  const p = primary();
  const html = `${seg}${warn}${p.second ?? ''}<button class="primary ${p.violet ? 'violet' : ''}" data-primary="${p.act}" ${p.off ? 'disabled' : ''} ${p.title ? `title="${p.title}"` : ''}><span>${p.label}</span></button>`;
  if (foot.dataset.h === html) return;
  foot.innerHTML = html;
  foot.dataset.h = html;
}

const whiteSpin = '<span class="spin" style="border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>';

/** One primary action at a time. */
function primary() {
  const c = S.c;
  const real = Shell.isReal;
  if (S.stage === 'describe') {
    const rules = draftRules();
    const ready = rules.length && rules.every((r) => r.type);
    if (real) return S.saving ? { act: '', label: `${whiteSpin}Saving`, off: true } : { act: 'preview', label: `${c ? 'Save changes' : 'Save draft'}${I.arrow}`, off: !ready };
    return { act: 'preview', label: `${c ? 'Preview again' : 'Preview it'}${I.arrow}`, off: !ready };
  }
  if (real) return primaryReal(c);
  if (S.stage === 'preview') return c.done.preview ? { act: 'connect', label: `Connect read-only${I.arrow}` } : { act: '', label: `${whiteSpin}Previewing`, off: true };
  if (S.stage === 'connect') {
    const skip = real ? '<button class="quiet-b" data-skip>Skip for now</button>' : '';
    const missing = appsOf(c).find((a) => !a.ok);
    if (missing) return { act: `app:${missing.id}`, label: `${I.shield}${missing.connected ? `Allow ${safe(missing.name)} access` : `Connect ${safe(missing.name)} read-only`}`, second: skip };
    if (!agentOk(c)) {
      if (c.hook.state === 'waiting') return { act: '', label: `${whiteSpin}Waiting for a call`, off: true, second: skip };
      return { act: 'copy', label: `${I.copy}Copy task for ${TOOLS[c.hook.tool]}`, second: skip };
    }
    return { act: 'on', label: `Turn it on${I.arrow}` };
  }
  if (c.mode === 'draft') return { act: 'go-on', label: (S.pick ?? 'watch') === 'protect' ? 'Protect now' : 'Start watching', violet: true, off: real, title: real ? NO_API : '' };
  return { act: 'test', label: `${I.spark}Write the regression test`, second: '<button class="quiet-b" data-new>New contract</button>' };
}

// ─── panels ─────────────────────────────────────────

function setPanel(stage, title, right, html, { reveal = true, stagger = 0.07 } = {}) {
  const panel = $('#c-panel');
  morph($('#c-sheet'), () => {
    panel.innerHTML = `<div class="p-head"><span class="ttl ${reveal ? 'rv' : ''}">${title}</span><span class="rt" id="p-rt">${right ?? ''}</span></div><div class="lines" id="p-lines">${html}</div>`;
  });
  panel.dataset.stage = stage;
  $$('#p-lines > *').forEach((x, i) => { x.style.animationDelay = `${0.12 + i * stagger}s`; });
}
function addLines(html) {
  const box = $('#p-lines');
  if (!box) return;
  morph($('#c-sheet'), () => { $('.ln.skel', box)?.remove(); box.insertAdjacentHTML('beforeend', html); });
}

/** What Lumni understood: the rule as When, Before, Verify, Match, Within. */
function describePanel(fresh) {
  const rules = draftRules();
  const ready = rules.length && rules.every((r) => r.type);
  const lines = [];
  rules.forEach((r, i) => {
    if (!r.type && r.state === 'ask' && !S.draft.picking?.[r.text]) {
      const [a, b] = r.ranked;
      lines.push(`<div class="q" data-key="q${i}"><b>Lumni read this two ways</b><div class="said">“${safe(r.text)}”</div><div class="answers"><button class="ans" data-choose="${i}|${a.type}">${safe(C.typeOf(a.type).ask)}</button><button class="ans" data-choose="${i}|${b.type}">${safe(C.typeOf(b.type).ask)}</button><button class="ans quiet" data-manual="${i}">Something else</button></div></div>`);
      return;
    }
    if (!r.type) {
      lines.push(`<div class="q" data-key="k${i}"><b>What kind of rule is this?</b><div class="said">“${safe(r.text)}”</div><div class="kinds">${C.TYPES.map((t, j) => `<button data-choose="${i}|${t.id}" style="animation-delay:${j * 0.03}s"><span class="ic">${safe(t.icon)}</span><b>${safe(t.label)}</b><span>${safe(t.blurb)}</span></button>`).join('')}</div></div>`);
      return;
    }
    C.spec(r).forEach((row, j) => {
      const html = row.fields ? row.fields.map((f) => `<span class="field">${safe(f)}</span>`).join('') : runsHtml(row.runs, i);
      lines.push(line({ cls: `k ${i && !j ? 'sep' : ''}`, key: `${i}:${row.k}`, icon: `<span class="kk ${row.k}">${KEYS[row.k]}</span>`, html }));
    });
  });
  if (ready) lines.push(line({ cls: 'good sep', key: 'ok', icon: I.ticks, html: rules.map((r) => safe(C.sentence(r))).join(' ') }));
  else if (!rules.some((r) => !r.type && (r.state === 'ask' || r.state === 'pick'))) lines.push(skel());
  const right = ready ? `${rules.length} ${rules.length === 1 ? 'sentence' : 'sentences'}` : '<span class="spin"></span>reading';
  const box = $('#p-lines');
  if (fresh || !box || $('#c-panel').dataset.stage !== 'describe') {
    setPanel('describe', 'What Lumni understood', right, lines.join(''), { reveal: !fresh, stagger: 0.05 });
    return;
  }
  // Keep what's unchanged still; new lines arrive, changed ones settle.
  const prev = new Map($$('[data-key]', box).map((x) => [x.dataset.key, x.textContent]));
  morph($('#c-sheet'), () => {
    box.innerHTML = lines.join('');
    $('#p-rt').innerHTML = right;
  });
  for (const x of $$('[data-key]', box)) {
    const was = prev.get(x.dataset.key);
    if (was === undefined) continue;
    x.style.animation = 'none';
    if (was !== x.textContent) settle($('.lt', x) ?? x);
  }
}

function runsHtml(rs, i) {
  return rs.map((x) => (typeof x === 'string' ? safe(x) : `<span class="tok" data-tok="${i}|${x.slot}">${safe(C.say(x.slot, x.value))}</span>`)).join('');
}

/** Lock the rule in and go straight to the preview. */
function commit() {
  const rules = draftRules();
  if (!rules.length || !rules.every((r) => r.type)) {
    const q = $('#c-panel .q') ?? $('#composer');
    q?.classList.remove('shake'); void q?.offsetWidth; q?.classList.add('shake');
    return;
  }
  if (Shell.isReal) return commitReal(rules);
  const d = S.draft;
  const editing = S.c;
  const c = editing ?? { id: `c${Date.now().toString(36)}`, mode: 'draft', hook: { tool: 'claude', state: 'none' }, done: {} };
  const before = editing ? JSON.stringify(needKey(editing)) : null;
  Object.assign(c, { text: d.text.trim(), rules, title: C.title(rules), forced: { ...d.forced }, over: { ...d.over } });
  c.done.describe = true;
  if (editing && before !== JSON.stringify(needKey(c))) c.done.connect = false;
  c.done.preview = false;
  S.c = c;
  S.miss = false;
  S.draft.text = c.text;
  paintTop(false);
  goStage('preview');
}
const needKey = (c) => ({ apps: [...new Set(c.rules.filter((r) => r.type).map((r) => r.slots.app))].sort(), hook: C.hookNeeds(c.rules), op: C.operation(ruleOf(c)) });

function goStage(stage) {
  S.stage = stage;
  S.run++;
  closeMenus();
  $('#extra').innerHTML = '';
  if (stage === 'describe') {
    S.draft = { text: S.c.text, forced: { ...S.c.forced }, over: { ...S.c.over } };
    $('#c-panel').dataset.stage = '';
  }
  paintCard();
  if (stage === 'preview') (Shell.isReal ? previewReal : runPreview)();
  if (stage === 'connect') (Shell.isReal ? bindPanel : connectPanel)();
  if (stage === 'on') onPanel();
  save();
  paintMine();
}

// ─── 2. Preview, on last week's data ────────────────

function sample(c) {
  const rp = Shell.isReal ? null : C.replay(c.rules.filter((r) => r.type), W);
  c.rp = rp;
  const ex = rp?.examples?.[0] ?? { action: 'act_7f3k2q', agent: agentOf(c).name, key: `${ruleOf(c).slots.key.slice(0, 3)}_8812`, amount: 49, day: 'Thu', at: '10:42 AM', first: 're_8Dx72nL6', second: 're_8Dx72nL7', evidence: 'sha256:9f1c2e0b7a44d1e3', story: 'omar' };
  return { rp, ex };
}

function proofRows(c, ex, miss) {
  const r = ruleOf(c);
  const s = r.slots;
  const id = String(ex.key).split('_').pop();
  const val = { amount: usd(ex.amount), currency: 'USD', customer: `cus_${id}Q`, approver: 'Priya, Finance', 'last editor': 'Refund agent' };
  const out = [];
  for (const f of C.spec(r).find((x) => x.k === 'match')?.fields ?? []) {
    const v = f === `${s.key}_id` ? ex.key : f.endsWith('_id') ? `${f.slice(0, 3)}_${id}` : val[f] ?? '…';
    let o = v;
    let bad = false;
    if (miss && r.type === 'amount-cap' && f === 'amount') { o = `${usd(ex.amount * 0.7)} eligible`; bad = true; }
    if (miss && r.type === 'approval-over' && f === 'approver') { o = 'nobody yet'; bad = true; }
    out.push({ k: f.replace(/_/g, ' '), p: v, o, bad });
  }
  return out;
}

/** The preview: lines arrive one at a time, as the check runs. */
async function runPreview() {
  const c = S.c;
  const run = S.run;
  const alive = () => S.run === run && S.stage === 'preview' && S.c === c;
  const miss = S.miss;
  const r = ruleOf(c);
  const s = r.slots;
  const { rp, ex } = sample(c);
  const app = C.appName(s.app);
  const before = C.spec(r).some((x) => x.k === 'before');
  const rows = proofRows(c, ex, miss);
  const mark = `<span class="mk" style="background:${appColor(s.app)}">${safe(app[0])}</span>`;
  const title = miss ? `The one it would stop, from ${safe(ex.day)} ${safe(ex.at)}` : Shell.isReal ? 'Preview on sample values' : 'Preview on last week’s data';
  setPanel('preview', title, '0.0s', skel());
  // A clock on the right, like a run.
  const t0 = performance.now();
  const tick = () => { const el = $('#p-rt'); if (!el || !alive() || el.dataset.stop) return; el.textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s`; requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  const step = async (ms, html) => { await sleep(ms); if (!alive()) return false; addLines(html + skel()); return true; };
  const claim = miss
    ? (r.type === 'once-per-key' ? `${safe(ex.agent)} tries a second ${safe(s.action)} for <b>${safe(ex.key)}</b>` : `${safe(ex.agent)} tries a ${safe(s.action)} for <b>${safe(ex.key)}</b>`)
    : `${safe(ex.agent)} says “${safe(CLAIM[s.action] ?? 'Done')}${['refund', 'charge'].includes(s.action) ? ` ${usd(ex.amount)}` : ''}” for <b>${safe(ex.key)}</b>`;
  if (!await step(420, line({ icon: I.bot, html: claim }))) return;
  if (!await step(640, line({ icon: mark, html: before && miss ? `Lumni checks ${safe(app)} before it runs` : `Lumni reads it back from ${safe(app)}, not from the agent` }))) return;
  const ok = rows.filter((x) => !x.bad).map((x) => x.k);
  const bad = rows.find((x) => x.bad);
  if (ok.length && !await step(620, line({ icon: `<span style="color:var(--good)">${I.tick}</span>`, html: `${safe(cap(list(ok)))} ${ok.length === 1 ? 'matches' : 'match'}` }))) return;
  const last = miss
    ? bad ? `${safe(cap(bad.k))}: ${safe(bad.o)}` : r.type === 'once-per-key' ? `${safe(app)} already shows a ${safe(s.action)} for this ${safe(s.key)}` : r.type === 'end-state' ? `The ${safe(s.object)} is still active` : 'It would break the rule'
    : r.type === 'once-per-key' ? `Exactly one ${safe(s.action)} for this ${safe(s.key)}` : r.type === 'end-state' ? `The ${safe(s.object)} is ${safe(s.state)}` : r.type === 'approval-over' ? 'Approved by Priya, Finance, before it ran' : 'It kept the rule';
  if (!await step(580, line({ icon: miss ? `<span style="color:var(--accent)">${I.x}</span>` : `<span style="color:var(--good)">${I.tick}</span>`, html: last }))) return;
  await sleep(460);
  if (!alive()) return;
  const rt = $('#p-rt');
  rt.dataset.stop = '1';
  rt.textContent = '1.8s';
  addLines(miss
    ? line({ cls: 'stop', icon: I.shield, html: before ? `Stopped before it ran. Nothing reached ${safe(app)}.` : 'Flagged, with its receipt, in 1.8 seconds.' })
    : line({ cls: 'good', icon: I.ticks, html: `Proven in ${safe(app)} in 1.8 seconds`, right: `<span style="font:600 12px var(--mono);color:var(--ink2)">rcp_${(Number(String(ex.key).split('_').pop()) || 2048) % 9000 + 1000}</span>` }));
  c.done.preview = true;
  paintHead();
  paintSteps();
  paintFoot();
  save();
  if (rp && !miss) {
    await sleep(420);
    if (!alive()) return;
    const money = ['stripe', 'shopify', 'quickbooks'].includes(s.app) && r.type !== 'approval-over';
    addLines(line({ cls: 'muted sep', icon: I.receipt, html: `Last week, on <b>${fmtN(rp.seen)}</b> ${safe(rp.plural)}: it would have stopped <b>${fmtN(rp.wouldStop)}</b>${money ? ` and kept <b>${safe(C.money(rp.saved))}</b>` : ''}.` }));
    countUp($$('#p-lines .ln:last-child b'));
  }
}

// ─── 3. Connect, read-only ──────────────────────────

function agentOf(c) {
  const r = ruleOf(c);
  const op = C.operation(r);
  const f = W.fleet?.find((x) => x.op === op);
  const need = C.hookNeeds(c.rules);
  const hooked = S.hooked.has(op) || c.hook.state === 'ok';
  // Reporting a result needs the check it answers, so a report implies a check.
  return { name: f?.name ?? `Your ${r.slots.action} agent`, op, checks: need.check || need.report ? (!!f || hooked) : null, reports: need.report ? hooked : null };
}
const agentOk = (c) => { const a = agentOf(c); return a.checks !== false && a.reports !== false; };
const appsOf = (c) => readsOf(c).map((x) => {
  const have = S.grants.get(x.app) ?? new Set();
  const missing = [...x.objects.keys()].filter((o) => !have.has(o));
  return { id: x.app, name: x.name, connected: S.connected.has(x.app), missing, ok: S.connected.has(x.app) && !missing.length };
});
const allOk = (c) => appsOf(c).every((n) => n.ok) && agentOk(c);

/** Exactly what the contract reads, per app: each record, and the fields on it. */
function readsOf(c) {
  const out = new Map();
  for (const r of c.rules.filter((x) => x.type)) {
    const s = r.slots;
    const object = r.type === 'end-state' ? s.object : r.type === 'order-before' ? C.ACTIONS.find((a) => a.id === s.first)?.object ?? s.first : C.ACTIONS.find((a) => a.id === s.action)?.object ?? s.action;
    const x = out.get(s.app) ?? { app: s.app, name: C.appName(s.app), objects: new Map(), why: [] };
    const fields = x.objects.get(`${object}s`) ?? new Set();
    for (const f of C.spec(r).find((y) => y.k === 'match')?.fields ?? []) if (f !== 'approver') fields.add(f);
    fields.add('status');
    x.objects.set(`${object}s`, fields);
    x.why.push(C.sentence(r));
    out.set(s.app, x);
  }
  return [...out.values()];
}
const readsText = (x) => [...x.objects].map(([o, f]) => `${o} (${[...f].join(', ')})`).join('; ');

function connectPanel(again) {
  const c = S.c;
  const reads = new Map(readsOf(c).map((x) => [x.app, x]));
  const lines = [];
  for (const n of appsOf(c)) {
    const x = reads.get(n.id);
    lines.push(line({ key: `app:${n.id}:${n.ok}`, icon: `<span class="mk" style="background:${appColor(n.id)}">${safe(n.name[0])}</span>`, html: `<b>${safe(n.name)}</b>, read-only<small>Reads ${safe(readsText(x))}</small>`,
      right: n.ok ? `${I.tick}Connected <button class="link" data-perms="${safe(n.id)}" style="font-size:12.5px">Permissions</button>` : `<span style="color:var(--amber)">${n.connected ? `Needs ${safe(list(n.missing))}` : 'Not connected'}</span>` }));
  }
  lines.push(line({ cls: 'muted', key: 'never', icon: `<span style="color:var(--red)">${I.x}</span>`, html: 'Never creates, changes or cancels anything' }));
  const a = agentOf(c);
  const act = ruleOf(c).slots.action;
  const yes = `<span style="color:var(--good)">${I.tick}</span>`;
  const no = '<span style="width:7px;height:7px;border-radius:50%;background:var(--line2)"></span>';
  if (a.checks !== null) lines.push(line({ cls: `sep ${a.checks ? '' : 'muted'}`, key: `chk:${a.checks}`, icon: a.checks ? yes : no, html: `<b>${safe(a.name)}</b> asks Lumni before each ${safe(act)}` }));
  if (a.reports !== null) lines.push(line({ cls: a.reports ? '' : 'muted', key: `rep:${a.reports}`, icon: a.reports ? yes : no, html: `${a.checks !== null ? 'and tells' : `<b>${safe(a.name)}</b> tells`} Lumni when it’s done, with the result` }));
  if (!agentOk(c)) {
    if (c.hook.state === 'waiting') {
      lines.push(line({ cls: 'skel', key: 'wait', icon: '<span class="spin"></span>', html: `<span style="color:var(--ink2);font-size:13.5px">Waiting for the first call from ${safe(a.name.replace(/^Your /, 'your '))}</span>`, right: Shell.isReal ? '' : '<button class="link" data-testcall>Send a test call</button>' }));
    } else {
      lines.push(`<div class="ln" data-key="hook:${c.hook.tool}"><span class="li"></span><div class="lt hook">
        <div style="font-size:13px;color:var(--ink2);margin-bottom:8px">Your coding agent adds a small hook, without changing how the ${safe(act)} runs.</div>
        <div class="seg sm" role="tablist">${Object.entries(TOOLS).map(([k, v]) => `<button role="tab" data-tool="${k}" aria-selected="${c.hook.tool === k}">${v}</button>`).join('')}</div>
        <div class="diff">${C.hookLines(c, a.checks === true).map(([keep, l]) => `<span class="${keep ? 'keep' : 'add'}">${keep ? '  ' : '+ '}${safe(l)}</span>`).join('')}</div>
        <details class="more"><summary>See the whole task</summary><pre>${safe(C.agentTask(c, a.name, c.hook.tool))}</pre></details></div></div>`);
    }
  }
  if (allOk(c)) lines.push(line({ cls: 'good sep', key: 'ok', icon: I.ticks, html: 'Everything’s connected, read-only' }));
  const box = $('#p-lines');
  if (!again || !box || $('#c-panel').dataset.stage !== 'connect') {
    setPanel('connect', 'Connect, read-only', 'only what the preview used', lines.join(''));
  } else {
    const prev = new Set($$('[data-key]', box).map((x) => x.dataset.key));
    morph($('#c-sheet'), () => { box.innerHTML = lines.join(''); });
    for (const x of $$('[data-key]', box)) if (prev.has(x.dataset.key)) x.style.animation = 'none';
  }
  if (allOk(c) && !c.done.connect) { c.done.connect = true; save(); }
  paintHead();
  paintSteps();
  paintFoot();
}

// ─── the permission card ────────────────────────────

const NEVER = {
  stripe: ['Create charges, refunds or payouts', 'Change or cancel subscriptions', 'See card or bank numbers'],
  shopify: ['Create orders or refunds', 'Change products, prices or stock'],

/** Ask for exactly what the contract reads, and say what Lumni will never do. */
function openPerms(id) {
  const c = S.c;
  const x = readsOf(c).find((r) => r.app === id);
  if (!x) return;
  closePerms();
  const have = S.grants.get(id) ?? new Set();
  const connected = S.connected.has(id);
  const all = [...x.objects.keys()].every((o) => have.has(o)) && connected;
  const res = (o) => cap(o);

  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="m-logos"><span class="ml lumni">${I.spark}</span><span class="m-link"><i></i><i></i><i></i><i></i><i></i></span><span class="ml" style="background:${appColor(id)}">${safe(x.name[0])}</span></div>

          <span class="m-pill ${have.has(o) && connected ? 'had' : 'new'}">${have.has(o) && connected ? 'Already allowed' : 'Read'}</span></div>`).join('')}
      </div>
      <div class="m-why"><span>Why</span>${x.why.map(safe).join(' ')}</div>
      <div class="m-sec"><div class="m-h">Lumni will never</div>
        ${(NEVER[id] ?? ['Create, change or delete anything']).map((t, i) => `<div class="m-row never" style="animation-delay:${0.32 + i * 0.06}s"><span class="m-ic no">${I.x}</span><div><b>${safe(t)}</b></div><span class="m-pill none">No access</span></div>`).join('')}
      </div>
      ${id === 'stripe' ? `<div class="m-key">Restricted key ${[...x.objects.keys()].map((o) => `<code>${safe(res(o))}: Read</code>`).join('')}<code class="none">Everything else: None</code></div>` : ''}
      <div class="m-foot"><span class="m-lock">${I.shield}Encrypted. Revoke any time.</span>
        <button class="quiet-b" data-mclose>${all ? 'Close' : 'Cancel'}</button>
        ${all ? '' : `<button class="primary violet" data-allow="${safe(id)}" ${Shell.isReal ? `disabled title="${NO_API}"` : ''}><span>${I.shield}Allow read-only access</span></button>`}
      </div>
    </div>`;
  document.body.append(back);
  if (!calm) {
    back.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });

  }
  later(() => ($('[data-allow]', back) ?? $('[data-mclose]', back))?.focus({ preventScroll: true }), 50);
