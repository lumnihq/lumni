function closePerms() {
  const back = $('.m-back');
  if (!back) return;
  if (calm) return back.remove();
  back.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }).onfinish = () => back.remove();
}

/** Allowed: the button turns into a tick, the card closes, the row updates. */
function allowPerms(id) {
  const back = $('.m-back');
  const btn = $('[data-allow]', back);
  btn.disabled = true;
  btn.innerHTML = `<span>${whiteSpin}Connecting read-only</span>`;
  wait(() => {
    S.connected.add(id);
    const g = S.grants.get(id) ?? new Set();
    for (const o of readsOf(S.c).find((r) => r.app === id)?.objects.keys() ?? []) g.add(o);
    S.grants.set(id, g);
    btn.classList.add('ok');
    btn.innerHTML = `<span>${I.tick}Allowed, read-only</span>`;
    for (const p of $$('.m-pill.new', back)) { p.className = 'm-pill had'; p.textContent = 'Allowed'; }
    $('.m-link', back)?.classList.add('on');
    wait(() => { closePerms(); connectPanel(true); }, 900);
  }, 1100);
}

// ─── 4. Turn it on ──────────────────────────────────

function onPanel() {
  if (Shell.isReal) return onPanelReal();
  const c = S.c;
  const r = ruleOf(c);
  const act = r.slots.action;
  if (c.mode === 'draft') {
    const m = S.pick ?? 'watch';
    setPanel('on', 'Turn it on', 'switch any time', [
      line({ icon: m === 'watch' ? I.eye : I.shield, html: m === 'watch' ? `<b>Watch</b>: Lumni checks every ${safe(act)} and records what it would stop` : `<b>Protect</b>: Lumni steps in on every ${safe(act)}, from the next one`, key: `m:${m}` }),
      line({ cls: 'muted', icon: I.receipt, html: m === 'watch' ? 'Nothing is blocked. Protect when the record looks right.' : 'Each one it stops gets a receipt you can share.', key: `m2:${m}` }),
    ].join(''), { reveal: $('#c-panel').dataset.stage !== 'on' });
  } else {
    const rp = c.rp;
    setPanel('on', STATE[c.mode], '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--good)"><span style="width:7px;height:7px;border-radius:50%;background:var(--good)"></span>live</span>', [
      line({ icon: `<span style="color:var(--good)">${I.tick}</span>`, html: c.mode === 'protect' ? `Lumni steps in on every ${safe(act)}` : `Lumni checks every ${safe(act)}; nothing is blocked`, key: 'a' }),
      line({ icon: I.receipt, html: 'A receipt for each, in <a class="link" href="/journey?story=omar">the journey</a>', key: 'b' }),
      ...(rp ? [line({ cls: 'muted', icon: I.spark, html: `Last week it would have stopped <b>${fmtN(rp.wouldStop)}</b>`, key: 'c' })] : []),
    ].join(''));
  }
  paintHead();
  paintSteps();
  paintFoot();
}

async function turnOn(m) {
  const c = S.c;
  const was = c.mode;
  let first = !S.list.includes(c);
  if (Shell.isReal) {
    if (c.busy) return;
    c.busy = true;
    paintFoot();
    try {
      const x = await API.mode(c, m);
      Object.assign(c, { mode: x.mode, was: x.was, revision: x.revision, effective: x.effective });
    } catch (e) {
      Shell.toast(e.status === 409 && /bindings|ready/.test(e.message) ? 'It isn’t ready to run yet: finish its bindings in Connect.' : e.message, 'bad');
      return;
    } finally {
      c.busy = false;
      paintFoot();
    }
    S.pick = m;
    first = was === 'draft';
    if (S.c !== c) return;
    onPanel();
    paintMine(first ? c : undefined);
    Shell.toast(m === 'protect' ? `${c.title} is protecting.` : was === 'draft' ? `${c.title} is watching. Nothing is blocked.` : `${c.title} is only watching again.`);
    wait(() => {
      const head = $('#c-head')?.getBoundingClientRect();
      if (!head) return;
      const x = head.left + head.width / 2;
      celebrate(x, head.top + 30);
      stamp(x + 90, head.top + 6, m === 'protect' ? 'Protected!' : 'It’s live!');
      if (first) wait(() => carry(c, $('#c-head .ttl').getBoundingClientRect()), 450);
    }, calm ? 60 : 260);
    return;
  }
  c.mode = m;
  S.pick = m;
  if (first) S.list.push(c);
  if (!c.rp) sample(c);
  save();
  onPanel();
  paintMine(first ? c : undefined);
  Shell.toast(m === 'protect' ? `${c.title} is protecting.` : was === 'draft' ? `${c.title} is watching. Nothing is blocked.` : `${c.title} is only watching again.`);
  // Going on is worth a moment: a burst and a stamp on the card, and the
  // first time, the contract carried over to Your contracts.
  wait(() => {
    const head = $('#c-head')?.getBoundingClientRect();
    if (!head) return first && paintMine();
    const x = head.left + head.width / 2;
    celebrate(x, head.top + 30);
    stamp(x + 90, head.top + 6, m === 'protect' ? 'Protected!' : 'It’s live!');
    if (first) wait(() => carry(c, $('#c-head .ttl').getBoundingClientRect()), 450);
  }, calm ? 60 : 260);
}

function stamp(x, y, word) {
  const glow = document.createElement('div');
  glow.className = 'spray';
  const el = document.createElement('div');
  el.className = 'stamp';
  el.innerHTML = `${safe(word)}<small>Lumni’s got it from here</small>`;
  for (const d of [glow, el]) { d.style.left = `${x}px`; d.style.top = `${y}px`; document.body.append(d); }
  const t = 'translate(-50%, -50%) rotate(-9deg)';
  el.animate(calm
    ? [{ opacity: 0 }, { opacity: 1, offset: 0.15 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }]
    : [{ opacity: 0, transform: `${t} scale(1.6)` }, { opacity: 1, transform: `${t} scale(.94)`, offset: 0.14 }, { transform: `${t} scale(1)`, offset: 0.22 }, { opacity: 1, transform: `${t} scale(1)`, offset: 0.8 }, { opacity: 0, transform: `${t} translateY(-14px) scale(1.02)` }],
    { duration: 2200, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  glow.animate([{ opacity: 0 }, { opacity: 1, offset: 0.15 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: 2200, fill: 'forwards' });
  setTimeout(() => { el.remove(); glow.remove(); }, 2400);
}

/** A small burst of confetti from a point on screen. */
function celebrate(x, y) {
  const n = calm ? 28 : 110;
  const reach = calm ? 0.45 : 1;
  const box = document.createElement('div');
  box.className = 'confetti';
  document.body.append(box);
  const COLORS = ['#5b4bf5', '#8578ff', '#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#d4f56a'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = `${x}px`;
    p.style.top = `${y}px`;
    p.style.background = COLORS[i % COLORS.length];
    if (i % 3 === 0) { p.style.width = '7px'; p.style.height = '7px'; p.style.borderRadius = '50%'; }
    box.append(p);
    const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
    const v = (240 + Math.random() * 320) * reach;
    const dx = Math.cos(a) * v;
    const dy = Math.sin(a) * v;
    const spin = (Math.random() - 0.5) * 1080;
    p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${dx * 0.7}px, ${dy * 0.7}px) rotate(${spin * 0.5}deg)`, opacity: 1, offset: 0.45 },
      { transform: `translate(${dx}px, ${dy + 380 * reach}px) rotate(${spin}deg)`, opacity: 0 },
    ], { duration: 1300 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
  }
  setTimeout(() => box.remove(), 2400);
}

/** The contract, lifted from the card and set down in Your contracts. */
function carry(c, from) {
  const row = $(`.mc[data-open="${CSS.escape(c.id)}"]`);
  if (!row) return;
  let done = false;
  const land = () => { if (done) return; done = true; row.classList.remove('arriving'); row.classList.add('landed'); };
  const to = row.getBoundingClientRect();
  const g = document.createElement('div');
  g.className = 'ghost-card';
  g.innerHTML = `<i class="${c.mode}"></i>${safe(c.title)}`;
  g.style.left = `${from.left}px`;
  g.style.top = `${from.top - 8}px`;
  document.body.append(g);
  const dx = to.left - from.left;
  const dy = to.top - from.top + 8;
  g.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 0 },
    { transform: 'translate(0,-14px) scale(1.04)', opacity: 1, offset: 0.12 },
    { transform: `translate(${dx * 0.55}px, ${dy * 0.55 - 90}px) scale(.96)`, opacity: 1, offset: 0.55 },
    { transform: `translate(${dx}px, ${dy}px) scale(.9)`, opacity: 0.85 },
  ], { duration: calm ? 600 : 950, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' }).onfinish = () => { g.remove(); land(); };
  // A background tab pauses the flight; the contract still lands.
  setTimeout(() => { g.remove(); land(); }, 1500);
}

function hl(code, lang) {
  const kw = lang === 'py' ? /\b(def|from|import|assert|return|await|async|None|True|False)\b/g : /\b(import|from|const|await|async|return|expect|describe|it)\b/g;
  return safe(code).split('\n').map((ln) => {
    if (/^\s*(\/\/|#)/.test(ln)) return `<span class="c">${ln}</span>`;
    return ln.replace(/(&#39;[^&]*?&#39;|&quot;[^&]*?&quot;|“[^”]*”)/g, '<span class="s">$1</span>').replace(kw, '<span class="k">$1</span>').replace(/\b(replay|run|toHaveLength|toBe|toEqual|toBeLessThanOrEqual)\b(?=\()/g, '<span class="f">$1</span>');
  }).join('\n');
}

function writeTest(lang = 'ts') {
  if (Shell.isReal) return writeTestReal(lang);
  const c = S.c;
  const { ex } = sample(c);
  const box = $('#extra');
  const code = C.testFor(c, lang, ex);
  box.innerHTML = `<div class="codecard"><div class="hd">Regression test, from the one it would stop<div class="seg sm" style="margin-left:8px"><button data-lang="ts" aria-selected="${lang === 'ts'}">vitest</button><button data-lang="py" aria-selected="${lang === 'py'}">pytest</button></div><button class="x" data-closetest>Close</button></div>
    <pre class="code"></pre>
    <div class="ft"><button class="ghost" data-copy="code" data-lang2="${lang}">${I.copy}Copy</button><button class="ghost" data-copy="prompt" data-lang2="${lang}">${I.copy}Copy prompt for your coding agent</button></div></div>`;
  const pre = $('pre', box);
  const lines = code.split('\n');
  let i = 0;
  const step = () => {
    if (!pre.isConnected) return;
    i = Math.min(lines.length, i + 1);
    pre.innerHTML = hl(lines.slice(0, i).join('\n'), lang);
    if (i < lines.length) later(step, 26);
  };
  step();
  later(() => box.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' }), 60);
}

// ─── your contracts ─────────────────────────────────

function paintMine(arriving) {
  const el = $('#mine');
  if (!el) return;
  $('#minepanel').hidden = !S.list.length;
  const all = [...S.list].reverse();
  const shown = S.showAll ? all : all.slice(0, 4);
  const row = (c, i) => `<button class="mc ${c === S.c ? 'cur' : ''} ${c === arriving ? 'arriving' : ''}" data-open="${safe(c.id)}" style="animation-delay:${i * 0.04}s"><i class="${c.mode}"></i><b>${safe(c.title)}</b><span>${safe(STATE[c.mode])}, ${safe(c.rules.filter((r) => r.type).map((r) => C.short(r)).join(', '))}</span></button>`;
  el.innerHTML = shown.map(row).join('') + (all.length > 4 ? `<button class="more-btn" data-more aria-expanded="${!!S.showAll}">${S.showAll ? 'Show fewer' : `Show all ${all.length}`}${I.more}</button>` : '');
}

function startNew() {
  S.c = null;
  S.miss = false;
  S.pick = undefined;
  S.stage = 'describe';
  S.run++;
  S.entered = false;
  S.draft = { text: '', forced: {}, over: {} };
  $('#extra').innerHTML = '';
  const card = $('#card');
  card.hidden = true;
  card.innerHTML = '';
  paintTop(true);
  paintMine();
  window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
}

/** Open a saved contract on its card, as it is now. */
function openContract(c) {
  S.c = c;
  S.miss = false;
  S.pick = c.mode === 'paused' ? c.was ?? 'watch' : c.mode;
  S.draft = { text: c.text, forced: { ...c.forced }, over: { ...c.over } };
  S.entered = true;
  paintTop(false);
  const card = $('#card');
  card.hidden = true;
  card.innerHTML = '';
  if (Shell.isReal) { S.pv = null; S.needs = null; S.dirty = false; return goStage(c.mode === 'draft' ? 'connect' : 'on'); }
  goStage('on');
}

// ─── real data ──────────────────────────────────────
//
// Drafts live in the API. Connect binds each rule to the calls your agents
// make, with GET /needs saying what's still missing; Preview replays the bound
// rules on recorded actions; Turn on changes the mode. Unknown numbers are dashes.

const dash = R.dash;
const when = (t) => (t ? new Date(t).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '—');
const opsOf = (c) => [...new Set(c.rules.map((r) => String(r.binding?.operation ?? '').trim()).filter(Boolean))];
const amber = (html) => `<span style="color:var(--amber)">${html}</span>`;

/** Your contracts from the API, then the one the address asks for. */
async function loadReal(first) {
  const s = S;
  try {
    s.list = (await API.list()).sort((a, b) => String(a.created).localeCompare(String(b.created)));
  } catch (e) {
    Shell.toast(`Your contracts couldn’t load: ${e.message}`, 'bad');
  }
  if (S !== s) return;
  paintMine();
  const want = new URLSearchParams(location.search);
  const c = want.get('open') && s.list.find((x) => x.id === want.get('open'));
  if (first && c) {
    openContract(c);
    if (want.get('edit')) reopen();
    return;
  }
  if (first) shot();
}

/** Keep the rule as a draft in the API (create, or edit at its revision), then bind it. */
async function commitReal(rules) {
  const editing = S.c;
  if (S.saving) return;
  const next = { title: C.title(rules), text: S.draft.text.trim(), rules: R.carryBindings(rules, editing?.rules) };
  S.saving = true;
  paintFoot();
  let c;
  try {
    c = editing ? await API.save({ ...next, id: editing.id, revision: editing.revision }) : await API.create(next);
  } catch (e) {
    Shell.toast(e.status === 409 && /not ready/.test(e.message) ? 'It’s running, so every rule has to stay bound. Pause it first, or keep its bindings.' : e.message, 'bad');
    return;
  } finally {
    S.saving = false;
    paintFoot();
  }
  if (editing) { Object.assign(editing, c, { hook: editing.hook }); c = editing; } else S.list.push(c);
  S.c = c;
  S.miss = false;
  Object.assign(S, { pv: null, needs: null, hooks: null, dirty: false, raw: {} });
  S.draft.text = c.text;
  paintTop(false);
  paintMine();
  Shell.toast(editing ? 'Saved.' : 'Draft saved. Nothing runs until you turn it on.');
  goStage('connect');
}

/** What the workspace has set up (read bindings, verifiers), and what the API says this contract still needs. */
async function readNeeds(c, fresh) {
  if (!S.ctx) {
    const [bindings, verifiers] = await Promise.all([API.bindings().catch(() => []), API.verifiers().catch(() => [])]);
    S.ctx = { bindings, verifiers };
  }
  if (fresh || !S.needs) {
    const [needs, hooks] = await Promise.all([API.needs(c).catch(() => null), API.hooks(c).catch(() => [])]);
    if (S.c !== c) return;
    S.needs = needs;
    S.hooks = hooks;
  }
  if (!S.dirty) c.done.connect = !!S.needs?.ready;
}

/** Connect: each rule's bindings, then Lumni's check. */
async function bindPanel(fresh) {
  const c = S.c;
  const run = S.run;
  if (!S.ctx || !S.needs || fresh === true) {
    if (!$('#c-panel .bind')) setPanel('connect', 'Connect it to your agents’ calls', '<span class="spin"></span>checking', skel('Reading what’s set up in your workspace'));
    await readNeeds(c, fresh === true);
    if (S.run !== run || S.stage !== 'connect' || S.c !== c) return;
  }
  const known = [...S.ctx.bindings.map((b) => b.operation), ...(W.fleet ?? []).map((f) => f.op), ...c.rules.map((r) => C.operation(r))];
  const ops = [...new Set(known.filter(Boolean))].sort();
  const html = `<datalist id="ops">${ops.map((o) => `<option value="${safe(o)}"></option>`).join('')}</datalist>${c.rules.map(bindBlock).join('')}<div id="bind-check" class="lines" style="margin-top:4px">${checkHtml(c)}</div>`;
  const box = $('#p-lines');
  if (box && $('#c-panel').dataset.stage === 'connect' && $('.bind', box)) morph($('#c-sheet'), () => { box.innerHTML = html; $('#p-rt').textContent = 'what each rule reads'; });
  else setPanel('connect', 'Connect it to your agents’ calls', 'what each rule reads', html, { stagger: 0.05 });
  paintHead();
  paintSteps();
  paintFoot();
}

function bindBlock(r, i) {
  const miss = R.missing(r);
  const guess = R.suggest(r, S.ctx);
  const op = String(r.binding?.operation ?? '').trim().toLowerCase();
  const h = S.hooks?.find((x) => x.operation === op);
  const slots = miss.filter((m) => m.field.startsWith('slot:')).map((m) => `<div class="seen">${amber(I.warn)}${safe(m.why)}, in <button class="link" data-back style="font-size:12.5px">your words</button></div>`).join('');
  const seen = !h || !op || S.dirty ? '' : `<div class="seen"><i class="${h.status === 'observed' ? 'on' : ''}"></i>${h.status === 'observed'
    ? `${dash(h.checks_observed)} ${h.checks_observed === 1 ? 'check' : 'checks'} on ${safe(op)} since it was made${h.results_observed ? `, ${dash(h.results_observed)} with results` : ''}`
    : `No checks on ${safe(op)} seen yet. That’s not an error: they show up once an agent asks Lumni before this operation.`}</div>`;
  return `<div class="bind" data-rule="${i}"><div class="bind-h"><b>${safe(C.short(r))}</b><span class="kind">${safe(r.type)}</span>${status(miss)}</div>
    ${R.fields(r.type).map((f) => fieldRow(r, i, f, guess, miss)).join('')}${slots}${seen}</div>`;
}
const status = (miss) => `<span class="st2 ${miss.length ? '' : 'ok'}">${miss.length ? `${miss.length} to fill` : `${I.tick}Bound`}</span>`;

function fieldRow(r, i, f, guess, miss) {
  const L = R.LABELS[f];
  const v = r.binding?.[f];
  const id = `bf-${i}-${f}`;
  const err = fieldErr(r, i, f, miss);
  const shown = (x) => (x == null ? '' : typeof x === 'object' ? JSON.stringify(x) : String(x));
  const ph = shown(guess[f]) || L.eg;
  let input;
  if (f === 'read_binding_id' || f === 'verifier_id') {
    const opts = f === 'read_binding_id'
      ? S.ctx.bindings.filter((b) => b.read_only).map((b) => ({ id: b.id, text: `${b.id} (${b.app})`, off: b.enabled === false }))
      : S.ctx.verifiers.map((x) => ({ id: x.id, text: `${x.name ?? x.id} (${x.id})`, off: !x.enabled }));
    if (v && !opts.some((o) => o.id === v)) opts.unshift({ id: v, text: `${v} (not found)`, off: false });
    input = `<select id="${id}" data-bf="${i}|${f}"><option value="">${opts.length ? 'Pick one' : 'None set up yet'}</option>${opts.map((o) => `<option value="${safe(o.id)}" ${o.id === v ? 'selected' : ''} ${o.off ? 'disabled' : ''}>${safe(o.text)}${o.off ? ', off' : ''}</option>`).join('')}</select>`;
  } else if (f === 'expected') {
    input = `<textarea id="${id}" data-bf="${i}|${f}" placeholder="${safe(ph)}" spellcheck="false">${safe(S.raw?.[`${i}|${f}`] ?? shown(v))}</textarea>`;
  } else {
    input = `<input id="${id}" data-bf="${i}|${f}" value="${safe(shown(v))}" placeholder="${safe(ph)}" ${/operation$/.test(f) ? 'list="ops"' : ''} spellcheck="false" autocomplete="off" />`;
  }
  return `<div class="bf ${err ? 'bad' : ''}" data-f="${i}|${f}"><label for="${id}">${safe(L.label)}<small>${safe(L.why)}</small></label>${input}<div class="err">${safe(err)}</div></div>`;
}

/** What's wrong with one field: the rule's own check, then what the API said about it. */
function fieldErr(r, i, f, miss) {
  const raw = S.raw?.[`${i}|${f}`];
  if (f === 'expected' && raw?.trim() && !(r.binding?.expected && typeof r.binding.expected === 'object')) return 'That isn’t a JSON object yet';
  const m = miss.find((x) => x.field === f);
  if (m) {
    if (f === 'read_binding_id' && !S.ctx.bindings.some((b) => b.read_only)) return 'No read-only bindings here yet: register one with PUT /v1/tool-bindings/{id}';
    if (f === 'verifier_id' && !S.ctx.verifiers.some((x) => x.enabled)) return 'No enabled verifiers here yet: add one with POST /v1/verifiers';
    return m.why;
  }
  if (S.dirty || !S.needs) return '';
  const v = r.binding?.[f];
  if (f === 'read_binding_id' && v && S.needs.reads.has(v)) return R.says(S.needs.reads.get(v));
  if (f === 'verifier_id' && v && S.needs.verifiers.has(v)) return R.says(`verifier: ${v}`);
  return '';
}

/** Lumni's check, from GET /needs: what each read is granted, and whether it can run. */
function checkHtml(c) {
  if (S.dirty) return line({ cls: 'muted sep', key: 'dirty', icon: I.pen, html: 'Save the bindings and Lumni checks them' });
  const n = S.needs;
  if (!n) return line({ cls: 'muted sep', key: 'nocheck', icon: amber(I.warn), html: 'Lumni couldn’t check these bindings just now' });
  const out = n.apps.map((a, j) => line({ cls: j ? '' : 'sep', key: `app:${a.binding_id}`, icon: `<span class="mk" style="background:${appColor(a.app)}">${safe((a.app || a.binding_id || '?')[0].toUpperCase())}</span>`,
    html: `<b>${safe(a.binding_id)}</b>, read-only<small>${Object.entries(a.objects ?? {}).map(([o, f]) => `${safe(o)} (${safe(f.join(', '))})`).join('; ') || 'Nothing listed'}. Granted by your operator; ${safe(C.appName(a.app) || 'the app')}’s own permissions aren’t inspected.</small>`,
    right: a.granted ? `${I.tick}Granted` : amber(a.configured ? 'Needs a read grant' : 'Not registered') }));
  if (n.ready) out.push(line({ cls: `good ${out.length ? '' : 'sep'}`, key: 'ready', icon: I.ticks, html: 'Every rule is bound. Lumni can preview it and run it.' }));
  else for (const [j, m] of [...n.general, ...[...n.verifiers].map((v) => `verifier: ${v}`), ...(n.apps.length ? [] : n.reads.values())].entries()) out.push(line({ cls: `muted ${out.length || j ? '' : 'sep'}`, key: `m${j}`, icon: amber(I.warn), html: safe(R.says(m)) }));
  return out.join('');
}

/** After a keystroke: only the field hints, the counts and the foot change, so focus stays put. */
function refreshBind() {
  const c = S.c;
  for (const el of $$('.bind[data-rule]')) {
    const i = Number(el.dataset.rule);
    const r = c.rules[i];
    const miss = R.missing(r);
    for (const row of $$('.bf', el)) {
      const f = row.dataset.f.split('|')[1];
      const err = fieldErr(r, i, f, miss);
      row.classList.toggle('bad', !!err);
      $('.err', row).textContent = err;
    }
    $('.st2', el).outerHTML = status(miss);
    for (const x of $$('.seen', el)) if ($('i', x)) x.remove();
  }
  const chk = $('#bind-check');
  if (chk) chk.innerHTML = checkHtml(c);
  paintSteps();
  paintFoot();
}

document.addEventListener('input', (e) => {
  const el = e.target.closest?.('[data-bf]');
  if (!el || !S?.c || !Shell.isReal) return;
  const [i, f] = el.dataset.bf.split('|');
  const r = S.c.rules[Number(i)];
  const b = (r.binding ??= {});
  if (f === 'expected') {
    S.raw[`${i}|${f}`] = el.value;
    try { const v = JSON.parse(el.value); b.expected = v && typeof v === 'object' && !Array.isArray(v) ? v : undefined; } catch { b.expected = undefined; }
  } else b[f] = el.value;
  S.dirty = true;
  S.c.done.connect = false;
  S.c.done.preview = false;
  refreshBind();
});

/** Fill every empty field with Lumni's guess, for you to check before saving. */
function guessAll() {
  for (const r of S.c.rules) r.binding = R.fillGuesses(r, S.ctx);
  S.raw = {};
  S.dirty = true;
  bindPanel();
  Shell.toast('Filled in Lumni’s guesses. Check them, then save.');
}

async function saveBindings() {
  const c = S.c;
  if (c.busy) return;
  c.busy = true;
  paintFoot();
  try {
    const x = await API.save(c);
    Object.assign(c, { revision: x.revision, rules: x.rules, title: x.title, mode: x.mode, was: x.was, effective: x.effective });
    S.dirty = false;
    S.raw = {};
  } catch (e) {
    Shell.toast(e.status === 409 && /not ready/.test(e.message) ? 'It’s running, so its bindings must be complete and granted before they save.' : e.message, 'bad');
    return;
  } finally {
    c.busy = false;
    paintFoot();
  }
  S.pv = null;
  c.done.preview = false;
  await bindPanel(true);
  Shell.toast(S.needs?.ready ? 'Saved. Every rule is bound.' : 'Saved. Lumni says what’s still missing below.');
}

function primaryReal(c) {
  if (S.stage === 'connect') {
    const left = c.rules.reduce((n, r) => n + R.missing(r).length, 0);
    const empty = S.ctx && c.rules.some((r) => Object.keys(R.suggest(r, S.ctx)).some((k) => r.binding?.[k] == null || r.binding[k] === ''));
    const second = empty ? '<button class="quiet-b" data-guess>Fill in Lumni’s guesses</button>' : '';
    if (c.busy) return { act: '', label: `${whiteSpin}Saving`, off: true };
    if (S.dirty) return { act: 'bind-save', label: `Save bindings${left ? `, ${left} left` : ''}`, second };
    if (left) return { act: '', label: `${left} ${left === 1 ? 'field' : 'fields'} to fill`, off: true, second };
    return { act: 'to-preview', label: `Preview it${I.arrow}` };
  }
  if (S.stage === 'preview') {
    if (S.pvFail) return { act: 'to-connect', label: 'Back to Connect' };
    return c.done.preview ? { act: 'on', label: `Turn it on${I.arrow}` } : { act: '', label: `${whiteSpin}Replaying`, off: true };
  }
  if (c.mode === 'draft') {
    const ready = !!S.needs?.ready;
    return { act: 'go-on', label: c.busy ? `${whiteSpin}Turning on` : (S.pick ?? 'watch') === 'protect' ? 'Protect now' : 'Start watching', violet: true, off: !ready || c.busy, title: ready ? '' : 'Finish its bindings in Connect first' };
  }
  return { act: 'test', label: `${I.spark}Write the regression test`, second: '<button class="quiet-b" data-new>New contract</button>' };
}

/** Preview: the API replays the bound rules on the last 7 days of recorded actions. */
async function previewReal() {
  const c = S.c;
  const run = S.run;
  const alive = () => S.run === run && S.stage === 'preview' && S.c === c;
  const title = 'Preview on last week’s actions';
  Object.assign(S, { pv: null, pvFail: null });
  c.done.preview = false;
  const left = c.rules.flatMap(R.missing);
  if (left.length || S.dirty) {
    S.pvFail = 'bind';
    setPanel('preview', title, '', line({ cls: 'muted', icon: amber(I.warn), html: `A replay needs every rule bound to the calls your agents make${S.dirty ? ', and saved' : ''}. ${left.length ? `${left.length} ${left.length === 1 ? 'field is' : 'fields are'} still empty.` : ''}` }));
    return paintFoot();
  }
  setPanel('preview', title, '<span class="spin"></span>replaying', skel('Replaying your recorded actions from the last 7 days'));
  paintFoot();
  let p;
  try {
    p = await API.preview(c);
  } catch (e) {
    if (!alive()) return;
    S.pvFail = e.message;
    setPanel('preview', title, '', line({ cls: 'muted', icon: amber(I.warn), html: `The replay didn’t run: ${safe(R.says(e.message))}` }));
    return paintFoot();
  }
  if (!alive()) return;
  S.pv = p;
  c.done.preview = true;
  const ops = list(opsOf(c));
  const L = [];
  if (!p.seen) {
    L.push(line({ cls: 'muted', icon: I.receipt, html: `No recorded <b>${safe(ops)}</b> actions in the last 7 days, so there’s nothing to replay yet. Check the operation’s name, or turn it on in Watch and let it record.` }));
  } else {
    L.push(line({ icon: I.receipt, html: `Replayed <b>${dash(p.seen)}</b> recorded ${safe(ops)} ${p.seen === 1 ? 'action' : 'actions'} from the last 7 days` }));
    L.push(line({ cls: p.wouldStop ? 'stop' : 'good', icon: p.wouldStop ? I.shield : I.ticks, html: p.wouldStop ? `It would have stopped <b>${dash(p.wouldStop)}</b>` : 'It would have stopped none of them' }));
    L.push(line({ cls: 'muted', icon: `<span style="color:var(--good)">${I.tick}</span>`, html: `<b>${dash(p.verified)}</b> proven in the app, <b>${dash(p.gaps)}</b> not proven` }));
    for (const ex of p.examples.slice(0, 3)) L.push(line({ cls: 'muted', icon: `<span style="color:var(--accent)">${I.x}</span>`, html: `<span style="font:600 12.5px var(--mono)">${safe(ex.action_id)}</span> ${safe(ex.operation ?? '')}`, right: `<span style="color:var(--ink3);font-weight:500">${safe(when(ex.at))}</span>` }));
  }
  if (p.unavailable) L.push(line({ cls: 'muted', icon: amber(I.warn), html: `${dash(p.unavailable)} had no retained evidence to replay, so they count as unknown, not as kept` }));
  else if (p.truncated) L.push(line({ cls: 'muted', icon: amber(I.warn), html: 'It stopped at 10,000 actions; the rest weren’t replayed' }));
  L.push(line({ cls: 'muted sep', icon: I.spark, html: p.saved == null ? 'Kept: — <small>Lumni doesn’t measure money kept yet</small>' : `Kept <b>${safe(C.money(p.saved))}</b>` }));
  setPanel('preview', title, `${dash(p.seen)} replayed`, L.join(''));
  paintHead();
  paintSteps();
  paintFoot();
}

/** Turn it on, or how it's running: the week from GET /week. */
async function onPanelReal() {
  const c = S.c;
  const run = S.run;
  const ops = list(opsOf(c)) || 'its operation';
  if (c.mode === 'draft') {
    const m = S.pick ?? 'watch';
    const base = [
      line({ icon: m === 'watch' ? I.eye : I.shield, html: m === 'watch' ? `<b>Watch</b>: Lumni checks every ${safe(ops)} and records what it would stop` : `<b>Protect</b>: Lumni steps in on every ${safe(ops)}, from the next one`, key: `m:${m}` }),
      line({ cls: 'muted', icon: I.receipt, html: m === 'watch' ? 'Nothing is blocked. Protect when the record looks right.' : 'Each one it stops gets a receipt you can share.', key: `m2:${m}` }),
    ];
    const paint = () => {
      const n = S.needs;
      const why = !n ? [skel()] : n.ready ? [] : [line({ cls: 'muted sep', key: 'nr', icon: amber(I.warn), html: `It can’t run yet: ${[...n.general, ...n.reads.values(), ...[...n.verifiers].map((v) => `verifier: ${v}`)].map((x) => safe(R.says(x))).join('. ')}. <button class="link" data-tobind>Finish in Connect</button>` })];
      setPanel('on', 'Turn it on', 'switch any time', [...base, ...why].join(''), { reveal: $('#c-panel').dataset.stage !== 'on' });
      paintHead();
      paintSteps();
      paintFoot();
    };
    paint();
    if (!S.needs) { await readNeeds(c); if (S.run === run && S.stage === 'on' && S.c === c) paint(); }
    return;
  }
  const paused = c.mode === 'paused';
  const eff = c.effective;
  const head = [
    line({ icon: `<span style="color:${paused ? 'var(--ink3)' : 'var(--good)'}">${I.tick}</span>`, key: 'a', html: paused ? `Paused: Lumni isn’t checking ${safe(ops)}. Pick Watch or Protect to resume.` : c.mode === 'protect' ? `Lumni steps in on every ${safe(ops)}` : `Lumni checks every ${safe(ops)}; nothing is blocked` }),
    ...(c.mode === 'protect' && eff && eff !== 'ENFORCE' ? [line({ cls: 'muted', key: 'eff', icon: amber(I.warn), html: eff === 'MIXED' ? 'Some of its operations are enforced in this workspace and some aren’t, so not every one it stops is blocked' : `Enforcement for ${safe(ops)} is ${safe(eff)} in this workspace, so what it stops is recorded, not blocked` })] : []),
  ];
  const right = paused ? '<span style="color:var(--ink3)">paused</span>' : '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--good)"><span style="width:7px;height:7px;border-radius:50%;background:var(--good)"></span>live</span>';
  setPanel('on', STATE[c.mode], right, [...head, skel()].join(''));
  paintHead();
  paintSteps();
  paintFoot();
  const wk = await API.week(c).catch(() => null);
  if (S.run !== run || S.stage !== 'on' || S.c !== c) return;
  const stop = c.mode === 'protect' ? wk?.stopped : wk?.wouldStop;
  addLines([
    line({ cls: 'sep', key: 'w1', icon: I.receipt, html: `This week: <b>${dash(wk?.seen)}</b> checks, <b>${dash(wk?.verified)}</b> proven in the app` }),
    line({ key: 'w2', icon: c.mode === 'protect' ? I.shield : I.eye, html: `${c.mode === 'protect' ? 'Stopped' : 'Would have stopped'} <b>${dash(stop)}</b>` }),
    line({ cls: 'muted', key: 'w3', icon: I.spark, html: wk?.saved == null ? 'Kept: — <small>Lumni doesn’t measure money kept yet</small>' : `Kept <b>${safe(C.money(wk.saved))}</b>` }),
  ].join(''));
}

/** A regression test from a recorded run: GET /tests replays its retained fixture. */
async function writeTestReal(lang) {
  const c = S.c;
  const box = $('#extra');
  const head = (what) => `<div class="hd">Regression test, ${what}<div class="seg sm" style="margin-left:8px"><button data-lang="ts" aria-selected="${lang === 'ts'}">node:test</button><button data-lang="py" aria-selected="${lang === 'py'}">unittest</button></div><button class="x" data-closetest>Close</button></div>`;
  box.innerHTML = `<div class="codecard">${head('from a recorded run')}<pre class="code">Loading…</pre></div>`;
  const pre = $('pre', box);
  try {
    const runs = await API.runs(c, 20);
    const pick = runs.find((x) => x.broke) ?? runs[0];
    if (!pick) { pre.textContent = 'There’s no recorded run to make a test from yet. Once it has checked one, the test replays it.'; return; }
    const t = await API.tests(c, lang, pick.id);
    S.test = t;
    box.innerHTML = `<div class="codecard">${head(`from ${safe(pick.id)}`)}<pre class="code">${hl(t.code, lang)}</pre>
      <div class="ft"><button class="ghost" data-copyreal>${I.copy}Copy ${safe(t.filename ?? '')}</button></div></div>`;
  } catch (e) {
    pre.textContent = e.message;
  }
  later(() => box.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' }), 60);
}

// ─── clicks ─────────────────────────────────────────

let tokMenu = null;
function closeMenus() { tokMenu?.remove(); tokMenu = null; }

function openTok(tok) {
  const [i, slot] = tok.dataset.tok.split('|');
  const r = draftRules()[Number(i)];
  if (!r || S.stage !== 'describe') return;
  const opts = [...new Set([r.slots[slot], ...(C.OPTIONS[slot] ?? [])])];
  closeMenus();
  tokMenu = document.createElement('div');
  tokMenu.className = 'tokmenu';
  tokMenu.innerHTML = opts.map((o) => `<button class="${o === r.slots[slot] ? 'cur' : ''}" data-set="${safe(String(o))}">${safe(C.say(slot, o))}</button>`).join('');
  const box = tok.getBoundingClientRect();
  const st = $('.stage').getBoundingClientRect();
  tokMenu.style.left = `${box.left - st.left}px`;
  tokMenu.style.top = `${box.bottom - st.top + 6}px`;
  $('.stage').append(tokMenu);
  tokMenu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-set]');
    if (!b) return;
    const v = typeof r.slots[slot] === 'number' ? Number(b.dataset.set) : b.dataset.set;
    closeMenus();
    S.draft.over[r.text] = { ...(S.draft.over[r.text] ?? {}), [slot]: v };
    paintSees();
    paintCard();
  });
}

/** Type a rule in, a few letters at a time, so you watch Lumni read it. */
function typeInto(text) {
  const ta = $('#say');
  if (!ta) return;
  S.draft = { text: '', forced: {}, over: {} };
  ta.value = '';
  let i = 0;
  const step = () => {
    if (!ta.isConnected) return;
    i = Math.min(text.length, i + (calm ? text.length : 2));
    ta.value = text.slice(0, i);
    ta.dispatchEvent(new Event('input'));
    if (i < text.length) later(step, 18);
  };
  step();
  ta.focus({ preventScroll: true });
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (!t.closest('.tokmenu') && !t.closest('[data-tok]')) closeMenus();
  const q = (sel) => t.closest(sel);
  let x;
  if ((x = q('[data-try]'))) return typeInto(EXAMPLES[Number(x.dataset.try)].t);
  if ((x = q('[data-add]'))) {
    const ta = $('#say');
    ta.value = `${ta.value.replace(/[.\s]+$/, '')}${x.dataset.add}.`;
    ta.dispatchEvent(new Event('input'));
    ta.focus();
    return;
  }
  if ((x = q('[data-tok]'))) return openTok(x);
  if ((x = q('[data-choose]'))) {
    const [i, type] = x.dataset.choose.split('|');
    S.draft.forced[draftRules()[Number(i)].text] = type;
    paintSees();
    paintCard();
    return;
  }
  if ((x = q('[data-manual]'))) {
    S.draft.picking = { ...(S.draft.picking ?? {}), [draftRules()[Number(x.dataset.manual)].text]: true };
    return paintCard();
  }
  if (q('[data-edit]')) return reopen();
  if (q('[data-back]')) {
    const i = STEPS.findIndex(([id]) => id === S.stage);
    if (i <= 0) return reopen();
    if (STEPS[i - 1][0] === 'preview') S.miss = false;
    return goStage(STEPS[i - 1][0]);
  }
  if (q('[data-new]')) return startNew();
  if (q('[data-more]')) { S.showAll = !S.showAll; return paintMine(); }
  if ((x = q('[data-open]'))) {
    const c = S.list.find((y) => y.id === x.dataset.open);
    if (c) openContract(c);
    return;
  }
  if ((x = q('[data-step]')) && !x.disabled) {
    const id = x.dataset.step;
    if (id === S.stage) return;
    if (id === 'preview') S.miss = false;
    return goStage(id);
  }
  if ((x = q('[data-pick]')) && !x.disabled) {
    const m = x.dataset.pick;
    if (S.c && S.c.mode !== 'draft') { if (m !== S.c.mode) turnOn(m); return; }
    S.pick = m;
    paintFoot();
    if (S.stage === 'on') onPanel();
    return;
  }
  if (q('[data-guess]')) return guessAll();
  if (q('[data-tobind]')) return goStage('connect');
  if (q('[data-miss]')) { S.miss = !S.miss; S.c.done.preview = false; S.run++; paintSteps(); paintFoot(); return runPreview(); }
  if ((x = q('[data-primary]')) && !x.disabled) {
    const act = x.dataset.primary;
    if (act === 'preview') return commit();
    if (act === 'connect') return goStage('connect');
    if (act.startsWith('app:')) return openPerms(act.slice(4));
    if (act === 'copy') {
      const c = S.c;
      navigator.clipboard?.writeText(C.agentTask(c, agentOf(c).name, c.hook.tool)).then(() => Shell.toast(`Task copied. Paste it into ${TOOLS[c.hook.tool]}.`), () => {});
      c.hook.state = 'waiting';
      save();
      connectPanel(true);
      // In the demo, the agent's first call arrives on its own after a moment.
      if (!Shell.isReal) wait(() => { if (c.hook.state === 'waiting') { c.hook.state = 'ok'; S.hooked.add(agentOf(c).op); save(); if (S.stage === 'connect') connectPanel(true); } }, 3400);
      return;
    }
    if (act === 'on') return goStage('on');
    if (act === 'go-on') return turnOn(S.pick ?? 'watch');
    if (act === 'test') return writeTest('ts');
    if (act === 'bind-save') return saveBindings();
    if (act === 'to-preview') return goStage('preview');
    if (act === 'to-connect') return goStage('connect');
    return;
  }
  if ((x = q('[data-perms]'))) return openPerms(x.dataset.perms);
  if (q('[data-mclose]') || t.classList.contains('m-back')) return closePerms();
  if ((x = q('[data-allow]')) && !x.disabled) return allowPerms(x.dataset.allow);
  if ((x = q('[data-tool]'))) { S.c.hook.tool = x.dataset.tool; save(); connectPanel(true); return; }
  if (q('[data-testcall]')) { const c = S.c; c.hook.state = 'ok'; S.hooked.add(agentOf(c).op); save(); return connectPanel(true); }
  if (q('[data-skip]')) { S.c.done.connect = true; save(); return goStage('on'); }
  if ((x = q('[data-lang]'))) return writeTest(x.dataset.lang);
  if (q('[data-copyreal]')) { navigator.clipboard?.writeText(S.test?.code ?? '').then(() => Shell.toast('Test copied.'), () => Shell.toast('Couldn’t copy here.', 'bad')); return; }
  if (q('[data-closetest]')) { $('#extra').innerHTML = ''; return; }
  if ((x = q('[data-copy]'))) {
    const c = S.c;
    const { ex } = sample(c);
    const l = x.dataset.lang2;
    const text = x.dataset.copy === 'code' ? C.testFor(c, l, ex) : C.agentPrompt(c, l, ex);
    navigator.clipboard?.writeText(text).then(() => Shell.toast(x.dataset.copy === 'code' ? 'Test copied.' : 'Prompt copied. Paste it into Claude Code, Codex or Cursor.'), () => Shell.toast('Couldn’t copy here.', 'bad'));
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePerms(); });

// ─── motion helpers ─────────────────────────────────

/** Letters settle into place, left to right. */
function settle(el, dur = 340) {
  if (calm || !el) return;
  const nodes = [];
  const walk = (n) => { for (const k of n.childNodes) k.nodeType === 3 ? nodes.push([k, k.textContent]) : walk(k); };
  walk(el);
  const total = nodes.reduce((s, [, t]) => s + t.length, 0);
  const AZ = 'abcdefghijklmnopqrstuvwxyz';
  const t0 = performance.now();
  const frame = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    let left = Math.floor(total * k);
    for (const [n, t] of nodes) {
      const keep = Math.max(0, Math.min(t.length, left));
      left -= t.length;
      n.textContent = t.slice(0, keep) + [...t.slice(keep, keep + 4)].map((ch) => (ch === ' ' ? ' ' : AZ[(Math.random() * 26) | 0])).join('');
    }
    if (k < 1 && el.isConnected) requestAnimationFrame(frame);
    else for (const [n, t] of nodes) n.textContent = t;
  };
  requestAnimationFrame(frame);
}

function countUp(els) {
  for (const b of els) {
    const m = b.textContent.match(/^(\$?)([\d,]+)$/);
    if (!m || calm) continue;
    const to = Number(m[2].replace(/,/g, ''));
    const t0 = performance.now();
    const f = (now) => {
      const k = Math.min(1, (now - t0) / 800);
      b.textContent = `${m[1]}${fmtN(to * (1 - (1 - k) ** 3))}`;
      if (k < 1 && b.isConnected) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
}

// ─── screenshot states ──────────────────────────────
// ?shot=typing | typed | ready | ask | preview | proven | miss | connect | perms | waiting | on | live | test | party

async function shot() {
  // In the story, step 1 types the business's intent, and step 2 reads it
  // into a contract and replays it on past runs.
  const story = Shell.isReal ? null : new URLSearchParams(location.search).get('story');
  const s = new URLSearchParams(location.search).get('shot') ?? { intent: 'typed', contract: 'proven' }[story];
  if (!s) return;
  await sleep(300);
  if (s === 'party') { celebrate(520, 420); stamp(640, 380, 'It’s live!'); return; }
  if (s === 'typing') return typeInto('Never refund the same order twice');
  const text = story ? Story.INTENT : { ask: 'don’t refund twice and check stripe', waiting: 'Every successful cancellation must leave the subscription inactive in Stripe.' }[s] ?? EXAMPLES[0].t;
  typeInto(text);
  // Go on once it's all in the box and read, however long typing took
  // (reduced motion shortens every wait, but not the box's own debounce).
  while ($('#say')?.isConnected && S.draft.text !== text) await new Promise((r) => wait(r, 100));
  await sleep(700);
  if (s === 'typed') return;
  enter();
  if (s === 'ready' || s === 'ask') return;
  await sleep(1400);
  commit();
  if (s === 'preview') return;
  if (!S.c) return;
  for (let i = 0; i < 40 && !S.c.done.preview; i++) await sleep(150);
  if (s === 'proven') return;
  if (s === 'miss') { await sleep(300); $('[data-miss]')?.click(); return; }
  await sleep(700);
  $('[data-primary="connect"]')?.click();
  await sleep(600);
  if (s === 'connect') return;
  if (s === 'perms') { $('[data-primary^="app:"]')?.click(); return; }
  if (s === 'waiting') { $('[data-primary="copy"]')?.click(); return; }
  for (let i = 0; i < 20 && !allOk(S.c); i++) { if (!$('.m-back')) $('[data-primary^="app:"]')?.click(); await sleep(200); $('[data-allow]')?.click(); await sleep(2200); $('[data-testcall]')?.click(); $('[data-primary="copy"]')?.click(); await sleep(300); }
  await sleep(700);
  $('[data-primary="on"]')?.click();
  await sleep(600);
  if (s === 'on') return;
  $('[data-primary="go-on"]')?.click();
  if (s === 'live') return;
  await sleep(1500);
  if (s === 'test') $('[data-primary="test"]')?.click();
}

Story.mount();
Shell.boot({ nav: 'Contracts', onWorld: render });
