  realStudio();
}

// ─── your workspace: when each rule started protecting ──

/** The audit's start for a protecting rule: the last time its mode was set to Enforce, and its last edit. */
function startOf(r) {
  const pr = policyOf(r.id);
  if (!pr || !REAL.audit) return { start: null, edit: null, added: pr?.created_at ? Date.parse(pr.created_at) : null };
  const hits = (e) => {
    const t = e.target ?? {};
    return e.type === 'enforcement.set' && e.after?.mode === 'ENFORCE' && (t.operation === pr.operation || t.operation === '*') && ((t.rule ?? '*') === pr.reason_code || (t.rule ?? '*') === '*');
  };
  const start = REAL.audit.filter(hits).map((e) => ({ at: Date.parse(e.at), by: e.by })).sort((a, b) => b.at - a.at)[0] ?? null;
  const edit = REAL.audit.filter((e) => e.type === 'policy_rule.updated' && e.target?.id === r.id).map((e) => ({ at: Date.parse(e.at), by: e.by, before: e.before, after: e.after })).sort((a, b) => b.at - a.at)[0] ?? null;
  return { start, edit, added: pr.created_at ? Date.parse(pr.created_at) : null };
}
const shortWhen = (ms) => {
  const o = { timeZone: W.zone || undefined };
  if (ms >= W.dayStart) return new Date(ms).toLocaleTimeString('en-US', { ...o, hour: 'numeric', minute: '2-digit' }) + ' today';
  return new Date(ms).toLocaleDateString('en-US', { ...o, ...(W.dayStart - ms < 6 * DAY ? { weekday: 'short' } : {}), month: 'short', day: 'numeric' });
};
/** Matches since a moment, from the rules view's daily counts: whole days from its start, and today. */
function sinceCount(r, at) {
  const first = W.dayStart - 7 * DAY;
  if (at >= W.dayStart) return { n: r.today.did, scope: 'today' };
  const i = Math.floor((at - first) / DAY);
  if (i < 0) return { n: r.days.reduce((a, b) => a + b, 0) + r.today.did, scope: 'week' };
  return { n: r.days.slice(i).reduce((a, b) => a + b, 0) + r.today.did, scope: 'since' };
}

function realBack(f) {
  const r = f.rule;
  return `<div class="s-top"><span class="tag" style="background:var(--ink);color:#fff">Protecting</span><span class="tag">Since ${safe(new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }))}</span><span class="r">${safe(r.area)}</span></div>
    <h2 class="s-h">Protecting. Lumni steps in for real now.</h2>
    <div class="rule" style="background:#fff"><div class="lab">The rule</div><div class="sentence" style="font-size:22px">${safe(r.text)}.</div></div>
    ${weekBars(r.days, r.today.did + r.today.would)}
    <div class="expect">
      <div><small>Last week it matched</small><b>${fmtN(r.lastWeek)}</b> ${plural(r.lastWeek, 'action', 'actions')}</div>
      <div><small>From now on</small><b>Each match</b> is ${r.verb === 'asked' ? 'held for a person' : r.verb === 'waited' ? 'made to wait' : 'stopped'}</div>
      <div><small>Changed your mind</small><b>Move it back</b> to watching at any time</div>
    </div>
    <div class="back-foot"><p>Reading your workspace again, so the page shows what Lumni says.</p></div>`;
}

async function realAction(kind, el) {
  const f = REAL.list.find((x) => x.id === REAL.sel);
  if (!f) return;
  const busy = (t) => { el.disabled = true; el.textContent = t; };
  if (kind === 'checker') {
    busy('Switching on…');
    const r = await Shell.write('POST', `/v1/console/apps/${encodeURIComponent(f.app.id)}/checker`, { on: true }, { ok: `${f.app.name}’s checker is on. New actions get read back.` });
    if (!r) realStudio();
  } else if (kind === 'protect') {
    busy('Protecting…');
    const r = await Shell.write('PUT', `/v1/console/rules/${encodeURIComponent(f.rule.id)}/mode`, { mode: 'ENFORCE' }, { ok: `Protecting. “${clip(f.rule.text, 60)}” steps in for real now.`, reload: false });
    if (!r) return realStudio();
    // The card flips to its protecting side, then the workspace is read again.
    $('#back').innerHTML = realBack(f);
    const flip = $('#flip');
    flip.classList.remove('lift'); void flip.offsetWidth; flip.classList.add('lift', 'on');
    REAL.flipped = f.rule.id;
    setTimeout(() => Shell.refresh(), 2600);
  } else if (kind === 'edit') {
    openEdit(f.rule);
  } else if (kind === 'cancel') {
    delete REAL.try[f.rule.id];
    const ed = $('#edit'); if (ed) { ed.hidden = true; ed.innerHTML = ''; }
    const t = $('#rsent .tok'); if (t) t.textContent = thresholdLabel(f.rule, tried(f.rule.id));
    runPreview(f.rule);
  } else if (kind === 'save') {
    saveThreshold(f.rule, el);
  } else if (kind === 'remove') {
    askRemove(f.rule);
  } else if (kind === 'keep') {
    $('#rmNote')?.remove();
    const row = $('#ruleActs'); row.classList.remove('confirm');
    row.innerHTML = row.dataset.was;
  } else if (kind === 'confirm-remove') {
    removeRule(f.rule, el);
  } else if (kind === 'template') {
    busy('Adding…');
    const t = f.templates.find((x) => x.id === el.dataset.t);
    const r = await Shell.write('POST', '/v1/console/rules', { template: el.dataset.t }, { ok: `Added. “${clip(t?.text ?? 'The rule', 60)}” is watching.` });
    if (!r) realStudio();
    else REAL.sel = null;
  }
}

function realRunning(rv) {
  if (!rv) return `<div class="running-h"><h2>Fixes already running</h2><p>Your rules couldn’t be read just now, so this is empty. Read it again in a moment.</p></div>`;
  const on = rv.rules.filter((r) => r.mode === 'ENFORCE');
  const spark = (days, today, startAt) => {
    const v = [...days, today], max = Math.max(1, ...v), Wd = 300, H = 56;
    const x = (i) => (i / (v.length - 1)) * Wd, y = (n) => H - 4 - (n / max) * (H - 10);
    // Shade from the day it started protecting, when that's within the week; else today.
    const si = startAt == null ? 6 : Math.max(0, Math.min(7, (startAt - (W.dayStart - 7 * DAY)) / DAY));
    return `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" aria-hidden="true"><rect x="${x(Math.min(6, si))}" y="0" width="${Wd - x(Math.min(6, si))}" height="${H}" fill="var(--accent-soft)" rx="6"/>${startAt != null && si > 0 ? `<line x1="${x(Math.min(6, si))}" x2="${x(Math.min(6, si))}" y1="0" y2="${H}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 3"/>` : ''}
      <path d="M${v.map((n, i) => `${x(i).toFixed(1)},${y(n).toFixed(1)}`).join(' L')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${Wd}" cy="${y(today)}" r="3.5" fill="var(--accent)"/></svg>`;
  };
  const built = `<article class="card run" style="animation-delay:.3s">
      <div class="top1"><span class="ai lum" style="width:22px;height:22px;font-size:9.5px;border-radius:6px">L</span>Built in<span class="state prot">Protecting</span></div>
      <p class="big">Lumni’s own checks stepped in <em>${fmtN(rv.today.lumni)}</em> ${plural(rv.today.lumni, 'time', 'times')} today</p>
      <div class="rl">Repeats, old reads and turn-taking, on every action. Nothing to set up.</div></article>`;
  const did = (r) => (r.verb === 'asked' ? 'Asked a person' : r.verb === 'waited' ? 'Made an AI wait' : 'Stopped');
  const cards = on.map((r, i) => {
    const fresh = REAL.flipped === r.id;
    const { start, edit, added } = startOf(r);
    // When it started protecting, from Lumni's record; else when the rule was added.
    let big, since;
    if (start) {
      const c = sinceCount(r, start.at);
      since = `Since ${shortWhen(start.at)}`;
      big = `Protecting since ${safe(shortWhen(start.at))}. ${did(r)} <em>${fmtN(c.n)}</em> ${plural(c.n, 'time', 'times')} ${c.scope === 'today' ? 'today' : c.scope === 'week' ? 'in the last 7 days' : 'since then'}`;
    } else {
      since = added ? `Added ${shortWhen(added)}` : 'Protecting';
      big = `${did(r)} <em>${fmtN(r.today.did)}</em> ${plural(r.today.did, 'time', 'times')} today, ${fmtN(r.lastWeek)} last week`;
    }
    const startAt = start?.at ?? null;
    const by = (x) => (x.by === 'system' ? 'Lumni' : safe(x.by ?? 'someone'));
    const edits = edit ? `Changed ${safe(shortWhen(edit.at))} by ${by(edit)}${edit.before?.numeric_threshold != null && edit.after?.numeric_threshold != null && edit.before.numeric_threshold !== edit.after.numeric_threshold ? `: ${safe(thresholdLabel(r, edit.before.numeric_threshold))} to ${safe(thresholdLabel(r, edit.after.numeric_threshold))}` : ''}.` : '';
    return `<article class="card run ${fresh ? 'fresh' : ''}" style="animation-delay:${0.36 + i * 0.07}s">
      <div class="top1"><span class="ar">${safe(r.area)}</span><span class="state prot">${fresh ? 'Protecting, just now' : 'Protecting'}</span></div>
      <p class="big">${big}</p>
      ${spark(r.days, r.today.did + r.today.would, startAt)}
      <div class="ft"><span>Last 7 days</span><span>${start ? 'Today' : safe(since)}</span></div>
      <div class="rl">Rule: <b>${safe(r.text)}</b>${start ? `<br>Set to protect by ${by(start)}.` : ''}${edits ? `<br>${edits}` : ''}${!start && REAL.audit ? '<br>Lumni’s record doesn’t say when it started protecting.' : ''}</div></article>`;
  });
  const n = on.length;
  return `<div class="running-h"><h2>Fixes already running</h2><p>${n ? `${n} ${plural(n, 'rule is', 'rules are')} protecting, plus Lumni’s own checks. Start dates come from Lumni’s record of each change; counts are its real matches.` : 'No rule of yours is protecting yet. Lumni’s own checks always are.'}</p></div>
    <div class="runs">${built}${cards.join('')}${n ? '' : `<div class="calm" style="grid-column:span 3;align-self:stretch;display:flex;flex-direction:column;justify-content:center"><b>Protect a rule to see it here</b>Pick a watching rule above and protect it, or add one from a template. Each one shows its matches, day by day.</div>`}</div>`;
}

async function renderReal(w, first) {
  const my = ++READ;
  const old = w.source === 'snapshots';
  const [rv, rules, audit] = await Promise.all([
    Shell.api.get('/v1/console/rules').catch(() => null),
    old ? null : Shell.api.get('/v1/config/policy-rules').then((r) => r?.items ?? [], () => null),
    old ? null : Shell.api.get('/v1/audit?type=enforcement.set,policy_rule.updated&limit=200').then((r) => r?.items ?? [], () => null),
  ]);
  if (my !== READ) return;
  REAL.rv = rv;
  REAL.rules = rules;
  REAL.audit = audit;
  REAL.list = realFindings(w, rv);
  // Needs you links here with ?rule=<policy rule id>; ?pick= names a finding.
  if (first) {
    const q = new URLSearchParams(location.search);
    const want = q.get('rule') ? `rule-${q.get('rule')}` : q.get('pick');
    if (want && REAL.list.some((f) => f.id === want)) REAL.sel = want;
  }
  if (!REAL.list.some((f) => f.id === REAL.sel)) REAL.sel = REAL.list.find((f) => f.state === 'fix' || f.state === 'watching')?.id ?? REAL.list[0]?.id ?? null;
  const handled = REAL.list.filter((f) => f.state === 'handled').length;
  const todo = REAL.list.filter((f) => f.state === 'fix' || f.state === 'watching').length;
  const n = REAL.list.length;
  $('#main').innerHTML = `
    <section class="head ${first ? 'rise' : ''}">
      <div>
        <div class="eyebrow">${safe(w.scale.org)}, ${safe(w.dayLabel)}</div>
        <h1>${n ? `Lumni found ${n} ${plural(n, 'thing', 'things')} worth a look today.` : 'Nothing to fix today.'} <span class="soft">${n ? (todo ? `${todo} you can fix from here${handled ? `, ${handled} already handled` : ''}.` : 'All of it is handled or advice.') : 'Lumni keeps looking.'}</span></h1>
        <p>Each finding comes from today’s ${fmtN(w.total)} ${plural(w.total, 'action', 'actions')} and your rules. New rules start by only watching, until you protect them.</p>
      </div>
      <div class="steps">
        <div><b><i>1</i>${w.source === 'snapshots' ? 'Look back' : 'Back-test'}</b>${w.source === 'snapshots' ? 'Its real matches, last week and today' : 'Replays a rule on the last 7 days'}</div>
        <div><b><i>2</i>Watch</b>Records what it would have done</div>
        <div><b><i>3</i>Protect</b>Steps in for real, when you say so</div>
      </div>
    </section>
    ${rv ? '' : '<div class="calm" style="margin-top:20px">Your rules couldn’t be read just now, so rule findings are missing. Use “Read it again” above.</div>'}
    <section class="grid">
      <div class="list" id="list"></div>
      <div class="studio-wrap ${first ? 'rise' : ''}" style="animation-delay:.12s"><div class="flip" id="flip"><article class="card face front" id="front"></article><article class="card face back" id="back"></article></div></div>
    </section>
    <section class="running ${first ? '' : 'quiet'}" id="running">${realRunning(rv)}</section>`;
  $('#list').classList.toggle('quiet', !first);
  realList();
  realStudio();
  REAL.flipped = null;
  if (first) realShot();
}

$('#main').addEventListener('click', (e) => {
  if (!Shell.isReal) return;
  const card = e.target.closest('.find[data-f]');
  if (card) {
    if (card.dataset.f === REAL.sel) return;
    REAL.sel = card.dataset.f;
    $('#flip').classList.remove('on');
    realList(); realStudio();
    return;
  }
  const tok = e.target.closest('[data-rtok]:not(.ro)');
  if (tok) {
    // Try the next threshold, and back-test it once the clicking settles.
    const f = REAL.list.find((x) => x.id === REAL.sel);
    const r = f?.rule, opts = r?.tokens?.[0]?.options ?? [];
    if (!r || !opts.length) return;
    const cur = Number(tried(r.id));
    const i = opts.findIndex((o) => Number(o.value) === cur);
    const next = Number(opts[(i + 1) % opts.length].value);
    REAL.try[r.id] = next;
    tok.textContent = thresholdLabel(r, next);
    tok.classList.remove('moved'); void tok.offsetWidth; tok.classList.add('moved');
    if ($('#thr')) $('#thr').value = next;
    syncSave(r);
    $('#bt')?.classList.add('busy');
    previewSoon(r);
    return;
  }
  const act = e.target.closest('[data-real]');
  if (act) realAction(act.dataset.real, act);
});

// Real screenshot states: ?shot=protect, ?shot=checker, ?shot=template, ?shot=pick-<finding id>,
// ?shot=preview (try another threshold), ?shot=edit (save one), ?shot=stale (save with an old
// version, so the API answers 409), ?shot=remove-ask and ?shot=remove (remove a watching rule).
async function realShot() {
  const s = new URLSearchParams(location.search).get('shot');
  if (!s) return;
  const pick = (pre) => { const f = REAL.list.find((x) => x.id.startsWith(pre)); if (f) $(`.find[data-f="${CSS.escape(f.id)}"]`)?.click(); return f; };
  await sleep(900);
  if (s.startsWith('pick-')) pick(s.slice(5));
  if (s === 'protect' && pick('rule-')) { await sleep(300); $('[data-real="protect"]')?.click(); }
  if (s === 'checker' && pick('blind-')) { await sleep(300); $('[data-real="checker"]')?.click(); }
  if (s === 'template' && pick('templates')) { await sleep(300); $('[data-real="template"]')?.click(); }
  if (s === 'preview' && pick('rule-')) { await sleep(900); $('#rsent .tok')?.click(); await sleep(150); $('#rsent .tok')?.click(); }
  if ((s === 'edit' || s === 'stale') && pick('rule-')) {
    await sleep(700); $('[data-real="edit"]')?.click();
    const r = REAL.list.find((x) => x.id === REAL.sel).rule;
    const inp = $('#thr'); inp.value = String(Math.round(Number(inp.value) / 2)); inp.dispatchEvent(new Event('input'));
    if (s === 'stale') policyOf(r.id).version -= 1;
    await sleep(900); $('[data-real="save"]')?.click();
  }
  if ((s === 'remove' || s === 'remove-ask') && pick('rule-')) {
    await sleep(700); $('[data-real="remove"]')?.click();
    if (s === 'remove') { await sleep(400); $('[data-real="confirm-remove"]')?.click(); }
  }
}

Shell.boot({ nav: 'Fixes', onWorld: render });
</script>
