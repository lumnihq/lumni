name: Extended checks
# The heavier checks, run by hand or on a release tag: vulnerability scans,
# ClickHouse, Restate, migrations down and up, an image scan, and the
# one-command install end to end with this commit's images.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: lumni, POSTGRES_PASSWORD: lumni, POSTGRES_DB: lumni}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumni -d lumni"
          --health-interval 2s --health-timeout 2s --health-retries 20
      restate:
        image: docker.restate.dev/restatedev/restate@sha256:329e32e12059610b681e165161bcd0722d193325b6c893bc46bfec72cd54b595
        ports: ["9080:8080", "9070:9070"]
        options: --add-host host.docker.internal:host-gateway
    env:
      LUMNI_TEST_DATABASE_URL: postgres://lumni:lumni@localhost:5432/lumni?sslmode=disable
      LUMNI_DATABASE_URL: postgres://lumni:lumni@localhost:5432/lumni?sslmode=disable
      LUMNI_TEST_RESTATE_URL: http://localhost:9080
      LUMNI_TEST_RESTATE_ADMIN_URL: http://localhost:9070
      LUMNI_TEST_RESTATE_HANDLER_HOST: host.docker.internal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.x", cache: true}
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test -race -count=1 -tags=integration ./internal/integration ./internal/store
      - run: go test -tags=integration -run '^$' -bench BenchmarkAdmission -benchtime=200x ./internal/integration
      - run: go run ./cmd/lumni migrate --direction down-to-zero
      - run: go run ./cmd/lumni migrate --direction up
  sdk-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: sdk/typescript/package-lock.json}
      - run: npm ci && npm audit --audit-level=high
        working-directory: sdk/typescript
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install build pip-audit==2.9.0 './sdk/python[langgraph,openai]'
      - run: python -m build && pip-audit
        working-directory: sdk/python
  analytics:
    runs-on: ubuntu-24.04
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7-alpine
        env:
          CLICKHOUSE_DB: lumni
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: lumni
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 3s --health-timeout 2s --health-retries 30
    env:
      LUMNI_TEST_CLICKHOUSE_URL: http://localhost:8123
      LUMNI_CLICKHOUSE_USER: default
      LUMNI_CLICKHOUSE_PASSWORD: lumni
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.x", cache: true}
      - run: docker exec -i "${{ job.services.clickhouse.id }}" clickhouse-client --password lumni --multiquery < deploy/clickhouse/init/001_schema.sql
      - run: go test -count=1 -tags=integration -run TestClickHouseProfile ./internal/integration
  self-host:
    # Self-hosting exactly as docs/self-hosting.md says, with this commit's images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, load: true, tags: "lumni:ci"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: console/Dockerfile, push: false, load: true, tags: "lumni-console:ci"}
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: "lumni:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Self-host, following the guide (these images)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i.bak \
            -e "s/^LUMNI_ADMIN_KEY=$/LUMNI_ADMIN_KEY=lumni_$(openssl rand -hex 24)/" \
            -e "s/^LUMNI_SECRET_ENCRYPTION_KEY=$/LUMNI_SECRET_ENCRYPTION_KEY=$(openssl rand -hex 32)/" \
            -e "s/^LUMNI_CONSOLE_SECRET=$/LUMNI_CONSOLE_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
            .env && rm .env.bak
          sed -i 's/^LUMNI_VERSION=latest$/LUMNI_VERSION=ci/' .env
          printf 'LUMNI_IMAGE=lumni\nLUMNI_CONSOLE_IMAGE=lumni-console\n' >> .env
          docker compose up -d
      - name: Wait for the console and the API
        run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:5200/console/config.json && curl -fsS http://127.0.0.1:8080/v1/health/ready && exit 0; sleep 2; done; exit 1
      - name: Set up the owner, then drive the API with a real workflow
        run: |
          curl -fsS -c /tmp/jar -H 'content-type: application/json' -H 'host: localhost:5200' \
            -d '{"name":"CI Owner","email":"ci@example.com","password":"ci password 123","workspace":"CI"}' \
            http://127.0.0.1:5200/console/auth/setup
          curl -fsS -b /tmp/jar -H 'host: localhost:5200' http://127.0.0.1:5200/v1/auth/session | grep '"signed_in":true'
          LUMNI_URL=http://127.0.0.1:8080 LUMNI_API_KEY=$(sed -n 's/^LUMNI_ADMIN_KEY=//p' deploy/.env) node scripts/try-workflow.mjs
      - if: always()
        working-directory: deploy
        run: docker compose logs --no-color --tail 150
