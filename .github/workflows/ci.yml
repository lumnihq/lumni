name: CI
# Every push and pull request: the Go, console, package and SDK checks.
# Heavier checks live in extended.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: lumni, POSTGRES_PASSWORD: lumni, POSTGRES_DB: lumni}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumni -d lumni"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      LUMNI_TEST_DATABASE_URL: postgres://lumni:lumni@localhost:5432/lumni?sslmode=disable
      LUMNI_DATABASE_URL: postgres://lumni:lumni@localhost:5432/lumni?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.x", cache: true}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -count=1 -tags=integration ./internal/integration ./internal/store
  console:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: console}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun scripts/build.ts
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: sh packages/lumni/scripts/assets.sh
      - run: node --test packages/lumni/test/*.test.mjs
      # The fleet uses the TypeScript SDK's build.
      - run: npm ci && npm run build
        working-directory: sdk/typescript
      - run: node --test
        working-directory: examples/agent-fleet
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm, cache-dependency-path: sdk/typescript/package-lock.json}
      - run: npm ci && npm test
        working-directory: sdk/typescript
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install pytest pytest-asyncio './sdk/python[langgraph,openai]'
      - run: python -m pytest
        working-directory: sdk/python

